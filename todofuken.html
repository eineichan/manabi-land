<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFAF4">
<meta name="description" content="にほんの 47とどうふけんを パズルと クイズで おぼえちゃおう。6さいからの にほんちず パズル。">
<title>にほんちず パズル｜47とどうふけん</title>
<style>
  :root{
    --ivory:#FDFAF4;
    --card:#FFFFFF;
    --ink:#544B46;
    --ink2:#7A6E67;
    --ink3:#A2968D;
    --rose:#D97C8E;
    --rose-d:#A9505F;
    --mint:#9BD3C0;
    --mint-d:#7CBCA6;
    --mustard:#E9C46A;
    --line:#F0E7D9;
    --line2:#E8DDCB;
    --shadow:0 10px 26px rgba(120,101,90,.10);
    --shadow-lg:0 18px 44px rgba(120,101,90,.20);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--ivory);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;overscroll-behavior:none;
    touch-action:manipulation;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 6% 0%,rgba(239,169,184,.20),transparent 42%),
      radial-gradient(circle at 96% 82%,rgba(155,211,192,.22),transparent 46%),
      radial-gradient(circle at 80% 4%,rgba(233,196,106,.14),transparent 34%);
  }
  .app{
    position:relative;z-index:1;max-width:560px;margin:0 auto;
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);
    gap:8px;
  }
  .screen{display:none;flex-direction:column;flex:1;min-height:0;gap:8px}
  .screen.on{display:flex;animation:scrIn .3s ease both}
  @keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- common ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:0;border-radius:22px;font-family:inherit;font-size:19px;font-weight:800;
    letter-spacing:.03em;padding:15px 16px;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn-primary{background:linear-gradient(180deg,#EB9EAE 0%,#D97C8E 100%);color:#fff;box-shadow:0 5px 0 var(--rose-d),0 12px 22px rgba(169,80,95,.24)}
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-d),0 4px 10px rgba(169,80,95,.2)}
  .btn-mint{background:linear-gradient(180deg,#BFE6D8 0%,#9BD3C0 100%);color:#2F5A4E;box-shadow:0 5px 0 var(--mint-d),0 12px 22px rgba(124,188,166,.26)}
  .btn-mint:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mint-d),0 4px 10px rgba(124,188,166,.2)}
  .btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .ibtn{
    width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.94);box-shadow:0 5px 14px rgba(120,101,90,.12);
    color:var(--ink2);font-size:17px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .ibtn:active{transform:scale(.94)}
  .kick{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);
    padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.1em;color:var(--ink2);
  }
  .kick::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose)}

  /* ---------- home ---------- */
  .home-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{margin:2px 0 0;font-size:clamp(28px,8.2vw,36px);line-height:1.16;letter-spacing:.02em;font-weight:800}
  .title em{font-style:normal;color:var(--rose)}
  .sub{margin:-2px 0 0;font-size:14px;line-height:1.6;color:var(--ink2);font-weight:700}
  .hero{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 0;animation:floaty 6s ease-in-out infinite}
  .hero svg{width:100%;height:100%;display:block}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .pcard{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
  .prow{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
  .prow b{font-size:18px;color:var(--ink);letter-spacing:0}
  .prow b i{font-style:normal;font-size:13px;color:var(--ink3);font-weight:800}
  .bar{margin-top:8px;height:10px;border-radius:999px;background:#F3EDE2;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#F2B7C4,#D97C8E);transition:width .6s cubic-bezier(.2,1,.3,1)}
  .hbtns{display:flex;flex-direction:column;gap:9px}

  /* ---------- hud ---------- */
  .hud{display:flex;align-items:center;gap:10px;min-height:44px}
  .hud-mid{flex:1;min-width:0;display:flex;justify-content:center}
  .hud-name{font-size:15px;font-weight:800;letter-spacing:.04em;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud-count{flex:0 0 auto;min-width:42px;display:flex;align-items:baseline;justify-content:flex-end;gap:2px;font-weight:800;color:var(--ink3);font-size:13px}
  .hud-count b{font-size:19px;color:var(--ink)}

  /* ---------- region list ---------- */
  .rlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 0 8px}
  .rcard{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px;
    font-family:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(240,231,217,.7);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .rcard:active{transform:translateY(3px);box-shadow:none}
  .rdot{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
  .rmain{flex:1;min-width:0}
  .rname{display:block;font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rdots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .rdots i{width:7px;height:7px;border-radius:50%;background:#EFE8DC;display:block}
  .rdots i.on{background:var(--c)}
  .rside{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
  .rcount{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.02em}
  .rsub{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:4px;letter-spacing:.02em}
  .crown{font-size:18px;line-height:1}

  /* ---------- map ---------- */
  .map-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .map-wrap > svg{width:100%;height:100%;display:block;overflow:hidden;border-radius:14px}
  .pf{fill:var(--c);stroke:#fff;stroke-width:3;stroke-linejoin:round;transition:fill .3s ease,stroke .2s ease,opacity .3s ease,stroke-width .2s ease}
  .pf.other{fill:#F2ECE1;opacity:.5;stroke:#FBFAF6;stroke-width:2.5}
  .pf.blank{fill:#FFFDF8;stroke:var(--c);stroke-opacity:.5;stroke-width:2.5}
  .pf.done{fill:var(--c)}
  .pf.target{fill:var(--cs);stroke:var(--c);stroke-opacity:1;stroke-width:4;animation:tpulse 1.15s ease-in-out infinite}
  .pf.pop{animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
  .pf.q{fill:var(--cs);stroke:#fff;stroke-width:2.5}
  .pf.qdone{fill:var(--c)}
  .pf.wrong{animation:shake .42s}
  .hit{fill:transparent;stroke:transparent;stroke-width:16;stroke-linejoin:round;pointer-events:all}
  @keyframes tpulse{0%,100%{stroke-width:2.4;stroke-opacity:.5}50%{stroke-width:4.6;stroke-opacity:1}}
  @keyframes popin{0%{transform:scale(.72);opacity:.4}60%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* okinawa chip */
  .ochip{
    position:absolute;right:0;bottom:0;width:28%;max-width:136px;min-width:100px;
    background:rgba(255,255,255,.82);border:2px dashed #BFDCEA;border-radius:14px;
    padding:5px 5px 2px;font-family:inherit;cursor:pointer;display:none;
    box-shadow:0 6px 16px rgba(120,101,90,.08);z-index:3;
  }
  .ochip.on{display:block}
  .ochip svg{width:100%;height:auto;display:block}
  .ochip .pf{stroke-width:2.5}
  .olabel{display:block;text-align:center;font-size:10px;font-weight:800;color:#5E8DA4;letter-spacing:.06em;margin-top:-1px}
  .ochip.sel{border-color:var(--rose);border-style:solid;background:#fff}

  /* ---------- tray ---------- */
  .ply{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
  .tray-wrap{flex:0 0 auto;min-height:0;max-height:42vh;overflow-y:auto}
  .tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:2px 0 0}
  .tray-empty{width:100%;text-align:center;font-size:14px;font-weight:800;color:var(--ink3);padding:14px 0}
  .piece{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:68px;height:62px;gap:1px;border:0;border-radius:16px;background:#fff;
    box-shadow:0 4px 0 #EFE6D8,0 6px 14px rgba(120,101,90,.07);
    font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);
    cursor:pointer;position:relative;padding:4px 2px 3px;
    transition:transform .14s ease,box-shadow .14s ease,opacity .2s ease;
  }
  .piece:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE6D8}
  .piece svg{width:36px;height:30px;display:block}
  .piece .pname{line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
  .piece.sel{transform:translateY(-4px);box-shadow:0 0 0 3px var(--c),0 10px 18px rgba(120,101,90,.16);background:var(--cs)}
  .piece.gone{transform:scale(.4) rotate(8deg);opacity:0;pointer-events:none}

  /* ---------- fact sheet ---------- */
  .fact{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);
    padding:11px 13px;display:flex;gap:11px;align-items:center;
    transform:translateY(130%);opacity:0;transition:transform .38s cubic-bezier(.2,1.15,.3,1),opacity .28s;
    pointer-events:none;
  }
  .fact.on{transform:none;opacity:1}
  .fact .fic{flex:0 0 50px;width:50px;height:50px;border-radius:14px;background:var(--cs);display:flex;align-items:center;justify-content:center;padding:5px}
  .fact .fic svg{width:100%;height:100%;display:block}
  .fact .fic .pf{stroke-width:3}
  .fact .fbody{min-width:0}
  .fact .fname{display:block;font-size:15px;font-weight:800;letter-spacing:.02em}
  .fact .ftxt{margin:2px 0 0;font-size:12.8px;line-height:1.5;color:var(--ink2);font-weight:700}
  .fact .ftag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}

  /* ---------- quiz ---------- */
  .qbox{display:flex;align-items:center;gap:9px;background:#fff;border-radius:20px;padding:11px 13px;box-shadow:var(--shadow)}
  .qtext{flex:1;font-size:17px;font-weight:800;line-height:1.35;letter-spacing:.02em}
  .qtext.ok{color:var(--mint-d)}
  .qtext.ng{color:#C97F58}
  .qsay{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;background:#FBF1E4;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .qsay:active{transform:scale(.93)}

  /* ---------- zukan ---------- */
  .zlist{flex:1;min-height:0;overflow-y:auto;padding:2px 0 12px}
  .zsec{margin-bottom:14px}
  .zhead{display:flex;align-items:center;gap:8px;margin:2px 2px 7px}
  .zhead .rdot{width:14px;height:14px;flex:0 0 14px}
  .zhead span{font-size:14px;font-weight:800;letter-spacing:.03em;color:var(--ink2)}
  .zhead em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--ink3)}
  .zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .zcard{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:7px 4px 6px;font-family:inherit;cursor:pointer}
  .zcard:active{transform:translateY(2px)}
  .zcard svg{width:100%;height:38px;display:block}
  .zcard svg .pf{stroke-width:4}
  .zcard .zname{font-size:11px;font-weight:800;color:var(--ink);letter-spacing:0;line-height:1.2;text-align:center}
  .zcard.off .zname{color:var(--ink3)}
  .zcard.off svg .pf{fill:#EEE7DA;stroke:#F8F4EA}

  /* ---------- overlay ---------- */
  .ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(84,75,70,.34);padding:22px}
  .ov.on{display:grid}
  .ovcard{background:#fff;border-radius:26px;padding:24px 20px 20px;max-width:330px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:popin .4s cubic-bezier(.2,1.4,.4,1)}
  .ovemo{font-size:44px;line-height:1}
  .ovcard h2{margin:8px 0 4px;font-size:19px;line-height:1.35;letter-spacing:.02em}
  .ovtag{font-size:17px;color:var(--rose)}
  .ovcard p{margin:0 0 14px;font-size:13.5px;line-height:1.6;color:var(--ink2);font-weight:700}
  .ovbtns{display:flex;flex-direction:column;gap:8px}
  .ovbtns .btn{font-size:17px;padding:13px;border-radius:18px}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .cf{position:absolute;top:-24px;width:9px;height:13px;border-radius:3px;opacity:.95;animation:cfall linear forwards}
  @keyframes cfall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(var(--dx,0),105vh,0) rotate(760deg)}}

  @media (max-height:660px) and (max-width:819px){
    .piece{width:60px;height:54px;font-size:10.5px;border-radius:14px}
    .piece svg{width:30px;height:24px}
    .tray{gap:5px}
    .title{font-size:26px}
    .sub{font-size:12.5px}
    .btn{font-size:17px;padding:12px}
    .hud{min-height:40px}
    .ibtn{width:38px;height:38px;flex:0 0 38px;font-size:15px}
  }

  /* ---------- iPad / wide ---------- */
  @media (min-width:820px){
    .app{max-width:1080px;padding:16px 26px calc(env(safe-area-inset-bottom,0px) + 18px)}
    .title{font-size:40px}
    .sub{font-size:16px}
    #sc-home{justify-content:center;align-items:center}
    #sc-home .home-top,#sc-home .title,#sc-home .sub{width:100%;max-width:900px}
    #sc-home .title,#sc-home .sub{text-align:center}
    #sc-home .hero{max-height:50vh;width:100%}
    .hbtns{flex-direction:row;gap:12px;max-width:900px;width:100%;align-self:center}
    .hbtns .btn{font-size:18px}
    .pcard{max-width:900px;width:100%;align-self:center}
    #sc-puzzle.on .ply,#sc-quiz.on .ply{flex-direction:row;gap:20px;align-items:stretch}
    #sc-puzzle .map-wrap,#sc-quiz .map-wrap{flex:1 1 auto}
    .tray-wrap{flex:0 0 320px;max-height:none;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
    .tray{justify-content:flex-start}
    .piece{width:82px;height:72px;font-size:13.5px}
    .piece svg{width:38px;height:32px}
    .rlist{max-width:760px;width:100%;align-self:center;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
    .zgrid{grid-template-columns:repeat(5,1fr)}
    .qtext{font-size:19px}
    .fact{max-width:520px;margin:0 auto}
  }
  @media (min-width:820px) and (max-height:620px){
    .hero{display:none}
  }

  /* ---------- まなびランドへ もどる ---------- */
  .home-back{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    width:fit-content;align-self:flex-start;
    padding:6px 13px;border-radius:999px;
    background:#FFFFFF;border:2px solid var(--line,#F0E7D9);
    box-shadow:0 4px 12px rgba(120,101,90,.14);
    color:var(--ink2,#7A6E67);font-family:inherit;
    font-size:12.5px;font-weight:800;letter-spacing:.06em;line-height:1.15;
    text-decoration:none;white-space:nowrap;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .home-back:active{transform:scale(.95);box-shadow:0 2px 6px rgba(120,101,90,.16)}
</style>
</head>
<body>
<div class="app">

  <!-- ===== home ===== -->
  <section class="screen on" id="sc-home">
    <a class="home-back" href="./index.html" aria-label="まなびランドへ もどる">🏠 もどる</a>

    <div class="home-top">
      <span class="kick">47とどうふけん</span>
      <button class="ibtn" id="sndBtn" aria-label="おとの おんおふ">🔊</button>
    </div>
    <h1 class="title">にほんちず<em>パズル</em></h1>
    <p class="sub">ちずを みながら おぼえちゃおう！</p>
    <div class="hero"><svg id="mapHero" aria-hidden="true"></svg></div>
    <div class="pcard">
      <div class="prow"><span>あつめた とどうふけん</span><b><span id="homeCount">0</span> <i>/ 47</i></b></div>
      <div class="bar"><i id="homeBar"></i></div>
    </div>
    <div class="hbtns">
      <button class="btn btn-primary" data-go="region-puzzle">ちほうべつ パズル</button>
      <button class="btn btn-mint" data-go="region-quiz">どこだ？ クイズ</button>
      <button class="btn btn-ghost" data-go="zukan">ずかんを みる</button>
    </div>
  </section>

  <!-- ===== region picker ===== -->
  <section class="screen" id="sc-region">
    <header class="hud">
      <button class="ibtn" data-back>‹</button>
      <div class="hud-mid"><span class="hud-name" id="pickTitle">ちほうを えらんでね</span></div>
      <div class="hud-count" id="pickSide"></div>
    </header>
    <div class="rlist" id="rlist"></div>
  </section>

  <!-- ===== puzzle ===== -->
  <section class="screen" id="sc-puzzle">
    <header class="hud">
      <button class="ibtn" data-back>‹</button>
      <div class="hud-mid"><span class="hud-name" id="pzName">ちほう</span></div>
      <div class="hud-count"><b id="pzCount">0</b><span id="pzTotal">/ 0</span></div>
    </header>
    <div class="ply">
      <div class="map-wrap" id="pzWrap">
        <svg id="mapPuzzle"></svg>
        <button class="ochip" id="okiPuzzle" aria-label="おきなわ">
          <svg viewBox="0 0 300 232" id="okiPuzzleSvg"></svg>
          <span class="olabel">おきなわ</span>
        </button>
        <div class="fact" id="pzFact"></div>
      </div>
      <div class="tray-wrap"><div class="tray" id="tray"></div></div>
    </div>
  </section>

  <!-- ===== quiz ===== -->
  <section class="screen" id="sc-quiz">
    <header class="hud">
      <button class="ibtn" data-back>‹</button>
      <div class="hud-mid"><span class="hud-name" id="qzProg">もんだい 1 / 8</span></div>
      <div class="hud-count"><b id="qzScore">0</b><span>てん</span></div>
    </header>
    <div class="qbox">
      <span class="qtext" id="qzText">よみこみちゅう…</span>
      <button class="qsay" id="qzSay" aria-label="もういちど きく">🔊</button>
    </div>
    <div class="ply">
      <div class="map-wrap" id="qzWrap">
        <svg id="mapQuiz"></svg>
        <button class="ochip" id="okiQuiz" aria-label="おきなわ">
          <svg viewBox="0 0 300 232" id="okiQuizSvg"></svg>
          <span class="olabel">おきなわ</span>
        </button>
        <div class="fact" id="qzFact"></div>
      </div>
    </div>
  </section>

  <!-- ===== zukan ===== -->
  <section class="screen" id="sc-zukan">
    <header class="hud">

  /* ============ map building ============ */
  function buildMap(svg, interactive, withOki){
    svg.innerHTML = "";
    svg.setAttribute("viewBox", "0 0 " + MAP.w + " " + MAP.h);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    var gv = svgEl("g"), gh = svgEl("g");
    var ids = Object.keys(MAP.prefs).map(Number).sort(function(a, b){
      return bboxArea(geom(b)) - bboxArea(geom(a));
    });
    ids.forEach(function(id){
      var g = geom(id), r = reg(id);
      var p = svgEl("path", {d: g.d});
      p.setAttribute("data-pid", id);
      p.setAttribute("class", "pf");
      p.style.setProperty("--c", r.c);
      p.style.setProperty("--cs", r.cs);
      gv.appendChild(p);
      if(interactive){
        var h = svgEl("path", {d: g.d});
        h.setAttribute("data-pid", id);
        h.setAttribute("class", "hit");
        gh.appendChild(h);
      }
    });
    if(withOki){
      // small inset card for Okinawa at the bottom-right corner of the full map
      var bw = 238, bh = 186, bx = MAP.w - bw - 12, by = MAP.h - bh - 10;
      var gIn = svgEl("g", {transform: "translate(" + bx + "," + by + ")"});
      var rect = svgEl("rect", {x: 0, y: 0, width: bw, height: bh, rx: 16, fill: "#F2F8FB", stroke: "#CBE2ED", "stroke-width": 2, "stroke-dasharray": "7 6"});
      gIn.appendChild(rect);
      var s2 = Math.min((bw - 14) / 300, (bh - 14) / 232);
      var gO = svgEl("g", {transform: "translate(" + ((bw - 300 * s2) / 2) + "," + ((bh - 232 * s2) / 2) + ") scale(" + s2 + ")"});
      var op = svgEl("path", {d: MAP.oki.d, "class": "pf", "data-oki": "1"});
      op.style.setProperty("--c", REGIONS[5].c);
      op.style.setProperty("--cs", REGIONS[5].cs);
      op.setAttribute("stroke-width", "6");
      gO.appendChild(op);
      gIn.appendChild(gO);
      svg.appendChild(gIn);
    }
    svg.appendChild(gv);
    if(interactive) svg.appendChild(gh);
    return svg;
  }

  function buildOki(svg, interactive){
    svg.innerHTML = "";
    var p = svgEl("path", {d: MAP.oki.d, "class": "pf"});
    p.style.setProperty("--c", REGIONS[5].c);
    p.style.setProperty("--cs", REGIONS[5].cs);
    p.setAttribute("data-oki", "1");
    svg.appendChild(p);
    if(interactive){
      var h = svgEl("path", {d: MAP.oki.d, "class": "hit"});
      h.setAttribute("data-oki", "1");
      svg.appendChild(h);
    }
  }

  function setVB(svg, vb){ svg.setAttribute("viewBox", vb.map(function(v, i){ return i < 2 ? Math.round(v * 10) / 10 : Math.round(v * 10) / 10; }).join(" ")); }
  function animateVB(svg, to, dur){
    var from = (svg.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    if(from.length !== 4){ setVB(svg, to); return; }
    var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
    if(svg.__raf) cancelAnimationFrame(svg.__raf);
    function step(t){
      var now = t || ((window.performance && performance.now) ? performance.now() : Date.now());
      var k = Math.min(1, (now - t0) / (dur || 520));
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      var cur = [];
      for(var i = 0; i < 4; i++){ cur.push(from[i] + (to[i] - from[i]) * e); }
      setVB(svg, cur);
      if(k < 1){ svg.__raf = requestAnimationFrame(step); }
    }
    svg.__raf = requestAnimationFrame(step);
  }
  function regionVB(r){
    var b = (MAP.regions[String(r)] || [0, 0, MAP.w, MAP.h]).slice();
    var w = b[2] - b[0], h = b[3] - b[1];
    var pad = Math.min(w, h) * 0.07;
    return [b[0] - pad, b[1] - pad, w + pad * 2, h + pad * 2];
  }
  function fullVB(){ return [0, 0, MAP.w, MAP.h]; }
  function mapAspect(svg){
    var r = svg.getBoundingClientRect();
    return (r.width > 4 && r.height > 4) ? (r.width / r.height) : 0.9;
  }
  // grow the viewBox to the element's aspect so nothing outside the region
  // bleeds into the letterbox strips at the sides
  function fitVB(vb, aspect){
    var w = vb[2], h = vb[3];
    if(w / h > aspect){ h = w / aspect; } else { w = h * aspect; }
    var cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
    return [cx - w / 2, cy - h / 2, w, h];
  }
  function goVB(svg, vb, dur){
    svg.__target = vb;
    var t = fitVB(vb, mapAspect(svg));
    if(dur){ animateVB(svg, t, dur); } else { setVB(svg, t); }
  }

  /* ============ screens ============ */
  var SCREENS = {home:"sc-home", region:"sc-region", "region-puzzle":"sc-region", "region-quiz":"sc-region", puzzle:"sc-puzzle", quiz:"sc-quiz", zukan:"sc-zukan"};
  var pickMode = "puzzle";
  function show(name){
    Object.keys(SCREENS).forEach(function(k){ $(SCREENS[k]).classList.remove("on"); });
    $(SCREENS[name]).classList.add("on");
  }
  function go(name, opts){
    S.nav.push({name:name, puzzle:S.puzzle ? {r:S.puzzle.r} : null, quiz:S.quiz ? {r:S.quiz.r} : null});
    enter(name, opts);
  }
  function back(){
    if(S.nav.length > 1){ S.nav.pop(); }
    var prev = S.nav[S.nav.length - 1];
    enter(prev ? prev.name : "home", prev);
  }
  function enter(name, opts){
    name = name || "home";
    if(name === "home"){
      show("home"); paintProgress(); return;
    }
    if(name === "region-puzzle" || name === "region-quiz"){
      pickMode = (name === "region-quiz") ? "quiz" : "puzzle";
      $("pickTitle").textContent = pickMode === "quiz" ? "どこから もんだい？" : "ちほうを えらんでね";
      $("pickSide").textContent = "";
      buildRegionList();
      show("region");
      return;
    }
    if(name === "puzzle"){
      var r = (opts && opts.r) || (S.nav[S.nav.length - 1] && S.nav[S.nav.length - 1].puzzle ? S.nav[S.nav.length - 1].puzzle.r : 1);
      startPuzzle(r, opts && opts.replay);
      return;
    }
    if(name === "quiz"){
      var qr = (opts && opts.r) || null;
      startQuiz(qr);
      return;
    }
    if(name === "zukan"){
      buildZukan(); show("zukan"); return;
    }
  }

  /* ============ puzzle ============ */
  var pz = { r:1, ids:[], placed:{}, sel:null, wrong:0, locked:false };

  function startPuzzle(r, replay){
    pz.r = r;
    pz.ids = BY_REGION[r].slice();
    pz.placed = {};
    if(!replay){
      pz.ids.forEach(function(id){ if(S.found[id]) pz.placed[id] = 1; });
    }
    pz.sel = null; pz.wrong = 0; pz.locked = false; pz.doneOverlay = false;

    $("pzName").textContent = REGIONS[r - 1].name;
    $("pzTotal").textContent = "/ " + pz.ids.length;
    var svg = $("mapPuzzle");
    if(!svg.getAttribute("data-built")){ buildMap(svg, true); svg.setAttribute("data-built", "1"); }
    buildOki($("okiPuzzleSvg"), false);
    $("okiPuzzle").classList.toggle("on", r === 6);
    if(!svg.__wired){ svg.addEventListener("click", onPuzzleClick); svg.__wired = 1; }

      $("okiPuzzle").addEventListener("click", function(){ onPuzzleClick({__oki:true, target:null}); });
      $("okiPuzzle").__wired = 1;
    }
    $("pzCount").textContent = Object.keys(pz.placed).length;
    goVB(svg, fullVB(), 0);
    setTimeout(function(){ goVB(svg, regionVB(r), 620); }, 60);
    paintPuzzle();
    renderTray();

  function paintPuzzle(){
    var svg = $("mapPuzzle");
    var paths = svg.querySelectorAll("path.pf");
    for(var i = 0; i < paths.length; i++){
      var el = paths[i], id = Number(el.getAttribute("data-pid"));
      var cls = "pf";
      if(pz.ids.indexOf(id) < 0){ cls += " other"; }
      else if(pz.placed[id]){ cls += " done"; }
      else {
        cls += " blank";
        if(pz.sel === id) cls += " target";
      }
      el.setAttribute("class", cls);
    }
    var ok = $("okiPuzzleSvg").querySelector("path.pf");
    if(ok){
      var c = "pf";
      if(pz.ids.indexOf(47) < 0) c += " other";
      else if(pz.placed[47]) c += " done";
      else { c += " blank"; if(pz.sel === 47) c += " target"; }
      ok.setAttribute("class", c);
    }
    $("okiPuzzle").classList.toggle("sel", pz.sel === 47);
  }

  function renderTray(){
    var host = $("tray");
    host.innerHTML = "";
    var left = pz.ids.filter(function(id){ return !pz.placed[id]; });
    if(!left.length){
      var d = document.createElement("div");
      d.className = "tray-empty";
      d.textContent = "ぜんぶ はめられたよ！";
      host.appendChild(d);
      return;
    }
    shuffle(left).forEach(function(id){
      var b = document.createElement("button");
      b.className = "piece";
      b.setAttribute("data-id", id);
      b.style.setProperty("--c", reg(id).c);
      b.style.setProperty("--cs", reg(id).cs);
      var nn = P[id].n;
      b.innerHTML = miniSVG(id) + '<span class="pname" style="font-size:' + (nn.length >= 6 ? 10 : (nn.length >= 5 ? 11 : 12)) + 'px">' + nn + '</span>';
      b.addEventListener("click", function(){ selectPiece(id); });
      host.appendChild(b);
    });
    highlightSel();
  }
  function highlightSel(){
    var ps = $("tray").querySelectorAll(".piece");
    for(var i = 0; i < ps.length; i++){
      ps[i].classList.toggle("sel", Number(ps[i].getAttribute("data-id")) === pz.sel);
    }
  }
  function selectPiece(id){
    if(pz.locked) return;
    Audio1.pop();
    pz.sel = (pz.sel === id) ? null : id;
    pz.wrong = 0;
    paintPuzzle(); highlightSel();
    if(pz.sel) say(P[pz.sel].n);
  }

  function onPuzzleClick(e){
    if(pz.locked) return;
    var id;
    if(e && e.__oki) id = 47;
    else {
      var t = e.target;
      if(!t || !t.getAttribute) return;
      var v = t.getAttribute("data-pid");
      if(!v) return;
      id = Number(v);
    }
    if(pz.ids.indexOf(id) < 0) return;
    if(pz.placed[id]){
      showFact($("pzFact"), id, "もう はめたよ");
      return;
    }
    if(pz.sel === null){
      selectPiece(id);
      return;
    }
    if(pz.sel === id){
      placeCorrect(id);
    } else {
      pz.wrong++;
      Audio1.boop();
      var msg = GAME.hint(id, pz.sel);
      showFact($("pzFact"), pz.sel, msg, {hint:true});
      flashWrong(id);
    }
  }

  function flashWrong(id){
    var el = document.querySelector('#mapPuzzle path.pf[data-pid="' + id + '"]');

    el.classList.add("wrong");
    setTimeout(function(){ el.classList.remove("wrong"); }, 450);

  function placeCorrect(id){
    pz.placed[id] = 1;

        var d = document.createElement("div");

      if(el){
        el.setAttribute("class", "pf q wrong");
        setTimeout(function(){ if(el.getAttribute("class").indexOf("qdone") < 0) el.setAttribute("class", "pf q"); }, 460);
      }
      var msg = GAME.hint(id, qz.cur);
      $("qzText").className = "qtext ng";
      $("qzText").textContent = msg;
      setTimeout(function(){
        if(qz.waiting || !$("sc-quiz").classList.contains("on")) return;
        $("qzText").className = "qtext";
        $("qzText").textContent = P[qz.cur].k + " は どこかな？";
      }, 1900);
    }
  }

  function finishQuiz(){
    var total = qz.set.length;
    var emo = qz.ok === total ? "🏆" : (qz.ok >= total * 0.6 ? "🌟" : "🌱");
    var msg = qz.ok === total ? "ぜんもん せいかい！ すごい！" : "よく がんばったね！";
    overlay(
      '<div class="ovemo">' + emo + "</div>" +
      "<h2>" + qz.ok + " / " + total + " もん せいかい</h2>" +
      "<p>" + msg + "</p>" +
      '<div class="ovbtns">' +
      '<button class="btn btn-mint" data-ov="again">もう いちど</button>' +
      '<button class="btn btn-ghost" data-ov="home">ホームへ</button>' +
      "</div>"
    );
    Audio1.fanfare(); confetti(40);
    var card = $("ovcard");
    card.querySelector('[data-ov="again"]').addEventListener("click", function(){ closeOverlay(); startQuiz(qz.r); });
    card.querySelector('[data-ov="home"]').addEventListener("click", function(){
      closeOverlay(); S.nav = [{name:"home"}]; enter("home");
    });
  }

  /* ============ zukan ============ */
  function buildZukan(){
    var host = $("zlist");
    host.innerHTML = "";
    REGIONS.forEach(function(r){
      var ids = BY_REGION[r.id];
      var done = ids.filter(function(id){ return S.found[id]; }).length;
      var sec = document.createElement("div");
      sec.className = "zsec";
      var head = document.createElement("div");
      head.className = "zhead";
      head.style.setProperty("--c", r.c);
      head.innerHTML = '<span class="rdot"></span><span>' + r.name + "</span><em>" + done + " / " + ids.length + "</em>";
      sec.appendChild(head);
      var grid = document.createElement("div");
      grid.className = "zgrid";
      ids.forEach(function(id){
        var got = !!S.found[id];
        var b = document.createElement("button");
        b.className = "zcard" + (got ? "" : " off");
        b.innerHTML = miniSVG(id) + '<span class="zname">' + (got ? P[id].n : "？") + "</span>";
        b.addEventListener("click", function(){
          if(got){ Audio1.pop(); showZukanCard(id); }
          else { Audio1.boop(); }
        });
        grid.appendChild(b);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
    paintProgress();
  }

  function showZukanCard(id){
    var r = reg(id);
    overlay(
      '<div class="fic" style="width:96px;height:96px;margin:0 auto 6px;background:' + r.cs + ';border-radius:22px;padding:10px">' +
      miniSVG(id) + "</div>" +
      "<h2>" + P[id].k + "</h2>" +
      "<p>" + P[id].f + "</p>" +
      '<div class="ovbtns"><button class="btn btn-ghost" data-ov="close">とじる</button></div>'
    );
    $("ovcard").querySelector('[data-ov="close"]').addEventListener("click", closeOverlay);
  }

  /* ============ init ============ */
  function init(){
    load();
    buildMap($("mapHero"), false, true);
    // hero map keeps full colours
    var hs = $("mapHero").querySelectorAll("path.pf");
    for(var i = 0; i < hs.length; i++){ hs[i].setAttribute("class", "pf"); }

    paintProgress();
    $("sndBtn").textContent = S.sound ? "🔊" : "🔇";
    $("sndBtn").addEventListener("click", function(){
      S.sound = !S.sound;
      $("sndBtn").textContent = S.sound ? "🔊" : "🔇";
      if(!S.sound && window.speechSynthesis) { try{ speechSynthesis.cancel(); }catch(e){} }
      save();
      if(S.sound) Audio1.pop();
    });

    eachNode("[data-go]", function(b){
      b.addEventListener("click", function(){
        Audio1.ready(); Audio1.pop();
        S.nav = [{name:"home"}];
        go(b.getAttribute("data-go"));
      });
    });
    eachNode("[data-back]", function(b){
      b.addEventListener("click", function(){ Audio1.pop(); back(); });
    });
    $("ov").addEventListener("click", function(e){ if(e.target === $("ov")) closeOverlay(); });
    ["pzFact", "qzFact"].forEach(function(k){
      var el = $(k);
      if(el){ el.addEventListener("click", function(){ hideFact(el); }); }
    });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeOverlay(); });
    S.nav = [{name:"home"}];
    var rt = null;
    window.addEventListener("resize", function(){
      if(rt) clearTimeout(rt);
      rt = setTimeout(function(){
        ["mapPuzzle", "mapQuiz"].forEach(function(k){
          var svg = $(k);
          if(svg && svg.__target && svg.getBoundingClientRect().width > 4){
            setVB(svg, fitVB(svg.__target, mapAspect(svg)));
          }
        });
      }, 150);
    });
  }

  if(typeof document !== "undefined" && document.addEventListener){
    document.addEventListener("DOMContentLoaded", init);
  }

  // expose logic for tests
  if(typeof globalThis !== "undefined"){ globalThis.__GAME = GAME; globalThis.__PREFS = PREFS; globalThis.__MAP = MAP; }
})();
</script>
</body>
</html>
