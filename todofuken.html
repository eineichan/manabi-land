<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFAF4">
<meta name="description" content="しんかんせんで にほんいっしゅう！ 3つの ヒントで とどうふけんを あてる めいぶつクイズ。47の めいぶつずかんも あつまるよ。">
<title>しんかんせんで にほんいっしゅう！めいぶつクイズ</title>
<style>
  :root{
    --ivory:#FDFAF4;
    --card:#FFFFFF;
    --ink:#544B46;
    --ink2:#7A6E67;
    --ink3:#A2968D;
    --rose:#D97C8E;
    --rose-d:#A9505F;
    --mint:#9BD3C0;
    --mint-d:#7CBCA6;
    --mustard:#E9C46A;
    --line:#F0E7D9;
    --line2:#E8DDCB;
    --shadow:0 10px 26px rgba(120,101,90,.10);
    --shadow-lg:0 18px 44px rgba(120,101,90,.20);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--ivory);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;overscroll-behavior:none;
    touch-action:manipulation;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 6% 0%,rgba(239,169,184,.20),transparent 42%),
      radial-gradient(circle at 96% 82%,rgba(155,211,192,.22),transparent 46%),
      radial-gradient(circle at 80% 4%,rgba(233,196,106,.14),transparent 34%);
  }
  .app{
    position:relative;z-index:1;max-width:560px;margin:0 auto;
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  }
  .screen{display:none;flex-direction:column;flex:1;min-height:0;gap:8px}
  .screen.on{display:flex;animation:scrIn .3s ease both}
  @keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- きほんの ボタン ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    border:0;border-radius:22px;font-family:inherit;font-size:18px;font-weight:800;
    letter-spacing:.03em;padding:14px 14px;cursor:pointer;line-height:1.25;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn-primary{background:linear-gradient(180deg,#EB9EAE 0%,#D97C8E 100%);color:#fff;box-shadow:0 5px 0 var(--rose-d),0 12px 22px rgba(169,80,95,.24)}
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-d),0 4px 10px rgba(169,80,95,.2)}
  .btn-mint{background:linear-gradient(180deg,#BFE6D8 0%,#9BD3C0 100%);color:#2F5A4E;box-shadow:0 5px 0 var(--mint-d),0 12px 22px rgba(124,188,166,.26)}
  .btn-mint:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mint-d),0 4px 10px rgba(124,188,166,.2)}
  .btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .ibtn{
    width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.94);box-shadow:0 5px 14px rgba(120,101,90,.12);
    color:var(--ink2);font-size:16px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .ibtn:active{transform:scale(.94)}

  /* ---------- まなびランドへ もどる ---------- */
  .home-back{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    flex:0 0 auto;width:fit-content;
    padding:6px 13px;border-radius:999px;
    background:#FFFFFF;border:2px solid var(--line);
    box-shadow:0 4px 12px rgba(120,101,90,.14);
    color:var(--ink2);font-family:inherit;
    font-size:12.5px;font-weight:800;letter-spacing:.06em;line-height:1.15;
    text-decoration:none;white-space:nowrap;cursor:pointer;
    position:relative;z-index:2;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .home-back:active{transform:scale(.95);box-shadow:0 2px 6px rgba(120,101,90,.16)}
  .topbar{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:40px}
  .topbar-mid{flex:1;min-width:0;display:flex;justify-content:center}
  .pl-chip{
    display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;max-width:132px;
    border:2px solid #fff;background:#fff;border-radius:999px;padding:5px 11px 5px 7px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
    box-shadow:0 5px 14px rgba(120,101,90,.12);cursor:pointer;
  }
  .pl-chip:active{transform:scale(.96)}
  .pl-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- ホーム ---------- */
  .title{margin:0;font-size:clamp(23px,6.6vw,30px);line-height:1.2;letter-spacing:.01em;font-weight:800;text-align:center}
  .title em{font-style:normal;color:var(--rose)}
  .title .big{display:block;font-size:1.16em;margin-top:2px}
  .sub{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink2);font-weight:700;text-align:center}
  .hero{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .hero svg{width:100%;height:100%;display:block}
  .pcard{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
  .prow{display:flex;align-items:baseline;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
  .prow b{font-size:18px;color:var(--ink);letter-spacing:0}
  .prow b i{font-style:normal;font-size:12.5px;color:var(--ink3);font-weight:800}
  .bar{margin-top:7px;height:9px;border-radius:999px;background:#F3EDE2;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#F2B7C4,#D97C8E);transition:width .6s cubic-bezier(.2,1,.3,1)}
  .hbtns{display:flex;flex-direction:column;gap:8px}

  /* ---------- ちほう えらび ---------- */
  .rlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .rcard{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:#fff;border:2px solid var(--line);border-radius:18px;padding:11px 13px;
    font-family:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(240,231,217,.7);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .rcard:active{transform:translateY(3px);box-shadow:none}
  .rdot{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
  .rmain{flex:1;min-width:0}
  .rname{display:block;font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .remo{font-style:normal;font-size:15px;margin-right:5px}
  .rdots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .rdots i{width:7px;height:7px;border-radius:50%;background:#EFE8DC;display:block}
  .rdots i.on{background:var(--c)}
  .rside{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
  .rcount{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.02em}
  .crown{font-size:17px;line-height:1}

  /* ---------- あそぶ がめん ---------- */
  .playbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  .map-wrap{position:relative;flex:1 1 auto;min-height:130px;display:flex;align-items:center;justify-content:center;background:#F0F8FC;border-radius:16px;overflow:hidden}
  .map-wrap > svg{width:100%;height:100%;display:block}
  .trip-chip{
    display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:800;color:var(--ink3);
    box-shadow:0 4px 10px rgba(120,101,90,.08);white-space:nowrap;
  }
  .trip-chip b{font-size:17px;color:var(--ink)}
  .trip-chip i{font-style:normal;font-size:12px}

  .pf{fill:var(--c);stroke:#fff;stroke-width:2.4;stroke-linejoin:round;transition:fill .32s ease,opacity .32s ease}
  .pf.blank{fill:var(--cs);stroke:#FFFFFF;stroke-width:2.4}
  .pf.other{fill:#F3EEE4;opacity:.52;stroke:#FBFAF6}

  .hintcard{flex:0 0 auto;background:#fff;border-radius:20px;padding:9px 12px 10px;box-shadow:var(--shadow)}
  .hhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .hhead-t{flex:1;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.05em}
  .hhead-t .ok{color:var(--mint-d)}
  .hhead-t .ng{color:#C97F58}
  .hhead-t b{font-size:16px;letter-spacing:.02em}
  .say{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:0;background:#FBF1E4;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .say:active{transform:scale(.92)}
  .hrow{display:flex;align-items:center;gap:7px;padding:2px 0}
  .hrow .hn{
    width:17px;height:17px;flex:0 0 17px;border-radius:50%;background:#F7EEE1;color:#B08B6C;
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .hrow .he{font-size:16px;line-height:1;flex:0 0 auto}
  .hrow .ht{font-size:13.5px;font-weight:800;line-height:1.3;letter-spacing:.01em;color:var(--ink)}

  .choices{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .ch{
    display:flex;align-items:center;gap:6px;min-height:62px;padding:6px 8px;
    background:#fff;border:2px solid var(--line);border-radius:16px;
    box-shadow:0 4px 0 #EFE6D8;font-family:inherit;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease,background .2s ease,opacity .25s ease;
  }
  .ch:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE6D8}
  .ch-s{width:40px;height:32px;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
  .ch-s svg{width:100%;height:100%;display:block}
  .ch-t{font-size:15px;font-weight:800;letter-spacing:0;color:var(--ink);line-height:1.15;text-align:left}
  .ch.ok{background:#E8F7F0;border-color:var(--mint-d);box-shadow:0 4px 0 #BFE6D8}
  .ch.ng{background:#FBEDE6;border-color:#EBBBA3;box-shadow:none;opacity:.55;animation:shake .4s}
  .ch.dim{opacity:.34}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .facttoast{
    position:absolute;left:7px;right:7px;bottom:7px;z-index:4;
    background:rgba(255,255,255,.97);border-radius:14px;padding:7px 11px;
    font-size:11.5px;font-weight:800;line-height:1.45;color:var(--ink2);
    box-shadow:0 8px 22px rgba(120,101,90,.18);
    transform:translateY(140%);opacity:0;transition:transform .34s cubic-bezier(.2,1.15,.3,1),opacity .24s;
    pointer-events:none;
  }
  .facttoast.on{transform:none;opacity:1}
  .facttoast b{color:var(--ink)}

  /* ---------- ずかん ---------- */
  .zlist{flex:1;min-height:0;overflow-y:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
  .zsec{margin-bottom:13px}
  .zhead{display:flex;align-items:center;gap:8px;margin:2px 2px 7px}
  .zhead .rdot{width:13px;height:13px;flex:0 0 13px}
  .zhead span{font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--ink2)}
  .zhead em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink3)}
  .zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .zcard{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff;border:2px solid var(--line);border-radius:15px;padding:7px 4px 6px;
    font-family:inherit;cursor:pointer;
  }
  .zcard:active{transform:translateY(2px)}
  .zcard .zemo{font-size:24px;line-height:1.15}
  .zcard .zname{font-size:10.5px;font-weight:800;color:var(--ink);line-height:1.2;text-align:center}
  .zcard.off{background:#FBF8F2}
  .zcard.off .zemo{opacity:.25;filter:grayscale(1)}
  .zcard.off .zname{color:var(--ink3)}

  /* ---------- オーバーレイ ---------- */
  .ov{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(84,75,70,.34);padding:20px}
  .ov.on{display:grid}
  .ovcard{background:#fff;border-radius:26px;padding:22px 18px 18px;max-width:330px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:popin .4s cubic-bezier(.2,1.4,.4,1);max-height:86vh;overflow-y:auto}
  .ovemo{font-size:42px;line-height:1}
  .ovcard h2{margin:8px 0 4px;font-size:18px;line-height:1.35;letter-spacing:.02em}
  .ovtag{font-size:16px;color:var(--rose)}
  .ovcard p{margin:0 0 13px;font-size:13px;line-height:1.6;color:var(--ink2);font-weight:700}
  .ovbtns{display:flex;flex-direction:column;gap:8px}
  .ovbtns .btn{font-size:16px;padding:12px;border-radius:18px}
  @keyframes popin{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}

  .plcard{background:#fff;border-radius:26px;padding:20px 18px 16px;max-width:340px;width:100%;box-shadow:var(--shadow-lg);animation:popin .4s cubic-bezier(.2,1.4,.4,1);max-height:88vh;overflow-y:auto}
  .plcard h3{margin:0 0 3px;font-size:17px;line-height:1.35;letter-spacing:.02em;text-align:center}
  .plnote{margin:0 0 12px;font-size:11.5px;font-weight:700;color:var(--ink3);text-align:center}
  .pllist{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
  .plrow{display:flex;align-items:center;gap:9px;border:2px solid var(--line);border-radius:15px;padding:8px 10px;background:#fff}
  .plrow.on{border-color:var(--rose);background:#FEF4F6}
  .plrow .pi{font-size:21px;line-height:1}
  .plrow .pm{flex:1;min-width:0;text-align:left}
  .plrow .pn{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plrow .pc{display:block;font-size:11px;font-weight:800;color:var(--ink3)}
  .plrow .pd{border:0;background:#F7F1E7;color:var(--ink3);border-radius:9px;padding:4px 8px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer}
  .plrow .pick{border:0;background:var(--rose);color:#fff;border-radius:10px;padding:5px 10px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer}
  .plform{display:none;flex-direction:column;gap:8px}
  .plform.open{display:flex}
  .plicons{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
  .pic{width:33px;height:33px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .pic.on{border-color:var(--rose);background:#FEF4F6;transform:scale(1.06)}
  #plName{
    width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;
    font-family:inherit;font-size:16px;font-weight:800;color:var(--ink);text-align:center;background:#FFFDF8;
  }
  #plName:focus{outline:none;border-color:var(--rose);background:#fff}
  .plerr{font-size:11.5px;font-weight:800;color:#C97F58;text-align:center;min-height:15px}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .cf{position:absolute;top:-26px;width:9px;height:13px;border-radius:3px;opacity:.95;animation:cfall linear forwards}
  @keyframes cfall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(var(--dx,0),106vh,0) rotate(760deg)}}

  @media (max-height:700px){
    .title{font-size:21px}
    .sub{font-size:11.5px}
    .btn{font-size:16px;padding:11px 12px;border-radius:18px}
    .ch{min-height:50px}
    .ch-t{font-size:13px}
    .ch-s{width:34px;height:27px;flex:0 0 34px}
    .hrow .ht{font-size:12.5px}
    .hintcard{padding:7px 10px 8px}
    .hhead{margin-bottom:4px}
  }

  @media (min-width:820px){
    .app{max-width:1080px;padding:16px 26px calc(env(safe-area-inset-bottom,0px) + 18px)}
    .title{font-size:34px}
    .sub{font-size:14px}
    #sc-home .hero{max-height:none}
    .hbtns{flex-direction:row;gap:12px}
    .hbtns .btn{font-size:17px}
    .playbody{flex-direction:row;gap:20px;align-items:stretch}
    .map-wrap{flex:1 1 auto}
    .qpanel{flex:0 0 400px;display:flex;flex-direction:column;gap:11px;justify-content:center;min-height:0}
    .hintcard{padding:14px 16px}
    .hrow .ht{font-size:15px}
    .hhead-t{font-size:14px}
    .ch{min-height:66px}
    .ch-t{font-size:16px}
    .rlist{max-width:760px;width:100%;align-self:center;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
    .zgrid{grid-template-columns:repeat(6,1fr)}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== ホーム ===== -->
  <section class="screen on" id="sc-home">
    <div class="topbar">
      <a class="home-back" href="./index.html" aria-label="まなびランドへ もどる">🏠 もどる</a>
      <div class="topbar-mid"></div>
      <button class="pl-chip" id="plChip" aria-label="プレイヤーを かえる">
        <span id="plChipIcon">👦</span><span id="plChipName">なまえ</span>
      </button>
      <button class="ibtn" id="sndBtn" aria-label="おとと よみあげの おんおふ">🔊</button>
    </div>
    <h1 class="title">しんかんせんで<span class="big"><em>にほんいっしゅう</em>！</span></h1>
    <p class="sub">3つの ヒントで とどうふけんを あてよう🚄</p>
    <div class="hero"><svg id="mapHero" aria-hidden="true"></svg></div>
    <div class="pcard">
      <div class="prow"><span>あつめた めいぶつ</span><b><span id="homeCount">0</span> <i>/ 47</i></b></div>
      <div class="bar"><i id="homeBar"></i></div>
    </div>
    <div class="hbtns">
      <button class="btn btn-primary" id="btnGo">🚄 しゅっぱつ！</button>
      <button class="btn btn-mint" id="btnRegion">🧭 ちほうを えらぶ</button>
      <button class="btn btn-ghost" id="btnZukan">📖 めいぶつずかん</button>
    </div>
  </section>

  <!-- ===== ちほう えらび ===== -->
  <section class="screen" id="sc-region">
    <div class="topbar">
      <a class="home-back" href="./index.html" aria-label="まなびランドへ もどる">🏠 もどる</a>
      <div class="topbar-mid"><span class="trip-chip">どこから いく？</span></div>
      <button class="ibtn" data-back aria-label="もどる">‹</button>
    </div>
    <p class="sub">ちほうを えらぶと、その ちほうだけ まわれるよ</p>
    <div class="rlist" id="rlist"></div>
  </section>

  <!-- ===== あそぶ ===== -->
  <section class="screen" id="sc-play">
    <div class="topbar">
      <a class="home-back" href="./index.html" aria-label="まなびランドへ もどる">🏠 もどる</a>
      <div class="topbar-mid">
        <span class="trip-chip"><span id="tripEmo">🚄</span><b id="tripDone">0</b><i>/ 47</i></span>
      </div>
      <button class="ibtn" id="btnPlayBack" aria-label="ゲームの ホームへ">✕</button>
    </div>
    <div class="playbody">
      <div class="map-wrap" id="mapWrap">
        <svg id="mapPlay"></svg>
        <div class="facttoast" id="factToast"></div>
      </div>
      <div class="qpanel">
        <div class="hintcard">
          <div class="hhead">
            <span class="hhead-t" id="hHead">3つの ヒントで わかるかな？</span>
            <button class="say" id="btnSay" aria-label="もう いちど きく">🔈</button>
          </div>
          <div class="hrows" id="hRows"></div>
        </div>
        <div class="choices" id="choices"></div>
      </div>
    </div>
  </section>

  <!-- ===== ずかん ===== -->

    tap:function(){ this.tone(880, 0, 0.08, "triangle", 0.08); },
    fanfare:function(){
      var s = [523.3, 659.3, 784.0, 1046.5, 1318.5];
      for(var i = 0; i < s.length; i++){ this.tone(s[i], i * 0.12, 0.42, "triangle", 0.15); }
      this.tone(1568.0, 0.62, 0.90, "sine", 0.12);
    }
  };

  function speak(list){
    if(!APP.sound){ return; }
    if(!("speechSynthesis" in window)){ return; }
    try{
      window.speechSynthesis.cancel();
      list.forEach(function(t){
        var u = new SpeechSynthesisUtterance(t);
        u.lang = "ja-JP"; u.rate = 0.95; u.pitch = 1.15;
        window.speechSynthesis.speak(u);
      });
    }catch(e){}
  }
  function stopSpeak(){
    try{ if(window.speechSynthesis){ window.speechSynthesis.cancel(); } }catch(e){}

  /* ================= かみふぶき ================= */
  var CF = ["#EFA9B8","#9BD3C0","#E9C46A","#F2B396","#B9B7DC","#A6D0E4","#FFFFFF"];
  function confetti(n){
    var host = $("confetti");
    if(!host){ return; }
    for(var i = 0; i < (n || 24); i++){
      var s = document.createElement("i");
      s.className = "cf";

      s.style.animationDuration = (1.25 + Math.random() * 0.9) + "s";
      s.style.animationDelay = (Math.random() * 0.3) + "s";

      s.style.height = (9 + Math.random() * 8) + "px";
      host.appendChild(s);

  /* ================= ちず ================= */
  var OKI = { x: MAP.w - 320, y: MAP.h - 252, w: 300, h: 232 };
  var TRAIN = { pos:null, el:null, emo:null, pxw:380, boost:1 };

  function stampPos(id){
    if(id === 47){ var c = MAP.oki.c; return [OKI.x + c[0], OKI.y + c[1]]; }
    return geom(id).c;
  }

  function buildMap(svg, withTrain){
    svg.innerHTML = "";
    svg.setAttribute("viewBox", "0 0 " + MAP.w + " " + MAP.h);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    svg.appendChild(svgEl("rect", {
      x:-900, y:-900, width:MAP.w + 1800, height:MAP.h + 1800, fill:"#F0F8FC"
    }));

    var gShape = svgEl("g");
    var gTrail = svgEl("g", { id:"trailG" });
    var gStamp = svgEl("g");

    var ids = Object.keys(MAP.prefs).map(Number).sort(function(a, b){ return area(b) - area(a); });
    ids.forEach(function(id){
      var g = geom(id), r = regOf(id);
      var p = svgEl("path", { d:g.d, "class":"pf blank" });
      p.setAttribute("data-pid", id);
      p.style.setProperty("--c", r.c);
      p.style.setProperty("--cs", r.cs);
      gShape.appendChild(p);
    });
    svg.appendChild(gShape);
    svg.appendChild(gTrail);

    /* おきなわは すみっこの カードに のせる */
    var gO = svgEl("g", { transform:"translate(" + OKI.x + "," + OKI.y + ")" });
    gO.appendChild(svgEl("rect", {
      x:0, y:0, width:OKI.w, height:OKI.h, rx:22,
      fill:"#FFFFFF", "fill-opacity":"0.62", stroke:"#BFDCEA",
      "stroke-width":3, "stroke-dasharray":"10 8"
    }));
    var lab = svgEl("text", {
      x:OKI.w / 2, y:-12, "text-anchor":"middle", "font-size":"24",
      "font-weight":"800", fill:"#5E8DA4"
    });
    lab.textContent = "おきなわ";
    gO.appendChild(lab);
    var op = svgEl("path", { d:MAP.oki.d, "class":"pf blank", "data-pid":"47" });
    op.style.setProperty("--c", REGIONS[5].c);
    op.style.setProperty("--cs", REGIONS[5].cs);
    gO.appendChild(op);

    /* スタンプ（めいぶつ） */
    function addStamp(id, host, x, y){
      var g = svgEl("g", { "class":"stamp", "data-sid":id, transform:"translate(" + x + "," + y + ")", opacity:"0" });
      g.__bp = [x, y];
      g.appendChild(svgEl("circle", { r:22, fill:"#FFFFFF", "fill-opacity":"0.93" }));
      var t = svgEl("text", {
        x:0, y:1, "text-anchor":"middle", "dominant-baseline":"central",
        "font-size":"29", "font-family":"'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"
      });
      t.textContent = P[id].e;
      g.appendChild(t);
      host.appendChild(g);
    }
    var trainG = null, ttext = null;
    if(withTrain){
      trainG = svgEl("g", { "class":"train", transform:"translate(330,130)" });
      ttext = svgEl("text", {
        x:0, y:0, "text-anchor":"middle", "dominant-baseline":"central",
        "font-size":"78", "font-family":"'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif",
        stroke:"#FFFFFF", "stroke-width":"10", "paint-order":"stroke fill"
      });
      ttext.textContent = "🚄";
      trainG.appendChild(ttext);
      svg.appendChild(trainG);
      TRAIN.el = trainG; TRAIN.emo = ttext;
    }
    for(var i = 1; i <= 46; i++){
      var c = geom(i).c;
      addStamp(i, gStamp, c[0], c[1]);
    }
    addStamp(47, gO, MAP.oki.c[0], MAP.oki.c[1]);
    svg.appendChild(gStamp);
    svg.appendChild(gO);
  }

  function setTrain(x, y, boost){
    TRAIN.boost = (boost || 1);
    if(!TRAIN.el){ return; }
    var s = trainBase() * TRAIN.boost;
    TRAIN.el.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
  }

  /* しんかんせんが ズームしても おなじ くらいの おおきさで みえるように */
  function trainBase(){
    var svg = $("mapPlay");
    var vw = (svg && svg.__vb && svg.__vb[2]) ? svg.__vb[2] : MAP.w;
    var px = TRAIN.pxw || 380;
    var unit = px / vw;
    var want = clamp(px * 0.085, 28, 64);
    return clamp(want / (78 * unit), 0.1, 1.6);
  }
  function syncTrain(){
    if(!TRAIN.el || !TRAIN.pos){ return; }
    setTrain(TRAIN.pos[0], TRAIN.pos[1], TRAIN.boost);
  }

  function paintMap(svg, mode, region){
    if(!svg){ return; }
    var paths = svg.querySelectorAll("path.pf");
    for(var i = 0; i < paths.length; i++){
      var node = paths[i];
      var id = Number(node.getAttribute("data-pid"));
      var done = !!ST.done[id] && G.pending !== id;
      var cls = "pf";
      if(mode === "region" && region && P[id].r !== region){ cls += " other"; }
      cls += done ? " done" : " blank";
      node.setAttribute("class", cls);
    }
    var ss = svg.querySelectorAll("g.stamp");
    for(var j = 0; j < ss.length; j++){
      var sid = Number(ss[j].getAttribute("data-sid"));
      var on = !!ST.done[sid] && G.pending !== sid;
      ss[j].setAttribute("opacity", on ? "1" : "0");
      if(!on){
        var bp = ss[j].__bp;
        if(bp){ ss[j].setAttribute("transform", "translate(" + bp[0] + "," + bp[1] + ") scale(1)"); }
      }
    }
  }

  function paintMaps(){
    paintMap($("mapHero"), "all", null);
    paintMap($("mapPlay"), G.mode, G.region);
    drawTrail();
  }

  function drawTrail(){
    var svg = $("mapPlay");
    if(!svg){ return; }
    var g = svg.querySelector("#trailG");
    if(!g){ return; }
    g.innerHTML = "";
    var pts = [];
    for(var i = 1; i <= 46; i++){ if(ST.done[i] && G.pending !== i){ pts.push(stampPos(i)); } }
    if(pts.length < 2){ return; }
    var d = "M" + pts[0][0] + "," + pts[0][1];
    for(var j = 1; j < pts.length; j++){ d += " L" + pts[j][0] + "," + pts[j][1]; }
    g.appendChild(svgEl("path", {
      d:d, fill:"none", stroke:"#D8C0B0", "stroke-width":5,
      "stroke-dasharray":"13 12", "stroke-linecap":"round", opacity:"0.6"
    }));
  }

  /* ---- ズーム ---- */
  function fullVB(){ return [0, 0, MAP.w, MAP.h]; }
  function regionVB(r){
    var b = (MAP.regions[String(r)] || [0, 0, MAP.w, MAP.h]).slice();
    var w = b[2] - b[0], h = b[3] - b[1];
    var pad = Math.min(w, h) * 0.09;
    return [b[0] - pad, b[1] - pad, w + pad * 2, h + pad * 2];
  }
  function focusVB(id){
    if(id === 47){ return [OKI.x - 34, OKI.y - 44, OKI.w + 68, OKI.h + 88]; }
    var b = geom(id).b, w = b[2] - b[0], h = b[3] - b[1];
    var m = Math.max(w, h, 250);
    var cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    return [cx - m * 0.85, cy - m * 0.85, m * 1.7, m * 1.7];
  }
  function mapAspect(svg){
    var r = svg.getBoundingClientRect();
    return (r.width > 4 && r.height > 4) ? (r.width / r.height) : 0.9;
  }
  function fitVB(vb, aspect){
    var w = vb[2], h = vb[3];
    if(w / h > aspect){ h = w / aspect; } else { w = h * aspect; }
    var cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
    return [cx - w / 2, cy - h / 2, w, h];
  }
  function setVB(svg, vb){
    svg.__vb = vb.slice();
    svg.setAttribute("viewBox", vb.map(function(v){ return Math.round(v * 10) / 10; }).join(" "));
    if(svg.id === "mapPlay"){ syncTrain(); }
  }
  function moveVB(svg, to, dur){
    var from = svg.__vb ? svg.__vb.slice() : (svg.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    if(from.length !== 4){ setVB(svg, to); return; }
    tween(dur || 460, function(k){
      var e = easeInOut(k), cur = [];
      for(var i = 0; i < 4; i++){ cur.push(from[i] + (to[i] - from[i]) * e); }
      setVB(svg, cur);
    });
  }
  function goVB(svg, vb, dur){
    var t = fitVB(vb, mapAspect(svg));
    if(dur){ moveVB(svg, t, dur); } else { setVB(svg, t); }
  }

  /* ================= がめん ================= */
  var SCREENS = { home:"sc-home", region:"sc-region", play:"sc-play", zukan:"sc-zukan" };
  var nav = ["home"];
  function show(name){
    Object.keys(SCREENS).forEach(function(k){ $(SCREENS[k]).classList.remove("on"); });
    $(SCREENS[name]).classList.add("on");
  }
  function go(name){
    nav.push(name);
    enter(name);
  }
  function back(){
    if(nav.length > 1){ nav.pop(); }
    enter(nav[nav.length - 1] || "home");
  }
  function enter(name){
    if(name === "home"){
      show("home"); stopSpeak(); refreshHome(); return;
    }
    if(name === "region"){ buildRegionList(); show("region"); return; }
    if(name === "zukan"){ buildZukan(); show("zukan"); return; }
    show("home"); refreshHome();
  }

  function askDel(p){
    overlay(
      '<div class="ovemo">🧹</div><h2>' + esc(p.name) + ' の きろくを けす？</h2>' +
      '<p>あつめた めいぶつが きえちゃうよ</p>' +

  function addPlayer(){
    var name = ($("plName").value || "").replace(/\s+/g, "").slice(0, 10);
    if(!name){ $("plErr").textContent = "なまえを いれてね"; return; }
    var first = APP.players.length === 0;
    var p = { id:newId(), name:name, icon:pickedIcon };

    APP.cur = p.id;

      /* とうろくまえに あそんだ きろくを ひきつぐ */

  function Audio1Popup(){ AU.tap(); }

  /* ================= ホームの ちず ================= */
  function heroVB(){
    var svg = $("mapHero");
    goVB(svg, fullVB(), 0);
  }

  /* ================= あそぶ ================= */
  var G = { mode:"journey", region:null, route:[], i:0, cur:null, locked:false, pending:null, home:null };

  function trainStart(){
    if(G.mode === "journey"){
      var back = 0;
      ORDER.forEach(function(id){ if(ST.done[id] && id < G.route[0]){ back = Math.max(back, id); } });
      if(back){ return trainSpot(back); }
      return [330, 130];
    }
    var b = (MAP.regions[String(G.region)] || [0, 0, MAP.w, MAP.h]);
    return [b[0] + 40, Math.max(20, b[1] - 30)];
  }

  /* スタンプと かさならないように、ちょっと ずらして とまる */
  function trainSpot(id){
    var c = stampPos(id);
    var off = (id === 47) ? [32, -26] : [34, -30];
    return [c[0] + off[0], c[1] + off[1]];
  }

  function begin(mode, region, route){
    G.mode = mode; G.region = region; G.route = route; G.i = 0;
    G.locked = false; G.pending = null; G.cur = null;
    show("play");
    var svg = $("mapPlay");
    if(!svg.__built){ buildMap(svg, true); svg.__built = 1; }
    G.home = (mode === "region" && region) ? regionVB(region) : fullVB();
    paintMaps(); updateTrip();
    ask();
    /* レイアウトが きまってから ちずの おおきさを あわせる */
    TRAIN.pxw = svg.getBoundingClientRect().width || TRAIN.pxw || 380;
    goVB(svg, G.home, 0);
    var sp = trainStart();
    TRAIN.pos = [sp[0], sp[1]];
    TRAIN.boost = 1;
    setTrain(sp[0], sp[1], 1);
    paintMaps();
  }

  function updateTrip(){
    $("tripDone").textContent = doneCount();
    $("tripEmo").textContent = (G.mode === "region") ? "🧭" : "🚄";
  }

  function ask(){
    if(G.i >= G.route.length){ finish(); return; }
    G.cur = G.route[G.i];
    G.locked = false;
    renderHints(G.cur);
    renderChoices(G.cur);
    $("factToast").classList.remove("on");
    speakQ(G.cur);
  }

  function speakQ(id){
    var p = P[id];
    speak(["3つの ヒントで わかるかな", p.h[0].t, p.h[1].t, p.h[2].t, "この けんは どこかな"]);
  }

  function renderHints(id){
    var head = $("hHead");
    head.className = "hhead-t";
    head.textContent = "3つの ヒントで わかるかな？";
    var host = $("hRows");
    host.innerHTML = "";
    P[id].h.forEach(function(h, i){
      var row = el("div", "hrow");
      var n = el("span", "hn", String(i + 1));
      var e = el("span", "he", h.e);
      var t = el("span", "ht", h.t);
      row.appendChild(n); row.appendChild(e); row.appendChild(t);
      host.appendChild(row);
    });
  }

  function miniSVG(id){
    var g = geom(id), b = g.b, p = 4;
    var vb = [b[0] - p, b[1] - p, (b[2] - b[0]) + p * 2, (b[3] - b[1]) + p * 2];
    return '<svg viewBox="' + vb.map(function(v){ return Math.round(v * 10) / 10; }).join(" ") +
      '" preserveAspectRatio="xMidYMid meet"><path class="pf done" d="' + g.d +
      '" style="--c:' + regOf(id).c + '"></path></svg>';
  }

  function renderChoices(id){
    var host = $("choices");
    host.innerHTML = "";
    var same = shuffle(BY_R[P[id].r].filter(function(x){ return x !== id; }));
    var other = shuffle(ORDER.filter(function(x){ return P[x].r !== P[id].r; }));
    var picks = [id];
    var i = 0;
    while(picks.length < 3 && i < same.length){ picks.push(same[i++]); }
    var j = 0;
    while(picks.length < 4 && j < other.length){ picks.push(other[j++]); }
    shuffle(picks).forEach(function(pid){
      var b = el("button", "ch");
      b.type = "button";
      b.setAttribute("data-id", pid);
      b.innerHTML = '<span class="ch-s">' + miniSVG(pid) + '</span><span class="ch-t">' + P[pid].n + "</span>";
      b.addEventListener("click", function(){
        if(G.locked){ return; }
        if(pid === G.cur){ hitRight(b, pid); } else { hitWrong(b); }
      });
      host.appendChild(b);
    });
  }

  function hitWrong(btn){
    btn.classList.add("ng");
    btn.disabled = true;
    AU.boop();
    var head = $("hHead");
    head.className = "hhead-t";
    head.innerHTML = '<b class="ng">おしい！もう いっかい！</b>';
    setTimeout(function(){
      if(!G.locked && head.textContent.indexOf("おしい") >= 0){
        head.innerHTML = "3つの ヒントで わかるかな？";
      }
    }, 1500);
  }

  function hitRight(btn, id){
    G.locked = true;
    stopSpeak();
    btn.classList.add("ok");
    var all = $("choices").querySelectorAll(".ch");
    for(var i = 0; i < all.length; i++){ if(!all[i].classList.contains("ok")){ all[i].classList.add("dim"); } }
    var head = $("hHead");
    head.className = "hhead-t";
    head.innerHTML = '<b class="ok">せいかい！</b> ' + P[id].k;

    AU.pinpon();
    ST.done[id] = 1;
    saveST();
    G.pending = id;
    paintMaps();
    updateTrip();

    var from = TRAIN.pos || [330, 130];
    var to = trainSpot(id);
    var dx = to[0] - from[0], dy = to[1] - from[1];
    var dist = Math.sqrt(dx * dx + dy * dy);
    var dur = clamp(460 + dist * 0.85, 640, 1150);
    if(id === 47 && TRAIN.emo){ TRAIN.emo.textContent = "✈️"; }
    AU.shuu();
    speak(["せいかい！" + P[id].k]);

    tween(dur, function(k){
      var e = easeInOut(k);
      var x = from[0] + dx * e;
      var y = from[1] + dy * e - Math.sin(Math.PI * e) * clamp(dist * 0.12, 10, 90);
      TRAIN.pos = [x, y];
      setTrain(x, y, 1 + Math.sin(Math.PI * e) * 0.18);
    }, function(){
      TRAIN.pos = [to[0], to[1]];
      setTrain(to[0], to[1], 1);
      if(TRAIN.emo){ TRAIN.emo.textContent = "🚄"; }
      G.pending = null;
      paintMaps();
      popStamp(id);
      AU.pop();
      confetti(26);
      goVB($("mapPlay"), focusVB(id), 520);
      showFact(id);
      setTimeout(afterCorrect, 1550);
    });
  }

  function popStamp(id){
    var svg = $("mapPlay");
    if(!svg){ return; }
    var g = svg.querySelector('g.stamp[data-sid="' + id + '"]');
    if(!g){ return; }
    var bp = g.__bp;
    tween(430, function(k){
      var s;
      if(k < 0.62){ s = 0.3 + (1.22 - 0.3) * (k / 0.62); }
      else { s = 1.22 + (1 - 1.22) * ((k - 0.62) / 0.38); }
      g.setAttribute("transform", "translate(" + bp[0] + "," + bp[1] + ") scale(" + s.toFixed(3) + ")");
    }, function(){
      g.setAttribute("transform", "translate(" + bp[0] + "," + bp[1] + ") scale(1)");
    });
  }

  function showFact(id){
    var t = $("factToast");
    t.innerHTML = "<b>" + P[id].e + " " + P[id].m + "</b>　" + P[id].f;
    t.classList.add("on");
  }

  function afterCorrect(){
    if(!$("sc-play").classList.contains("on")){ return; }
    var id = G.cur;
    var r = P[id].r;
    if(regionDone(r) && !ST.crowns[r]){
      ST.crowns[r] = 1;
      saveST();
      if(doneCount() >= 47){ finish(); return; }
      crownOverlay(r);
      return;
    }
    if(G.i + 1 >= G.route.length){ finish(); return; }
    advance();
  }

  function advance(){
    if(!$("sc-play").classList.contains("on")){ return; }
    G.i++;
    if(G.i >= G.route.length){ finish(); return; }
    goVB($("mapPlay"), G.home, 430);
    ask();
  }

  /* ================= オーバーレイ ================= */
  function overlay(html){
    $("ovcard").innerHTML = html;
    $("ov").classList.add("on");
  }
  function closeOverlay(){ $("ov").classList.remove("on"); }

  function crownOverlay(r){
    var rg = REGIONS[r - 1];
    AU.fanfare();
    confetti(52);
    speak([rg.name + "、ぜんぶ まわったね。すごい！"]);
    overlay(
      '<div class="ovemo">👑</div>' +
      "<h2>" + rg.name + "</h2>" +
      '<p><b class="ovtag">ぜんぶ まわったよ！</b><br>めいぶつも ぜんぶ あつめたね</p>' +
      '<div class="ovbtns">' +
      '<button class="btn btn-primary" data-ov="next">つぎへ</button>' +
      '<button class="btn btn-ghost" data-ov="home">ホームへ</button>' +
      "</div>"
    );
    $("ovcard").querySelector('[data-ov="next"]').addEventListener("click", function(){
      closeOverlay();
      if(G.i + 1 >= G.route.length){ finish(); } else { advance(); }
      refreshHome();
    });
    $("ovcard").querySelector('[data-ov="home"]').addEventListener("click", function(){
      closeOverlay(); nav = ["home"]; enter("home");
    });
  }

  function finish(){
    stopSpeak();
    var all = doneCount() >= 47;
    var emo = all ? "🎉" : "🌟";
    var title = all ? "にほんいっしゅう かんりょう！" : "この ちほうは おしまい！";
    var msg = all ? "47とどうふけん ぜんぶの めいぶつを あつめたよ。すごい！"
                  : "ぜんぶ まわったよ。ほかの ちほうにも いってみよう！";
    AU.fanfare();
    confetti(all ? 60 : 34);
    speak([title]);
    overlay(
      '<div class="ovemo">' + emo + "</div>" +
      "<h2>" + title + "</h2>" +
      "<p>" + msg + "</p>" +
      '<div class="ovbtns">' +
      '<button class="btn btn-primary" data-ov="again">もう いちど</button>' +
      '<button class="btn btn-mint" data-ov="regions">ちほうを えらぶ</button>' +
      '<button class="btn btn-ghost" data-ov="home">ホームへ</button>' +
      "</div>"
    );
    $("ovcard").querySelector('[data-ov="again"]').addEventListener("click", function(){
      closeOverlay();
      if(G.mode === "journey"){ startJourney(); }
      else { startRegion(G.region); }
    });
    $("ovcard").querySelector('[data-ov="regions"]').addEventListener("click", function(){
      closeOverlay(); nav = ["home"]; go("region");
    });
    $("ovcard").querySelector('[data-ov="home"]').addEventListener("click", function(){
      closeOverlay(); nav = ["home"]; enter("home");
    });
  }

  /* ================= スタート ================= */
  function startJourney(){
    var left = ORDER.filter(function(id){ return !ST.done[id]; });
    var route = left.length ? left : ORDER.slice();
    begin("journey", null, route);
  }
  function startRegion(r){
    var ids = BY_R[r];
    var left = ids.filter(function(id){ return !ST.done[id]; });
    var route = shuffle(left.length ? left : ids.slice());
    begin("region", r, route);
  }

  function buildRegionList(){
    var host = $("rlist");
    host.innerHTML = "";
    REGIONS.forEach(function(rg){
      var ids = BY_R[rg.id];
      var done = ids.filter(function(id){ return ST.done[id]; }).length;
      var b = el("button", "rcard");
      b.style.setProperty("--c", rg.c);
      var dots = ids.map(function(id){ return '<i class="' + (ST.done[id] ? "on" : "") + '"></i>'; }).join("");
      b.innerHTML = '<span class="rdot"></span><span class="rmain"><span class="rname"><em class="remo">' + rg.emo + '</em>' + rg.name + "</span>" +
        '<span class="rdots">' + dots + "</span></span>" +
        '<span class="rside"><span class="rcount">' + done + " / " + ids.length + "</span>" +
        (regionDone(rg.id) ? '<span class="crown">👑</span>' : "") + "</span>";
      b.addEventListener("click", function(){
        AU.tap();
        startRegion(rg.id);
      });
      host.appendChild(b);
    });
  }

  function buildZukan(){
    var host = $("zlist");
    host.innerHTML = "";
    REGIONS.forEach(function(rg){
      var ids = BY_R[rg.id];
      var sec = el("div", "zsec");
      var head = el("div", "zhead");
      head.style.setProperty("--c", rg.c);
      var done = ids.filter(function(id){ return ST.done[id]; }).length;
      head.innerHTML = '<span class="rdot"></span><span>' + rg.name + "</span><em>" + done + " / " + ids.length + "</em>";
      sec.appendChild(head);
      var grid = el("div", "zgrid");
      ids.forEach(function(id){
        var got = !!ST.done[id];
        var b = el("button", "zcard" + (got ? "" : " off"));
        b.type = "button";
        b.innerHTML = '<span class="zemo">' + (got ? P[id].e : "❓") + '</span><span class="zname">' + (got ? P[id].n : "？？？") + "</span>";
        b.addEventListener("click", function(){
          if(got){ AU.tap(); showZukan(id); } else { AU.boop(); }
        });
        grid.appendChild(b);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
    $("zkCount").textContent = doneCount();
  }

  function showZukan(id){
    var p = P[id];
    var hints = p.h.map(function(h){ return '<div class="hrow"><span class="he">' + h.e + '</span><span class="ht">' + h.t + "</span></div>"; }).join("");
    overlay(
      '<div class="ovemo">' + p.e + "</div>" +
      "<h2>" + p.k + "</h2>" +
      '<p class="ovtag">' + p.m + "</p>" +
      '<div style="text-align:left;margin:0 0 12px">' + hints + "</div>" +
      '<p style="margin:0 0 12px">' + p.f + "</p>" +
      '<div class="ovbtns"><button class="btn btn-ghost" data-ov="close">とじる</button></div>'
    );
    $("ovcard").querySelector('[data-ov="close"]').addEventListener("click", closeOverlay);
  }

  /* ================= スタートアップ ================= */
  function start(){
    loadApp();
    loadST();
    buildMap($("mapHero"), false);
    paintChip();
    refreshHome();
    heroVB();

    each("[data-go]", function(b){ b.addEventListener("click", function(){ AU.ready(); AU.tap(); go(b.getAttribute("data-go")); }); });
    each("[data-back]", function(b){ b.addEventListener("click", function(){ AU.tap(); back(); }); });

    $("btnGo").addEventListener("click", function(){ AU.ready(); AU.tap(); startJourney(); });
    $("btnRegion").addEventListener("click", function(){ AU.tap(); go("region"); });
    $("btnZukan").addEventListener("click", function(){ AU.tap(); go("zukan"); });
    $("btnPlayBack").addEventListener("click", function(){ AU.tap(); stopSpeak(); nav = ["home"]; enter("home"); });
    $("btnSay").addEventListener("click", function(){ if(G.cur){ speakQ(G.cur); } });

    $("sndBtn").addEventListener("click", function(){
      APP.sound = !APP.sound;
      $("sndBtn").textContent = APP.sound ? "🔊" : "🔇";
      if(!APP.sound){ stopSpeak(); }
      saveApp();
      if(APP.sound){ AU.tap(); }
    });

    $("plChip").addEventListener("click", function(){ AU.tap(); openPl(); });
    $("plClose").addEventListener("click", function(){ closePl(); });
    $("plNew").addEventListener("click", function(){ $("plForm").classList.add("open"); try{ $("plName").focus(); }catch(e){} });
    $("plAdd").addEventListener("click", addPlayer);
    $("plName").addEventListener("keydown", function(e){ if(e.key === "Enter"){ addPlayer(); } });

    $("ov").addEventListener("click", function(e){ if(e.target === $("ov")){ closeOverlay(); } });
    $("plOv").addEventListener("click", function(e){ if(e.target === $("plOv")){ closePl(); } });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closeOverlay(); } });
    document.addEventListener("visibilitychange", function(){ if(document.hidden){ stopSpeak(); } });

    var rt = null;
    window.addEventListener("resize", function(){
      if(rt){ clearTimeout(rt); }
      rt = setTimeout(function(){
        ["mapHero", "mapPlay"].forEach(function(k){
          var svg = $(k);
          if(!svg){ return; }
          var vb = (k === "mapHero") ? fullVB() : G.home;
          if(vb){ goVB(svg, vb, 0); }
        });
        var mp = $("mapPlay");
        if(mp){ TRAIN.pxw = mp.getBoundingClientRect().width || TRAIN.pxw; syncTrain(); }
      }, 160);
    });

    if(!APP.players.length){
      setTimeout(openPl, 420);
    }
  }

  function each(sel, fn){
    var list = document.querySelectorAll(sel);
    for(var i = 0; i < list.length; i++){ fn(list[i]); }
  }

  if(typeof document !== "undefined" && document.addEventListener){
    document.addEventListener("DOMContentLoaded", start);
  }

  if(typeof globalThis !== "undefined"){
    globalThis.__G = function(){ return G; };
    globalThis.__ST = function(){ return ST; };
    globalThis.__P = P;
    globalThis.__order = ORDER;
  }
})();
</script>
</body>
</html>
