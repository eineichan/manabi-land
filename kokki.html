<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFAF4">
<meta name="description" content="6さいからの こっきカード。こっきを めくって おぼえて、くにあて クイズで あそぼう。">
<title>せかいの こっきカード｜めくって おぼえる</title>
<style>
  :root{
    --ivory:#FDFAF4;
    --card:#FFFFFF;
    --ink:#544B46;
    --ink2:#7A6E67;
    --ink3:#94867C;
    --pink:#EFA9B8;
    --pink-d:#D98A9B;
    --pink-dd:#B45566;
    --pink-l:#FDF0F3;
    --pink-ink:#B4637A;
    --mint:#9BD3C0;
    --mint-d:#7CBCA6;
    --mint-dd:#3E8571;
    --mint-l:#EAF7F2;
    --mustard:#E9C46A;
    --mustard-d:#C99C3C;
    --mustard-l:#FCF4DE;
    --mustard-ink:#8C6220;
    --sky:#A8CFE0;
    --sky-d:#7FAEC3;
    --sky-l:#EDF6FB;
    --sky-ink:#3F7691;
    --line:#F0E7D9;
    --shadow:0 10px 26px rgba(120,101,90,.09);
    --shadow-lg:0 18px 44px rgba(120,101,90,.16);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ivory)}
  body{
    margin:0;
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    background:var(--ivory);
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 8% 2%,rgba(239,169,184,.22),transparent 42%),
      radial-gradient(circle at 94% 76%,rgba(155,211,192,.26),transparent 46%),
      radial-gradient(circle at 76% 5%,rgba(233,196,106,.16),transparent 36%),
      radial-gradient(circle at 20% 92%,rgba(168,207,224,.20),transparent 44%);
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:1;
    max-width:520px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .screen{display:none;flex-direction:column;flex:1;min-height:0;gap:12px}
  .screen.active{display:flex;animation:screenIn .34s ease both}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;border:0;border-radius:26px;
    font-family:inherit;font-size:19px;font-weight:700;letter-spacing:.03em;
    padding:17px 16px;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
    user-select:none;
  }
  .btn-primary{
    background:linear-gradient(180deg,#E28D9E 0%,#CE7287 100%);color:#fff;
    box-shadow:0 6px 0 #A9505F,0 14px 26px rgba(169,80,95,.24);
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 #A9505F,0 6px 12px rgba(169,80,95,.2)}
  .btn-mint{
    background:linear-gradient(180deg,#BFE6D8 0%,#9BD3C0 100%);color:#335C50;
    box-shadow:0 6px 0 var(--mint-d),0 14px 26px rgba(124,188,166,.26);
  }
  .btn-mint:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-d),0 6px 12px rgba(124,188,166,.2)}
  .btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .btn-small{font-size:16.5px;padding:14px 14px;border-radius:22px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .chip{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:5px 13px;border-radius:999px;
    background:var(--mustard-l);color:#8C6220;
    font-size:13.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  }
  .icon-btn{
    width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(120,101,90,.13);
    color:var(--ink2);font-size:17px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.off{color:#B7ABA1}

  /* ---------- top bar ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
  .bar-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}

  /* ---------- start ---------- */
  .start-top{display:flex;align-items:center;justify-content:space-between}
  .kick{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:2px solid var(--line);
    padding:7px 15px;border-radius:999px;
    font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink2);
  }
  .kick::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}
  .start-title{
    margin:4px 0 0;font-size:clamp(30px,9vw,42px);line-height:1.2;letter-spacing:.02em;font-weight:700;
  }
  .start-title em{font-style:normal;color:var(--pink-d)}
  .start-sub{margin:0;font-size:15px;line-height:1.65;color:var(--ink2);font-weight:700}
  .hero-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
  .hero-art{position:relative;width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;animation:floaty 6s ease-in-out infinite}
  .hero-art > svg{width:100%;height:auto;max-height:230px;display:block}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero-flag{
    position:absolute;width:62px;border-radius:11px;overflow:hidden;
    border:3px solid #fff;box-shadow:0 8px 18px rgba(120,101,90,.18);
    animation:floaty 5s ease-in-out infinite;
  }
  .hero-flag svg{display:block;width:100%;height:auto}
  .hero-flag.hf1{left:0;top:6%;animation-delay:-1.2s}
  .hero-flag.hf2{right:0;top:26%;animation-delay:-2.6s}
  .hero-flag.hf3{left:9%;bottom:2%;animation-delay:-3.8s}
  .hero-caption{margin:8px 0 0;text-align:center;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em}
  .start-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
  .start-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ---------- flag box ---------- */
  .flag-box{
    display:flex;align-items:center;justify-content:center;
    width:100%;border-radius:18px;overflow:hidden;background:#fff;
    box-shadow:0 8px 22px rgba(120,101,90,.15), 0 1px 0 rgba(255,255,255,.8) inset;
    border:1px solid rgba(84,75,70,.15);
  }
  .flag-box svg{display:block;width:100%;height:auto}

  /* ---------- flashcard ---------- */
  .flash-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1500px}
  .flip{position:relative;width:100%;max-width:450px;min-height:280px;aspect-ratio:1 / 0.98;max-height:100%;cursor:pointer}
  .flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.4,.05,.2,1)}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:#fff;border-radius:30px;border:2px solid #fff;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:15px;overflow:hidden;
  }
  .face.back{
    transform:rotateY(180deg);
    background:linear-gradient(180deg,#FFFFFF 0%,#FDF5EA 100%);
    justify-content:center;
  }
  .fb-flag{width:100%;max-width:400px}
  .flip-hint{
    margin:0;font-size:13.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3);
    display:flex;align-items:center;gap:7px;
  }
  .flip-hint::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--pink-l);border:2px solid var(--pink)}
  .fb-flag-sm{width:56%;max-width:230px;flex:0 0 auto}
  .fb-name{margin:2px 0 0;font-size:clamp(23px,7vw,32px);font-weight:700;letter-spacing:.05em;text-align:center;line-height:1.2}
  .region-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:700;letter-spacing:.08em;
    padding:4px 12px;border-radius:999px;background:var(--mint-l);color:var(--mint-dd);
  }
  .region-pill.r-rose{background:var(--pink-l);color:var(--pink-ink)}
  .region-pill.r-mint{background:var(--mint-l);color:var(--mint-dd)}
  .region-pill.r-mustard{background:var(--mustard-l);color:var(--mustard-ink)}
  .region-pill.r-sky{background:var(--sky-l);color:var(--sky-ink)}
  .fb-fact{
    margin:0;font-size:13.5px;line-height:1.65;font-weight:700;color:var(--ink2);
    text-align:center;text-wrap:balance;max-width:290px;
  }
  .speak-btn{
    display:inline-flex;align-items:center;gap:7px;
    border:2px solid var(--line);background:#fff;border-radius:999px;
    font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);
    padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--line);
  }
  .speak-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .flash-actions{display:flex;flex-direction:column;gap:9px}
  .flash-actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

  /* ---------- quiz ---------- */
  .dots{display:flex;gap:7px;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#EBE1D2;transition:all .25s ease}
  .dot.on{background:var(--mint);box-shadow:0 0 0 4px rgba(155,211,192,.22)}
  .dot.now{background:#fff;box-shadow:0 0 0 2px var(--pink)}
  .quiz-card{
    flex:0 0 auto;width:100%;max-width:400px;margin:0 auto;
    background:#fff;border-radius:28px;padding:14px 14px 16px;
    box-shadow:var(--shadow);border:2px solid #fff;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .qz-flag{width:100%}
  .qz-q{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.04em;color:var(--ink2);text-align:center}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:480px;margin:0 auto}
  .choice{
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:60px;padding:10px 8px;width:100%;
    background:#fff;border:2.5px solid var(--line);border-radius:22px;
    box-shadow:0 4px 0 var(--line);
    font-family:inherit;font-size:clamp(14.5px,4.2vw,19px);font-weight:700;letter-spacing:.02em;color:var(--ink);
    cursor:pointer;word-break:break-word;line-height:1.25;
    transition:transform .1s ease,box-shadow .1s ease,background .15s ease,border-color .15s ease,opacity .2s;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .choice.correct{background:var(--mint-l);border-color:var(--mint);box-shadow:0 4px 0 var(--mint);animation:bump .45s ease}
  .choice.wrong{background:#FAF6F0;border-color:#EDE4D6;box-shadow:0 4px 0 #EDE4D6;opacity:.45}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-6px)}78%{transform:translateX(4px)}}
  .shake{animation:shakeX .42s ease}
  #screen-quiz .quiz-card{margin-top:auto}
  #screen-quiz .qz-foot{margin-bottom:auto}
  .qz-foot{
    margin:10px 0 0;text-align:center;font-size:14px;font-weight:700;color:var(--ink2);
    min-height:22px;letter-spacing:.03em;
  }
  .qz-foot.good{color:var(--mint-dd)}
  .qz-foot.oops{color:var(--pink-ink)}

  /* ---------- zukan ---------- */
  .zk-title{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:.06em;text-align:center}
  .zk-total{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);border:2px solid #fff}
  .zk-total-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .zk-total-row span{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
  .zk-total-row b{font-size:20px;font-weight:700;color:var(--pink-ink);letter-spacing:.03em}
  .bar-track{height:10px;border-radius:999px;background:#F4ECDF;overflow:hidden}
  .bar-track i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#EFA9B8,#F3C7A8,#9BD3C0);transition:width .5s cubic-bezier(.3,1,.4,1)}
  .zk-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 6px;display:flex;flex-direction:column;gap:16px}
  .zk-ghead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .zk-gname{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;letter-spacing:.04em}
  .zk-dot{width:9px;height:9px;border-radius:50%;background:var(--mint)}
  .zk-dot.r-rose{background:var(--pink)}
  .zk-dot.r-mustard{background:var(--mustard)}
  .zk-dot.r-sky{background:var(--sky)}
  .zk-gcount{font-size:12.5px;font-weight:700;color:var(--ink3)}
  .zk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .zt{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:7px 7px 8px;background:#fff;border:2px solid var(--line);border-radius:18px;
    box-shadow:0 3px 10px rgba(120,101,90,.06);
    font-family:inherit;cursor:pointer;transition:transform .12s ease;
  }
  .zt:active{transform:scale(.96)}
  .zt.got{border-color:#F3DBA9;background:linear-gradient(180deg,#fff 55%,var(--mustard-l))}
  .zt-flag{width:100%;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(120,101,90,.14)}
  .zt-flag svg{display:block;width:100%;height:auto}
  .zt-name{font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.2;text-align:center;letter-spacing:.01em}
  .zt.got .zt-name{color:var(--ink)}
  .zt-star{
    position:absolute;top:5px;right:5px;z-index:2;
    width:20px;height:20px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;line-height:1;box-shadow:0 2px 5px rgba(120,101,90,.18);
  }
  .zt.got .zt-star{background:var(--mustard-l)}
  .zt-star.empty{background:rgba(255,255,255,.92);color:#C4B6A7;box-shadow:0 1px 3px rgba(120,101,90,.12)}
  .reset-btn{
    align-self:center;background:none;border:0;color:#A2958B;
    font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 10px;
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:22px;
    background:rgba(84,75,70,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .overlay.open{display:flex;animation:screenIn .24s ease both}
  .panel{
    position:relative;width:100%;max-width:340px;
    background:linear-gradient(180deg,#FFFDF8,#FBF4E9);
    border-radius:32px;padding:22px 20px 20px;
    box-shadow:var(--shadow-lg);border:2px solid #fff;
    display:flex;flex-direction:column;align-items:center;gap:11px;
  }
  .ov-close{
    position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
    border:0;background:#F4EDE1;color:var(--ink2);font-size:15px;font-family:inherit;cursor:pointer;
  }
  .res-emoji{font-size:52px;line-height:1;margin:0;animation:bump 1.4s ease-in-out infinite}
  .res-count{margin:-2px 0 -8px;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.12em}
  .res-actions{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:4px}
  #detailKnow[disabled]{
    opacity:1;background:linear-gradient(180deg,#BFE6D8,#9BD3C0);color:#335C50;
    box-shadow:0 4px 0 var(--mint-d);
  }
  .dt-name{margin:0;font-size:26px;font-weight:700;letter-spacing:.05em;text-align:center}
  #ovDetail .panel{padding-top:46px}
  .res-title{margin:0;font-size:23px;font-weight:700;letter-spacing:.02em;text-align:center;line-height:1.4}
  .res-sub{margin:0;font-size:13.5px;font-weight:700;line-height:1.75;color:var(--ink2);text-align:center;text-wrap:balance}
  .dt-fact{margin:0;font-size:14px;line-height:1.75;font-weight:700;color:var(--ink2);text-align:center;text-wrap:balance}
  .dt-actions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:2px}
  .confirm-box{
    width:100%;max-width:320px;background:#fff;border-radius:28px;padding:24px 20px;
    box-shadow:var(--shadow-lg);text-align:center;display:flex;flex-direction:column;gap:16px;
  }
  .confirm-box p{margin:0;font-size:14.5px;font-weight:700;line-height:1.7}
  .confirm-actions{display:flex;gap:9px}

  /* ---------- toast + fx ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:85;
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#fff;border:2px solid var(--mustard);border-radius:999px;
    padding:10px 20px;font-size:15px;font-weight:700;color:var(--mustard-ink);
    box-shadow:0 12px 26px rgba(120,101,90,.18);white-space:nowrap;
  }
  .toast.show{animation:toastIn 1.5s ease forwards}
  @keyframes toastIn{
    0%{opacity:0;transform:translate(-50%,14px) scale(.9)}
    16%{opacity:1;transform:translate(-50%,0) scale(1)}
    78%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-8px) scale(.98)}
  }
  #fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

  /* ---------- responsive ---------- */
  @media (min-width:560px){
    .app{padding-left:26px;padding-right:26px}
    .zk-grid{grid-template-columns:repeat(4,1fr);gap:9px}
    .zt-name{font-size:12px}
  }
  @media (min-width:700px){
    .app{max-width:640px;padding:calc(env(safe-area-inset-top,0px) + 24px) 30px calc(env(safe-area-inset-bottom,0px) + 22px)}
    .start-title{font-size:42px}
    .start-sub{font-size:16px}
    .hero-art{max-width:420px}
    .hero-art > svg{max-height:310px}
    .start-actions{max-width:440px;margin-left:auto;margin-right:auto;width:100%}
    .btn{font-size:19px;padding:17px}
    .flag-box{border-radius:22px}
    .zk-grid{grid-template-columns:repeat(5,1fr)}
    .zk-scroll{gap:20px}
    .choices{grid-template-columns:1fr 1fr;gap:11px}
    .choice{min-height:70px;font-size:19px}
    .quiz-card{max-width:480px}
    .qz-q{font-size:17px}
    .flip{max-width:560px;max-height:none;aspect-ratio:1 / 0.8}
    .fb-flag{max-width:520px}
    .fb-flag-sm{width:56%}
    .fb-name{font-size:36px}
    .fb-fact{font-size:16px;max-width:340px}
    .flip-hint{font-size:15px}
    .panel{max-width:400px}
    .res-title{font-size:26px}
  }
  @media (min-width:700px) and (orientation:landscape){
    .app{max-width:720px}
    .flip{max-width:560px;aspect-ratio:1 / 0.66}
  }
  @media (max-height:730px){
    .start-title{font-size:clamp(26px,8vw,34px)}
    .hero-art > svg{max-height:170px}
    .hero-caption{display:none}
    .btn{padding:14px;font-size:17.5px}
    .btn-small{padding:12px;font-size:15.5px}
    .fb-fact{font-size:13.5px}
    .qz-flag{max-width:74%}
    .choice{min-height:54px}
  }
  @media (max-height:640px){
    .start-sub{display:none}
    .hero-art > svg{max-height:130px}
    .fb-flag-sm{width:46%}
    .fb-fact{font-size:12px;line-height:1.55}
    .fb-name{font-size:21px}
  }
  @media (max-height:560px){

<script>
/* =========================================================
   flag drawing helpers  (all flags drawn in a 90 x 60 box)
   ========================================================= */

  function svgF(inner){
    return '<svg viewBox="0 0 90 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">'+inner+'</svg>';
  }
  function rct(x,y,w,h,c){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>'; }
  function crc(cx,cy,rr,c){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+rr+'" fill="'+c+'"/>'; }
  function pgn(p,c){ return '<polygon points="'+p+'" fill="'+c+'"/>'; }
  function pth(d,c){ return '<path d="'+d+'" fill="'+c+'"/>'; }

  function star(cx,cy,ro,fill,stroke){
    var pts=[],i,a,rr;
    for(i=0;i<10;i++){
      a=-Math.PI/2+i*Math.PI/5;
      rr=(i%2)?ro*0.44:ro;
      pts.push((cx+Math.cos(a)*rr).toFixed(2)+','+(cy+Math.sin(a)*rr).toFixed(2));
    }
    return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="1.2" stroke-linejoin="round"':'')+'/>';
  }
  function starLine(cx,cy,ro,stroke,sw){
    var pts=[],i,a,rr;
    for(i=0;i<10;i++){
      a=-Math.PI/2+i*Math.PI/5;
      rr=(i%2)?ro*0.44:ro;
      pts.push((cx+Math.cos(a)*rr).toFixed(2)+','+(cy+Math.sin(a)*rr).toFixed(2));
    }
    return '<polygon points="'+pts.join(' ')+'" fill="none" stroke="'+stroke+'" stroke-width="'+(sw||2)+'" stroke-linejoin="round"/>';
  }
  function hband(colors){
    var n=colors.length,h=60/n,s='',i;
    for(i=0;i<n;i++){ s+=rct(0,i*h,90,h,colors[i]); }
    return s;
  }
  function vband(colors){
    var n=colors.length,w=90/n,s='',i;
    for(i=0;i<n;i++){ s+=rct(i*w,0,w,60,colors[i]); }
    return s;
  }
  function nordic(bg,outer,inner){
    var s=rct(0,0,90,60,bg);
    if(inner){
      s+=rct(27,0,18,60,outer)+rct(0,21,90,18,outer);
      s+=rct(32,0,8,60,inner)+rct(0,26,90,8,inner);
    } else {
      s+=rct(29,0,14,60,outer)+rct(0,23,90,14,outer);
    }
    return s;
  }
  function unionJack(){
    return rct(0,0,90,60,'#012169')
      + '<path d="M0,0 L90,60 M90,0 L0,60" stroke="#FFFFFF" stroke-width="14" fill="none"/>'
      + '<path d="M0,0 L90,60 M90,0 L0,60" stroke="#C8102E" stroke-width="6" fill="none"/>'
      + rct(36,0,18,60,'#FFFFFF') + rct(0,21,90,18,'#FFFFFF')
      + rct(40,0,10,60,'#C8102E') + rct(0,25,90,10,'#C8102E');
  }
  function cantonJack(){ return '<g transform="scale(0.5,0.5)">'+unionJack()+'</g>'; }
  function eagle(cx,cy,sc,color){
    return '<g transform="translate('+cx+','+cy+') scale('+sc+') translate(-45,-30)" fill="'+color+'">'
      + '<path d="M45,26.6 l1.6,1.2 l7,-2.6 l-2,4.2 l5,0.8 l-5.8,2.4 l-5.8,6 l-5.8,-6 l-5.8,-2.4 l5,-0.8 l-2,-4.2 l7,2.6 z"/>'
      + '<circle cx="45" cy="24.6" r="1.3"/>'
      + '<path d="M43.7,24.2 l-1.7,0.6 l1.7,0.7 z"/>'
      + '</g>';
  }

  /* =========================================================
   the flags

  var FLAGS = (function(){
    var f = {}, i, s, row, col;

    /* --- asia --- */
    f.jp = rct(0,0,90,60,'#FFFFFF') + crc(45,30,16,'#BC002D');

    f.th = rct(0,0,90,10,'#A51931')+rct(0,10,90,9,'#F4F5F8')+rct(0,19,90,22,'#2D2A4A')+rct(0,41,90,9,'#F4F5F8')+rct(0,50,90,10,'#A51931');

    f.mn = rct(0,0,30,60,'#C4272E')+rct(30,0,30,60,'#015197')+rct(60,0,30,60,'#C4272E')

    /* --- europe --- */
    f.uk = unionJack();
    f.fr = vband(['#0055A4','#FFFFFF','#EF4135']);

      + pth('M23.3,23.1 h5.4 v4.4 a2.7,2.7 0 0 1 -5.4,0 z','#F1BF00')

    f.ie = vband(['#169B62','#FFFFFF','#FF883E']);

    /* --- africa --- */
    f.eg = hband(['#CE1126','#FFFFFF','#000000']) + eagle(45,30,1,'#C09300');

    f.ke = rct(0,0,90,17,'#000000')+rct(0,17,90,3.5,'#FFFFFF')
      + rct(0,20.5,90,19,'#BB0000')+rct(0,39.5,90,3.5,'#FFFFFF')
      + rct(0,43,90,17,'#006600')
      + '<ellipse cx="45" cy="30" rx="8.4" ry="11.6" fill="#FFFFFF"/>'

      + '<path d="M-6,0 L-6,60 L29,30 Z" fill="#000000" stroke="#FFB612" stroke-width="3.4" stroke-linejoin="round"/>';

    f.ma = rct(0,0,90,60,'#C1272D') + starLine(45,30.5,13,'#006233',2.4);

    f.ng = vband(['#008751','#FFFFFF','#008751']);

    f.et = hband(['#078930','#FCDD09','#DA121A'])

  function shuffle(list){
    for(var i=list.length-1;i>0;i--){

      var t = list[i]; list[i] = list[j]; list[j] = t;

  var actx = null;

  function ensureAudio(){
    if(actx){
      if(actx.state === 'suspended' && actx.resume){ try{ actx.resume(); }catch(e){} }
      return actx;
    }
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ actx = new AC(); }
    }catch(e){ actx = null; }
    return actx;
  }

  function tone(freq, delay, dur, opts){
    if(!state.sound){ return; }
    var ctx = ensureAudio();
    if(!ctx){ return; }
    opts = opts || {};
    try{
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var t0 = ctx.currentTime + delay;
      var vol = (opts.vol === undefined) ? 0.15 : opts.vol;
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if(opts.to){ osc.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur); }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }catch(e){}
  }

  var fx = $('fx');
  var fxctx = null;
  var parts = [];
  var rafId = null;
  var COLORS = ['#EFA9B8','#9BD3C0','#E9C46A','#F7C9D3','#A8CFE0','#F6D79B','#FFFFFF'];

  try{ if(fx && fx.getContext){ fxctx = fx.getContext('2d'); } }catch(e){ fxctx = null; }

  function sizeFx(){
    if(!fx){ return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth || 375;
    var h = window.innerHeight || 700;
    fx.width = Math.floor(w*dpr);
    fx.height = Math.floor(h*dpr);
    if(fxctx && fxctx.setTransform){ fxctx.setTransform(dpr,0,0,dpr,0,0); }
  }

  function burst(x,y,count,spread){
    if(!fxctx){ return; }
    sizeFx();
    var n = count || 36;
    var sp = spread || 1;
    for(var i=0;i<n;i++){
      var ang = (-Math.PI/2) + (Math.random()-0.5)*Math.PI*1.5;
      var v = (2.2 + Math.random()*4.6)*sp;
      parts.push({
        x:x, y:y,
        vx:Math.cos(ang)*v, vy:Math.sin(ang)*v,
        g:0.055 + Math.random()*0.05,
        size:5 + Math.random()*7,
        rot:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.35,
        color:oneOf(COLORS),
        shape:(Math.random() < 0.34) ? 'circle' : 'rect',
        life:1
      });
    }
    if(!rafId){ rafId = window.requestAnimationFrame(tick); }
  }

  function tick(){
    rafId = null;
    if(!fxctx){ parts = []; return; }
    fxctx.clearRect(0,0,window.innerWidth||375,window.innerHeight||700);
    var alive = [];
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.007;
      if(p.life <= 0 || p.y > (window.innerHeight||700) + 40){ continue; }
      fxctx.save();
      fxctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxctx.translate(p.x,p.y);
      fxctx.rotate(p.rot);
      fxctx.fillStyle = p.color;
      if(p.shape === 'circle'){
        fxctx.beginPath();
        fxctx.arc(0,0,p.size*0.42,0,Math.PI*2);
        fxctx.fill();
      } else {
        fxctx.fillRect(-p.size/2,-p.size/4,p.size,p.size*0.55);
      }
      fxctx.restore();
      alive.push(p);
    }
    parts = alive;
    if(parts.length){ rafId = window.requestAnimationFrame(tick); }
  }

  function celebrate(big){
    var w = window.innerWidth || 375;
    var h = window.innerHeight || 700;
    burst(w*0.5, h*0.36, big ? 52 : 34, 1);
    if(big){
      burst(w*0.16, h*0.52, 20, 0.85);
      burst(w*0.84, h*0.52, 20, 0.85);
    }
  }

      if(names[i] === name){ sc.classList.add('active'); } else { sc.classList.remove('active'); }
    }
    current = name;
    stopSpeak();
  }

  var toastTimer = null;
  function toast(text){
    var t = $('toast');
    if(!t){ return; }
    t.textContent = text;
    t.classList.remove('show');
    void t.offsetWidth;
    t.classList.add('show');
    if(toastTimer){ window.clearTimeout(toastTimer); }
    toastTimer = window.setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  function paintSound(){
    var btns = document.querySelectorAll('[data-sound]');
    for(var i=0;i<btns.length;i++){
      btns[i].textContent = state.sound ? '🔊' : '🔇';
      if(state.sound){ btns[i].classList.remove('off'); } else { btns[i].classList.add('off'); }
      btns[i].setAttribute('aria-label', state.sound ? 'おとを けす' : 'おとを つける');
    }
  }

  function toggleSound(){
    state.sound = !state.sound;
    saveState();
    paintSound();
    if(!state.sound){ stopSpeak(); } else { playTap(); }
  }

  function paintCounts(){
    var n = learnedCount();
    var sc = $('startCount');
    if(sc){ sc.textContent = n + ' / ' + TOTAL; }
    var zc = $('zkCount');
    if(zc){ zc.textContent = n + ' / ' + TOTAL; }
    var bar = $('zkBar');
    if(bar){ bar.style.width = (TOTAL ? (n/TOTAL*100) : 0).toFixed(1) + '%'; }
  }

  /* =========================================================
   flash cards
   ========================================================= */

  var flash = { list:[], i:0 };

  function startFlash(){
    flash.list = shuffle(COUNTRIES.slice());
    flash.i = 0;
    renderFlash();
    show('flash');
    playTap();
  }

  function renderFlash(){
    var c = flash.list[flash.i];
    if(!c){ return; }
    var card = $('flipCard');
    card.classList.remove('flipped');
    $('fbFlag').innerHTML = FLAGS[c.id];
    $('fbFlag2').innerHTML = FLAGS[c.id];
    $('fbName').textContent = c.name;
    var reg = regionOf(c.region);
    var pill = $('fbRegion');
    pill.textContent = reg.name;
    pill.className = 'region-pill r-' + reg.tone;
    $('fbFact').textContent = c.fact;
    $('fbCount').textContent = (flash.i + 1) + ' / ' + TOTAL;
  }

  function flipCard(){
    var card = $('flipCard');
    var nowFlipped = !card.classList.contains('flipped');
    card.classList.toggle('flipped', nowFlipped);
    playFlip();
    if(nowFlipped){
      var c = flash.list[flash.i];
      speak(c.name);
    }
  }

  function moveFlash(step){
    if(!flash.list.length){ return; }
    flash.i = (flash.i + step + flash.list.length) % flash.list.length;
    renderFlash();
    playTap();
  }

  var flashBusy = false;

  function knowFlash(){
    if(flashBusy){ return; }
    var c = flash.list[flash.i];
    if(!c){ return; }
    flashBusy = true;
    var isNew = markLearned(c.id);
    playStar();
    if(isNew){
      celebrate(false);
      toast('⭐ ゲット！' + c.name);
      speak(c.name);
    } else {
      toast('⭐ もう おぼえてるよ');
    }
    window.setTimeout(function(){ flashBusy = false; moveFlash(1); }, isNew ? 620 : 240);
  }

  /* =========================================================
   quiz
   ========================================================= */

  var QUIZ_LEN = 5;
  var quiz = { list:[], i:0, firstTry:0, missed:0, locked:false, q:null, stars:0 };

  function pickCountry(used){
    var fresh = [], rest = [], i, c;
    for(i=0;i<COUNTRIES.length;i++){
      c = COUNTRIES[i];
      if(used[c.id]){ continue; }
      if(isLearned(c.id)){ rest.push(c); } else { fresh.push(c); }
    }
    if(fresh.length){ return oneOf(fresh); }
    if(rest.length){ return oneOf(rest); }
    return oneOf(COUNTRIES);
  }

  function makeChoices(c){
    var same = [], other = [], i, d;
    for(i=0;i<COUNTRIES.length;i++){
      d = COUNTRIES[i];
      if(d.id === c.id){ continue; }
      if(d.region === c.region){ same.push(d); } else { other.push(d); }
    }
    shuffle(same);
    shuffle(other);
    var picks = [];
    if(same.length){ picks.push(same[0]); }
    for(i=0;i<other.length && picks.length<3;i++){ picks.push(other[i]); }
    for(i=1;i<same.length && picks.length<3;i++){ picks.push(same[i]); }
    while(picks.length > 3){ picks.pop(); }
    picks.push(c);
    return shuffle(picks);
  }

  function startQuiz(){
    var used = {}, i;
    quiz.list = [];
    quiz.i = 0;
    quiz.firstTry = 0;
    quiz.missed = 0;
    quiz.stars = 0;
    quiz.locked = false;
    for(i=0;i<QUIZ_LEN;i++){
      var c = pickCountry(used);
      used[c.id] = 1;
      quiz.list.push(c);
    }
    renderQuiz();
    show('quiz');
    playTap();
  }

  function paintDots(){
    var box = $('qzDots');
    if(!box){ return; }
    var html = '', i;
    for(i=0;i<QUIZ_LEN;i++){
      var cls = 'dot';
      if(i < quiz.i){ cls += ' on'; }
      if(i === quiz.i){ cls += ' now'; }
      html += '<span class="' + cls + '"></span>';
    }
    box.innerHTML = html;
  }

  function renderQuiz(){
    var c = quiz.list[quiz.i];
    if(!c){ showResult(); return; }
    quiz.q = c;
    quiz.locked = false;
    quiz.missed = 0;
    $('qzFlag').innerHTML = FLAGS[c.id];
    paintDots();
    var foot = $('qzFoot');
    foot.textContent = 'こっきを よく みてね';
    foot.className = 'qz-foot';
    var box = $('qzChoices');
    box.innerHTML = '';
    var opts = makeChoices(c);
    for(var i=0;i<opts.length;i++){
      var b = document.createElement('button');
      b.className = 'choice';
      b.type = 'button';
      b.textContent = opts[i].name;
      b.setAttribute('data-id', opts[i].id);
      b.addEventListener('click', onChoice);
      box.appendChild(b);
    }
  }

  function onChoice(ev){
    var btn = ev.currentTarget;
    if(quiz.locked){ return; }
    var id = btn.getAttribute('data-id');
    var c = quiz.q;
    if(!c){ return; }

    if(id === c.id){
      quiz.locked = true;
      btn.classList.add('correct');
      var isNew = markLearned(c.id);
      if(isNew){ quiz.stars++; }
      if(quiz.missed === 0){ quiz.firstTry++; }
      playCorrect();
      if(isNew){ celebrate(false); }
      var foot = $('qzFoot');
      foot.className = 'qz-foot good';
      foot.textContent = oneOf(['せいかい！','やったね！','すごい！','ぴったり！']) + ' ' + c.name + 'だよ';
      speak(c.name);
      window.setTimeout(function(){
        quiz.i++;
        if(quiz.i >= QUIZ_LEN){ showResult(); } else { renderQuiz(); }
      }, isNew ? 1250 : 1000);
    } else {
      quiz.missed++;
      btn.classList.add('wrong');
      btn.disabled = true;
      playWrong();
      var card = $('qzFlag');
      if(card){
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
      var f = $('qzFoot');
      f.className = 'qz-foot oops';
      f.textContent = 'おしい！もう いっかい！';
    }
  }

  function showResult(){
    var got = quiz.firstTry;
    $('resCount').textContent = QUIZ_LEN + 'もん ちゅう';
    $('resTitle').textContent = (got === QUIZ_LEN) ? 'ぜんぶ せいかい！' : (got + 'もん せいかい！');
    var emoji = '🌸', msg = '';
    if(got === QUIZ_LEN){ emoji = '🏆'; msg = 'こっき はかせだね！'; }
    else if(got >= 4){ emoji = '🎉'; msg = 'すごい！あと すこしで ぜんぶだよ'; }
    else if(got >= 3){ emoji = '🌼'; msg = 'いいね！その ちょうし！'; }
    else if(got >= 2){ emoji = '🌱'; msg = 'ちょっとずつ おぼえていこう'; }
    else { emoji = '🍀'; msg = 'だいじょうぶ！つぎは きっと できるよ'; }
    $('resEmoji').textContent = emoji;
    var sub = msg;
    if(quiz.stars > 0){ sub += ' ⭐を ' + quiz.stars + 'こ ゲット！'; }
    $('resSub').textContent = sub;
    $('ovResult').classList.add('open');
    if(got >= 3){ celebrate(true); }
    playStar();
  }

  function closeResult(){
    $('ovResult').classList.remove('open');
  }

  /* =========================================================
   picture book (zukan)
   ========================================================= */

  function renderZukan(){
    var box = $('zkList');
    if(!box){ return; }
    var html = '', r, i, list, got, c, learned;
    for(r=0;r<REGIONS.length;r++){
      var reg = REGIONS[r];
      list = [];
      got = 0;
      for(i=0;i<COUNTRIES.length;i++){
        if(COUNTRIES[i].region === reg.id){ list.push(COUNTRIES[i]); }
      }
      for(i=0;i<list.length;i++){ if(isLearned(list[i].id)){ got++; } }
      html += '<div class="zk-group">';
      html += '<div class="zk-ghead"><span class="zk-gname"><i class="zk-dot r-' + reg.tone + '"></i>' + reg.name + '</span>';
      html += '<span class="zk-gcount">' + got + ' / ' + list.length + '</span></div>';
      html += '<div class="zk-grid">';
      for(i=0;i<list.length;i++){
        c = list[i];
        learned = isLearned(c.id);
        html += '<button type="button" class="zt' + (learned ? ' got' : '') + '" data-id="' + c.id + '">';
        if(learned){ html += '<span class="zt-star">⭐</span>'; }
        html += '<span class="zt-flag">' + FLAGS[c.id] + '</span>';
        html += '<span class="zt-name">' + c.name + '</span>';
        html += '</button>';
      }
      html += '</div></div>';
    }
    box.innerHTML = html;
    paintCounts();
  }

  var detailId = null;

  function openDetail(id){
    var c = countryById(id);
    if(!c){ return; }
    detailId = id;
    $('detailFlag').innerHTML = FLAGS[c.id];
    $('detailName').textContent = c.name;
    var reg = regionOf(c.region);
    var pill = $('detailRegion');
    pill.textContent = reg.name;
    pill.className = 'region-pill r-' + reg.tone;
    $('detailFact').textContent = c.fact;
    var know = $('detailKnow');
    if(isLearned(c.id)){
      know.textContent = '⭐ おぼえた！';
      know.disabled = true;
    } else {
      know.textContent = 'おぼえた！⭐';
      know.disabled = false;
    }
    $('ovDetail').classList.add('open');
    playTap();
    speak(c.name);
  }

  function closeDetail(){
    $('ovDetail').classList.remove('open');
    stopSpeak();
  }

  /* =========================================================
   wiring
   ========================================================= */

  function openZukan(){
    renderZukan();
    show('zukan');
    playTap();
  }

  function wire(){
    $('btnFlash').addEventListener('click', startFlash);
    $('btnQuiz').addEventListener('click', startQuiz);
    $('btnZukan').addEventListener('click', openZukan);

    $('fbBack').addEventListener('click', function(){ show('start'); paintCounts(); });
    $('fbPrev').addEventListener('click', function(){ moveFlash(-1); });
    $('fbNext').addEventListener('click', function(){ moveFlash(1); });
    $('fbKnow').addEventListener('click', knowFlash);
    $('fbSpeak').addEventListener('click', function(ev){
      ev.stopPropagation();
      var c = flash.list[flash.i];
      if(c){ speak(c.name); }
    });
    $('flipCard').addEventListener('click', flipCard);
    $('flipCard').addEventListener('keydown', function(ev){
      if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); flipCard(); }
    });

    $('qzBack').addEventListener('click', function(){ show('start'); paintCounts(); });
    $('resAgain').addEventListener('click', function(){ closeResult(); startQuiz(); });
    $('resHome').addEventListener('click', function(){ closeResult(); show('start'); paintCounts(); });

    $('zkBack').addEventListener('click', function(){ show('start'); paintCounts(); });
    $('zkList').addEventListener('click', function(ev){
      var t = ev.target;
      while(t && t !== this){
        if(t.getAttribute && t.getAttribute('data-id')){ openDetail(t.getAttribute('data-id')); return; }
        t = t.parentNode;
      }
    });

    $('detailClose').addEventListener('click', closeDetail);
    $('detailSpeak').addEventListener('click', function(){
      var c = countryById(detailId);
      if(c){ speak(c.name); }
    });
    $('detailKnow').addEventListener('click', function(){
      var c = countryById(detailId);
      if(!c){ return; }
      if(markLearned(c.id)){
        playStar();
        celebrate(false);
        toast('⭐ ゲット！' + c.name);
        this.textContent = '⭐ おぼえた！';
        this.disabled = true;
      }
      renderZukan();
    });

    var ovs = document.querySelectorAll('.overlay');
    for(var i=0;i<ovs.length;i++){
      ovs[i].addEventListener('click', function(ev){
        if(ev.target === this){ this.classList.remove('open'); stopSpeak(); }
      });
    }

    $('btnReset').addEventListener('click', function(){ $('ovConfirm').classList.add('open'); });
    $('cfNo').addEventListener('click', function(){ $('ovConfirm').classList.remove('open'); });
    $('cfYes').addEventListener('click', function(){
      state.learned = {};
      state.right = {};
      saveState();
      $('ovConfirm').classList.remove('open');
      renderZukan();
      paintCounts();
      toast('さいしょから やりなおしたよ');
    });

    var sr = document.querySelectorAll('[data-sound]');
    for(var s=0;s<sr.length;s++){ sr[s].addEventListener('click', toggleSound); }

    window.addEventListener('resize', sizeFx);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ stopSpeak(); }
    });
  }

  /* =========================================================
   boot
   ========================================================= */

  loadState();
  paintSound();
  paintCounts();
  sizeFx();
  wire();

  /* little flags floating around the globe on the start screen */
  (function(){
    var art = $('heroArt');
    if(!art){ return; }
    var picks = ['jp','br','fr'];
    for(var i=0;i<picks.length;i++){
      var d = document.createElement('div');
      d.className = 'hero-flag hf' + (i+1);
      d.innerHTML = FLAGS[picks[i]];
      art.appendChild(d);
    }
  })();
</script>
</body>
</html>
