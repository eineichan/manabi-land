<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFAF4">
<meta name="description" content="6さいからの さんすう。できた もんだいで ボードの あなを うめて、にがてを けしていくよ。たしざんと くく。">
<title>さんすう クリアボード｜たしざんと くく</title>
<style>
  :root{
    --ivory:#FDFAF4;
    --card:#FFFFFF;
    --ink:#4A423E;
    --ink2:#6E625B;
    --ink3:#8A7C72;
    --rose-1:#D2748A;
    --rose-2:#C4637A;
    --rose-3:#A9505F;
    --rose-ink:#9E4359;
    --mint-ink:#2F6B59;
    --pink:#EFA9B8;
    --pink-d:#D98A9B;
    --pink-l:#FBE7EB;
    --mint:#9BD3C0;
    --mint-d:#7CBCA6;
    --mint-l:#E6F5EF;
    --mustard:#E9C46A;
    --mustard-d:#C99C3C;
    --mustard-l:#FCF1D6;
    --lav:#B9AEDC;
    --lav-l:#EFECF9;
    --lav-ink:#4E4488;
    --line:#EFE5D6;
    --shadow:0 10px 26px rgba(120,101,90,.09);
    --shadow-lg:0 18px 44px rgba(120,101,90,.16);
    --dot:11px;
    --dotgap:3px;
    --dotc:#7CBCA6;
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ivory)}
  body{
    margin:0;
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    background:var(--ivory);
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 8% 2%,rgba(239,169,184,.22),transparent 42%),
      radial-gradient(circle at 94% 76%,rgba(155,211,192,.26),transparent 46%),
      radial-gradient(circle at 76% 5%,rgba(185,174,220,.20),transparent 36%);
  }
  :focus-visible{outline:3px solid #6FBFA4;outline-offset:2px}

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:1;
    max-width:430px;margin:0 auto;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);
  }
  .screen{display:none;flex-direction:column;flex:1;min-height:0;gap:9px}
  .screen.active{display:flex;animation:screenIn .3s ease both}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:0;border-radius:26px;
    font-family:inherit;font-size:20px;font-weight:800;letter-spacing:.03em;
    padding:17px 14px;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
    user-select:none;
  }
  .btn-primary{
    background:linear-gradient(180deg,var(--rose-1) 0%,var(--rose-2) 100%);color:#fff;
    box-shadow:0 6px 0 var(--rose-3),0 14px 26px rgba(169,80,95,.24);
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rose-3),0 6px 12px rgba(169,80,95,.2)}
  .btn-mint{
    background:linear-gradient(180deg,#BFE6D8 0%,#9BD3C0 100%);color:#2F564B;
    box-shadow:0 5px 0 var(--mint-d),0 12px 22px rgba(124,188,166,.22);
  }
  .btn-mint:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-d),0 6px 12px rgba(124,188,166,.18)}
  .btn-ghost{
    background:#fff;color:var(--ink);border:2px solid var(--line);
    box-shadow:0 4px 0 var(--line);
  }
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .btn-small{font-size:17px;padding:12px 14px;border-radius:22px}
  .chip{
    display:inline-flex;align-items:center;justify-content:center;
    padding:3px 11px;border-radius:999px;
    background:var(--mustard-l);color:#7A5A14;
    font-size:13px;font-weight:800;letter-spacing:.02em;
  }
  .icon-btn{
    width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(120,101,90,.13);
    color:var(--ink2);font-size:18px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:scale(.94)}
  .mute{
    position:fixed;z-index:60;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    right:max(12px,calc(50vw - 215px + 12px));
    width:44px;height:44px;font-size:18px;
  }
  .mute.off{opacity:.55}

  /* ---------- home ---------- */
  .home-head{display:flex;flex-direction:column;gap:1px}
  .hh-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:52px;min-height:20px}
  .kick{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:2px solid var(--line);
    padding:4px 12px;border-radius:999px;
    font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--ink2);
  }
  .kick::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink)}
  .allline{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.01em;white-space:nowrap}
  .allline b{color:var(--rose-ink);font-size:12.5px}
  .home-title{
    margin:1px 0 0;font-size:clamp(19px,5.7vw,23px);line-height:1.22;letter-spacing:.02em;font-weight:800;
    white-space:nowrap;
    color:var(--ink);
  }
  .home-title em{font-style:normal;color:#BE5A72}

  .tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:7px;
    background:#fff;border:2px solid var(--line);border-radius:22px;padding:5px;
    box-shadow:0 3px 0 var(--line);
  }
  .tab{
    border:0;background:transparent;border-radius:17px;padding:9px 4px;
    font-family:inherit;font-weight:800;font-size:17px;color:var(--ink2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .tab .sym{font-size:19px;line-height:1;font-weight:800}
  .tab.active[data-mode="tashi"]{
    background:linear-gradient(180deg,#FBE7EB,#F7D6DE);color:#8E3A4F;
    box-shadow:inset 0 0 0 2px var(--pink);
  }
  .tab.active[data-mode="kuku"]{
    background:linear-gradient(180deg,#EFECF9,#E2DBF6);color:#443B7C;
    box-shadow:inset 0 0 0 2px var(--lav);
  }

  /* ---------- board ---------- */
  .board{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:8px;
    padding:1px 1px 4px;
  }
  .board.center{justify-content:center}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chips.three{grid-template-columns:1fr 1fr 1fr}
  .tsub{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:1px 2px 0}
  .tsub .tsub-t{font-size:11.5px;font-weight:800;color:var(--ink2)}
  .tsub .tsub-n{font-size:11px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .chipbtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    padding:6px 6px 5px;border:2px solid var(--line);background:#fff;border-radius:16px;
    font-family:inherit;font-weight:800;font-size:12.5px;color:var(--ink2);cursor:pointer;
    box-shadow:0 3px 0 var(--line);line-height:1.3;
  }
  .chipbtn .cb-num{font-size:11px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .chipbtn.on{background:var(--mint-l);border-color:var(--mint);box-shadow:0 3px 0 var(--mint);color:var(--mint-ink)}
  .chipbtn.on .cb-num{color:var(--mint-ink)}
  .chipbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

  .ttable{
    display:grid;grid-template-columns:15px repeat(9,minmax(0,1fr));
    gap:3px;width:100%;
  }
  .th,.tr{
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:var(--ink2);
    font-variant-numeric:tabular-nums;
  }
  .th{height:14px}
  .th-corner{font-size:11px;color:var(--rose-ink)}
  .tr{font-size:10.5px;color:var(--ink2)}
  .sp{aspect-ratio:1 / 1}

  .cell{
    position:relative;aspect-ratio:1 / 1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    padding:0;border-radius:9px;
    border:1.5px dashed #E0D3C2;background:#FCFAF5;color:#776B63;
    font-family:inherit;font-weight:800;line-height:1;
    cursor:pointer;transition:transform .1s ease;
    overflow:hidden;
  }
  .cell .cnum{font-size:13.5px;font-variant-numeric:tabular-nums}
  .cell .cbadge{font-size:8px;line-height:1;height:9px}
  .cell:active{transform:scale(.93)}
  .cell.ok{
    background:linear-gradient(180deg,#F3FBF7 0%,#DEF1E9 100%);
    border:1.5px solid #9BD3C0;color:var(--mint-ink);
    box-shadow:0 2px 0 rgba(124,188,166,.35);
  }
  .cell.ok.g11{
    background:linear-gradient(180deg,#FEF5F7 0%,#FAE2E8 100%);
    border-color:#EFA9B8;color:var(--rose-ink);
    box-shadow:0 2px 0 rgba(239,169,184,.45);
  }
  .cell.ok.kuku{
    background:linear-gradient(180deg,#F7F5FE 0%,#E7E2F7 100%);
    border-color:#B9AEDC;color:var(--lav-ink);
    box-shadow:0 2px 0 rgba(185,174,220,.45);
  }
  .cell.perfect,.cell.ok.perfect{
    background:linear-gradient(180deg,#FFFCEE 0%,#FBEFC8 100%);
    border-color:#E0B657;color:#7A5A14;
    box-shadow:0 2px 0 rgba(224,182,87,.5);
  }
  .cell.nigate,.cell.ok.nigate{
    background:linear-gradient(180deg,#F5FDF9 0%,#DEF3E8 100%);
    border-style:solid;border-color:#63B096;color:#27604E;
    box-shadow:0 2px 0 rgba(99,176,150,.4);
  }
  .cell.pop{animation:cellPop .62s cubic-bezier(.2,1.4,.45,1)}
  @keyframes cellPop{
    0%{transform:scale(.55);filter:brightness(1.5)}
    55%{transform:scale(1.14)}
    100%{transform:scale(1)}
  }
  .cell.big{aspect-ratio:1.18 / 1;border-radius:18px;gap:2px}
  .cell.big .clabel{font-size:11px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .cell.big .cnum{font-size:27px}
  .cell.big .cbadge{font-size:12px;height:14px}
  .cell.big.ok .clabel,.cell.big.nigate .clabel{color:var(--ink2)}

  /* dan strip */
  .danstrip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
  .danchip{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:5px 1px 4px;border:2px solid var(--line);background:#fff;border-radius:12px;
    font-family:inherit;color:var(--ink2);cursor:pointer;box-shadow:0 2px 0 var(--line);
  }
  .danchip .dc-num{font-size:13px;font-weight:800;line-height:1}
  .danchip .dc-bar{display:block;width:70%;height:3px;border-radius:2px;background:#F0E7D9;overflow:hidden}
  .danchip .dc-bar i{display:block;height:100%;width:0;background:var(--mint-d);border-radius:2px}
  .danchip .dc-bar i.full{background:var(--mustard-d)}
  .danchip .dc-crown{position:absolute;top:-7px;right:-3px;font-size:11px;line-height:1}
  .danchip.on{background:var(--lav-l);border-color:var(--lav);box-shadow:0 2px 0 var(--lav);color:var(--lav-ink)}
  .danchip.done{border-color:#E9D7A6;background:linear-gradient(180deg,#FFFDF4,#FBF0D6);color:#7A5A14}
  .danchip:active{transform:translateY(2px)}

  .mixbtn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:15px;
    font-family:inherit;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer;
    box-shadow:0 3px 0 var(--line);
  }
  .mixbtn .mx-ico{font-size:14px}
  .mixbtn .mx-n{font-size:11px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .mixbtn.on{background:var(--lav-l);border-color:var(--lav);box-shadow:0 3px 0 var(--lav);color:var(--lav-ink)}
  .mixbtn.on .mx-n{color:var(--lav-ink)}
  .mixbtn:active{transform:translateY(2px)}

  .danrow{
    display:flex;flex-direction:column;gap:4px;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:5px 6px 6px;
  }
  .danrow.done{background:linear-gradient(180deg,#FFFDF4,#FBF2DA);border-color:#EAD9AB}
  .dr-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 1px}
  .dr-t{font-size:10.5px;font-weight:800;color:var(--ink2)}
  .dr-r{font-size:10px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .dr-bar{flex:1;height:4px;border-radius:2px;background:#F1E8DA;overflow:hidden;margin:0 2px;align-self:center}
  .dr-bar i{display:block;height:100%;background:var(--mint-d);border-radius:2px}
  .dr-bar i.full{background:var(--mustard-d)}
  .danrow.done .dr-t,.danrow.done .dr-r{color:#7A5A14}
  .dr-cells{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}

  .danhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:1px 2px 0}
  .danhead .dh-t{font-size:15px;font-weight:800;color:var(--lav-ink)}
  .danhead .dh-r{font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .pbar{height:7px;border-radius:99px;background:#EFE8DD;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#BFE6D8,#9BD3C0);transition:width .35s ease}
  .dan-crown{
    font-size:12px;font-weight:800;color:#7A5A14;background:linear-gradient(180deg,#FFF8E6,#FCEBC4);
    border:1.5px solid #E9C46A;border-radius:12px;padding:5px 9px;text-align:center;
  }
  .kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  .legend{display:flex;flex-wrap:wrap;gap:3px 10px;padding:2px 2px 0;font-size:10.5px;font-weight:800;color:var(--ink2)}
  .lg{display:inline-flex;align-items:center;gap:3px}
  .lg-i{font-size:11px;font-weight:800;color:var(--ink)}
  .lg-sw{display:inline-block;width:11px;height:11px;border-radius:4px;border:1.5px solid #9BD3C0;background:linear-gradient(180deg,#F3FBF7,#DEF1E9)}
  .board-tip{margin:0;font-size:10.5px;font-weight:800;color:var(--ink2);padding:0 2px 2px;line-height:1.5}

  .home-actions{display:flex;flex-direction:column;gap:2px;margin-top:auto}
  .start-note{text-align:center;font-size:10.5px;font-weight:800;color:var(--ink2);padding:0 0 2px}
  .reset-btn{
    align-self:center;background:none;border:0;color:var(--ink2);
    font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:.06em;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:3px 8px;
  }

  /* ---------- quiz ---------- */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 52px 0 0}
  .dots{display:flex;gap:8px;align-items:center}
  .dot{width:11px;height:11px;border-radius:50%;background:#EBE1D2;transition:all .25s ease}
  .dot.on{background:var(--mint);box-shadow:0 0 0 4px rgba(155,211,192,.25)}
  .dot.now{background:#fff;box-shadow:0 0 0 2px var(--pink)}
  .combo{
    min-width:88px;text-align:right;font-size:13px;font-weight:800;color:var(--rose-ink);
    opacity:0;transform:translateY(4px);transition:all .2s ease;
  }
  .combo.show{opacity:1;transform:none}
  .q-card{
    background:#fff;border-radius:30px;padding:14px 14px 14px;
    box-shadow:var(--shadow);border:2px solid #fff;
    flex:0 0 auto;width:100%;margin:auto 0;
    min-height:clamp(270px,36vh,340px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;--dot:14px;--dotgap:4px;
  }
  .q-card-top{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;min-height:28px;
  }
  .q-kind{
    font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--mint-ink);
    background:var(--mint-l);padding:4px 12px;border-radius:999px;white-space:nowrap;
  }
  .q-kind.k-kuku{color:var(--lav-ink);background:var(--lav-l)}
  .q-kind.k-hard{color:#7A5A14;background:var(--mustard-l)}
  .hint-btn{
    border:2px solid var(--line);background:#FBF7EF;border-radius:999px;
    font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink2);
    padding:5px 10px;cursor:pointer;white-space:nowrap;
  }
  .hint-btn.on{background:var(--mint-l);border-color:var(--mint);color:var(--mint-ink)}
  #qBody{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;width:100%;text-align:center;flex:1 1 auto;min-height:0;
  }
  .q-eq{
    font-size:56px;font-weight:800;line-height:1.1;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .q-eq .n{display:inline-block;min-width:.6em}
  .q-eq .op{color:var(--ink2);margin:0 1px}
  .q-eq .pq{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:68px;height:72px;padding:0 6px;border-radius:20px;
    background:var(--mustard-l);color:#8A6318;
    border:3px dashed var(--mustard);font-size:36px;
  }
  .q-hint{
    display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;
    background:#FBF7EF;border-radius:20px;padding:10px 8px 8px;
  }
  .q-hint.off{display:none}
  .q-caption{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.02em}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .choice{
    display:flex;align-items:center;justify-content:center;
    width:100%;min-height:66px;padding:12px 8px;
    background:#fff;border:2.5px solid var(--line);border-radius:22px;
    box-shadow:0 4px 0 var(--line);
    font-family:inherit;font-size:30px;font-weight:800;letter-spacing:.02em;color:var(--ink);
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:transform .1s ease,box-shadow .1s ease,background .15s ease,border-color .15s ease,opacity .2s;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .choice.correct{
    background:var(--mint-l);border-color:var(--mint);box-shadow:0 4px 0 var(--mint);
    color:var(--mint-ink);
    animation:bump .45s ease;
  }
  .choice.wrong{background:#FAF6F0;border-color:#E9DFD1;box-shadow:0 4px 0 #E9DFD1;opacity:.45;color:#8A7C72}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-6px)}78%{transform:translateX(4px)}}
  .shake{animation:shakeX .42s ease}

  /* ---------- dots hint ---------- */
  .dots-wrap{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;max-width:100%}
  .dot-grid{display:grid;gap:var(--dotgap);justify-content:start}
  .d{display:block;width:var(--dot);height:var(--dot);border-radius:50%;background:var(--dotc);flex:0 0 auto}
  .dot-grid.pink .d{--dotc:#EFA9B8}
  .dots-op{font-size:22px;font-weight:800;color:var(--ink2);line-height:1}
  .array-wrap{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
  .array-row{display:flex;gap:var(--dotgap);padding:1px 4px;border-radius:8px}
  .array-row.alt{background:var(--mint-l)}
  .array-row .d{--dotc:#7CBCA6}

  /* ---------- stamp ---------- */
  .stamp{
    position:fixed;left:50%;top:36%;z-index:75;pointer-events:none;

        out.push({ id: String(p.id), name: String(p.name).slice(0, 10), icon: String(p.icon || '🐰') });
      }
    }
    return out;
  }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) { return list[i]; } }
    return null;
  }
  function byName(list, name) {
    for (var i = 0; i < list.length; i++) { if (sameName(list[i].name, name)) { return list[i]; } }
    return null;
  }

  /* ---- この アプリの ほぞん ---- */
  function readListOf(kind, key) {
    if (kind === 'array') { return clean(j(key)); }
    var o = j(key) || {};
    return clean(o.players);
  }
  function ownList() { return readListOf(CFG.kind, CFG.listKey); }
  function ownWrite(list) {
    if (CFG.kind === 'array') { s(CFG.listKey, JSON.stringify(list)); return; }
    var o = j(CFG.listKey) || {};
    o.players = list;
    s(CFG.listKey, JSON.stringify(o));
  }
  function ownCur() {
    if (CFG.kind === 'array') { return g(CFG.curKey) || ''; }
    var o = j(CFG.listKey) || {};
    return o[CFG.curField || 'cur'] || '';
  }
  function ownCurWrite(id) {
    if (CFG.kind === 'array') {
      if (id) { s(CFG.curKey, String(id)); } else { rm(CFG.curKey); }
      return;
    }
    var o = j(CFG.listKey) || {};
    o[CFG.curField || 'cur'] = id || null;
    s(CFG.listKey, JSON.stringify(o));
  }

  /* ---- まとめるときに みる アプリ ---- */
  var SOURCES = [
    { kind: 'array', listKey: 'kotoba-quiz-v2:players' },
    { kind: 'obj', listKey: 'shiritori-robot-v3:meta' },
    { kind: 'array', listKey: 'hyakunin-isshu-v2:players' },
    { kind: 'obj', listKey: 'todofuken-sugoroku-v2' },
    { kind: 'array', listKey: 'kokki-flashcard-v2:players' },
    { kind: 'array', listKey: 'sansu-board-v2:players' }
  ];

  function readShared() { return clean(j(SH_P)); }
  function writeShared(list) { s(SH_P, JSON.stringify(list)); }

  function ensure(list, p) {
    var hit = byId(list, p.id) || byName(list, p.name);
    if (hit) { return hit; }
    list.push({ id: String(p.id), name: String(p.name).slice(0, 10), icon: String(p.icon || '🐰') });
    return list[list.length - 1];
  }

  function newId() {
    return 'w' + String(new Date().getTime().toString(36)) + String(Math.floor(Math.random() * 900) + 100);
  }

  /* ほかの アプリで つかっている なまえを まとめる */
  function gather(shared) {
    var changed = false, i, k, list, before;
    for (i = 0; i < SOURCES.length; i++) {
      list = readListOf(SOURCES[i].kind, SOURCES[i].listKey);
      for (k = 0; k < list.length; k++) {
        before = shared.length;
        ensure(shared, list[k]);
        if (shared.length !== before) { changed = true; }
      }
    }
    return changed;
  }

  /* アプリを ひらいた ときの つなぎこみ。
     トップで えらんだ なまえが あれば、その なまえで すぐ はじめる。 */
  function sync() {
    var shared = readShared(), own = ownList(), changed = false, i, before, curId, curP, op;

    changed = gather(shared);
    for (i = 0; i < own.length; i++) {
      before = shared.length;
      ensure(shared, own[i]);
      if (shared.length !== before) { changed = true; }
    }

    curId = g(SH_C) || '';
    curP = byId(shared, curId);
    if (!curP) {
      var oc = ownCur(), ocp = byId(own, oc);
      curP = byId(shared, oc) || (ocp ? byName(shared, ocp.name) : null) || (own[0] ? byName(shared, own[0].name) : null) || shared[0] || null;
    }
    if (curP) {
      if (String(curId) !== String(curP.id)) { s(SH_C, curP.id); }
      if (!byId(shared, curP.id)) { shared.push(curP); changed = true; }
    }
    if (changed) { writeShared(shared); }
    if (!curP) { return null; }

    op = byName(own, curP.name) || byId(own, curP.id);
    if (!op) {
      op = { id: curP.id, name: curP.name, icon: curP.icon };
      own.push(op);
      changed = true;
    }
    /* ほかの きょうだいも すぐ えらべるように、なまえを そろえておく */
    for (i = 0; i < shared.length; i++) {
      if (!byName(own, shared[i].name) && !byId(own, shared[i].id)) {
        own.push({ id: shared[i].id, name: shared[i].name, icon: shared[i].icon });
        changed = true;
      }
    }
    if (changed) { ownWrite(own); }
    ownCurWrite(op.id);
    return { own: op, shared: curP };
  }

  /* アプリの なかで なまえを かえた とき（トップと そろえる） */
  function setCurrent(name, icon) {
    var nm = String(name == null ? '' : name).replace(/[\s\u3000]+/g, '').slice(0, 10);
    if (!nm) { return null; }
    var shared = readShared(), p = byName(shared, nm);
    if (!p) {
      p = { id: newId(), name: nm, icon: String(icon || '🐰') };
      shared.push(p);
    } else if (icon && p.icon !== icon) {
      p.icon = String(icon);
    }
    writeShared(shared);
    s(SH_C, p.id);
    return p;
  }

  window.WakuwakuPark = {
    players: function () { return readShared(); },
    current: function () { return g(SH_C) || ''; },
    currentPlayer: function () { return byId(readShared(), g(SH_C) || ''); },
    setCurrent: setCurrent,
    nameOf: function (id) { var p = byId(readShared(), id); return p ? p.name : ''; },
    sameName: sameName,
    sync: sync
  };

  sync();
})();
</script>

<script>
(function () {
  'use strict';

  /* =========================================================
     small utils
     ========================================================= */

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function oneOf(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* =========================================================
     question catalogue: 81 tashi + 81 kuku
     ========================================================= */

  var TASHI_QS = [];
  var KUKU_QS = [];
  var BY_KEY = {};
  var GROUPS = {
    g10: { label: 'こたえ 10まで', total: 45 },
    g11: { label: 'くりあがり', total: 36 }
  };

  (function build() {
    for (var a = 1; a <= 9; a++) {
      for (var b = 1; b <= 9; b++) {
        var tq = {
          kind: 'tashi', a: a, b: b, ans: a + b,
          grp: (a + b <= 10 ? 'g10' : 'g11'),
          key: 't' + a + ',' + b
        };
        TASHI_QS.push(tq);
        BY_KEY[tq.key] = tq;

        var kq = { kind: 'kuku', a: a, b: b, ans: a * b, grp: 'd' + a, key: 'k' + a + ',' + b };
        KUKU_QS.push(kq);
        BY_KEY[kq.key] = kq;
      }
    }
  })();

  /* =========================================================
     storage  (key: sansu-board-v2)
     ========================================================= */

  var STORE_KEY = 'sansu-board-v2';
  var MUTE_KEY = 'sansu-board-muted';
  var PLAYERS_KEY = 'sansu-board-v2:players';
  var CKEY = 'sansu-board-v2:current';
  var PLAYER_MAX = 8;
  var ICONS = ['🐰', '🌸', '🍡', '🌙', '⭐', '🍓', '🐱', '🐶'];
  var PLAYERS = [];
  var CUR = null;
  var pickedIcon = ICONS[0];
  var store = blankStore();
  var muted = false;

  function blankStore() { return { v: 2, q: {}, done: {}, rounds: 0 }; }

  /* ---------- player helpers ---------- */

  function readLS(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function writeLS(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function dropLS(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  /* なまえは ひらがなに そろえる（カタカナは ひらがなに、それいがいは けす） */
  function toHira(s) {
    var t = String(s == null ? '' : s), out = '', i, c;
    for (i = 0; i < t.length; i++) {
      c = t.charCodeAt(i);
      if (c >= 0x30A1 && c <= 0x30F6) { out += String.fromCharCode(c - 0x60); }
      else if (c >= 0x3041 && c <= 0x3096) { out += t.charAt(i); }
    }
    return out;
  }

  function storeKeyOf(pid) { return pid ? 'sansu-board-v2:p:' + pid : STORE_KEY; }
  function storeKey() { return storeKeyOf(CUR && CUR.id); }

  function loadPlayers() {
    PLAYERS = [];
    var a = null;
    try { a = JSON.parse(readLS(PLAYERS_KEY) || 'null'); } catch (e) { a = null; }
    if (Object.prototype.toString.call(a) === '[object Array]') {
      for (var i = 0; i < a.length; i++) {
        var p = a[i];
        if (p && p.id && p.name) {
          PLAYERS.push({ id: String(p.id), name: String(p.name), icon: String(p.icon || ICONS[0]) });
        }
      }
    }
    CUR = null;
    var cid = readLS(CKEY) || '';
    for (var k = 0; k < PLAYERS.length; k++) {
      if (PLAYERS[k].id === cid) { CUR = PLAYERS[k]; }
    }
    if (!CUR && window.WakuwakuPark) {
      var mp = window.WakuwakuPark.currentPlayer();
      if (mp) {
        CUR = { id: String(mp.id), name: String(mp.name), icon: String(mp.icon || ICONS[0]) };
        PLAYERS.push(CUR);
        savePlayers();
        writeLS(CKEY, CUR.id);
      }
    }
    if (!CUR && PLAYERS.length) { CUR = PLAYERS[0]; writeLS(CKEY, CUR.id); }
  }

  function savePlayers() { writeLS(PLAYERS_KEY, JSON.stringify(PLAYERS)); }

  /* とうろく まえに あそんだ きろくを、さいしょの プレイヤーに ひきつぐ */
  function adoptLegacy() {
    if (!CUR) { return; }
    var pk = storeKeyOf(CUR.id);
    if (readLS(pk)) { return; }
    var old = readLS(STORE_KEY);
    if (!old) { return; }
    writeLS(pk, old);
    dropLS(STORE_KEY);
  }

  function clearCountOf(pid) {
    var d = null;
    try { d = JSON.parse(readLS(storeKeyOf(pid)) || 'null'); } catch (e) { d = null; }
    var q = (d && d.q && typeof d.q === 'object') ? d.q : {}, c = 0, k;
    for (k in q) {
      if (!Object.prototype.hasOwnProperty.call(q, k)) { continue; }
      if (q[k] && q[k].c) { c++; }
    }
    return c;
  }

  function paintChip() {
    var emo = $('plChipIcon'), nm = $('plChipName');
    if (!emo || !nm) { return; }
    emo.textContent = CUR ? (CUR.icon || ICONS[0]) : '🙂';
    nm.textContent = CUR ? CUR.name : 'なまえ';
  }

  function paintIcons() {
    var host = $('plIcs');
    if (!host) { return; }
    host.innerHTML = '';
    for (var i = 0; i < ICONS.length; i++) {
      (function (ic) {
        var b = el('button', ic === pickedIcon ? 'on' : '', ic);
        b.type = 'button';
        b.setAttribute('aria-label', 'えらぶ えもじ');
        b.addEventListener('click', function () { pickedIcon = ic; paintIcons(); playTap(); });
        host.appendChild(b);
      })(ICONS[i]);
    }
  }

  function renderPl() {
    var host = $('plList');
    if (!host) { return; }
    host.innerHTML = '';
    if (!PLAYERS.length) {
      host.appendChild(el('p', 'pllead', 'まだ だれも いないよ。したの わくに なまえを かいてね'));
    }
    for (var i = 0; i < PLAYERS.length; i++) {
      (function (p) {
        var row = el('div', 'pl-row' + (CUR && CUR.id === p.id ? ' on' : ''));
        row.appendChild(el('span', 'plemo', p.icon || ICONS[0]));
        var mid = el('span', 'plmid');
        mid.appendChild(el('span', 'plname', p.name));
        mid.appendChild(el('span', 'plnum', 'できた ' + clearCountOf(p.id) + ' / 162'));
        row.appendChild(mid);
        if (CUR && CUR.id === p.id) {
          row.appendChild(el('span', 'now', 'いま'));
        } else {
          var b = el('button', '', 'えらぶ');
          b.type = 'button';
          b.addEventListener('click', function () { playTap(); usePlayer(p); });
          row.appendChild(b);
        }
        host.appendChild(row);
      })(PLAYERS[i]);
    }
    paintIcons();
  }

  function openPl() {
    renderPl();
    var err = $('plErr');
    if (err) { err.textContent = ''; }
    var ov = $('plOverlay');
    if (ov) { ov.classList.add('open'); }
    if (!PLAYERS.length) { var inp = $('plName'); if (inp && inp.focus) { try { inp.focus(); } catch (e) {} } }
  }

  function closePl() {
    var ov = $('plOverlay');
    if (ov) { ov.classList.remove('open'); }
  }

  function usePlayer(p) {
    if (!p || !p.id) { return; }
    if (CUR && CUR.id === p.id) { closePl(); return; }
    saveStore();
    session = null;
    CUR = p;
    writeLS(CKEY, p.id);
    if (window.WakuwakuPark) { window.WakuwakuPark.setCurrent(p.name, p.icon); }
    adoptLegacy();
    loadStore();
    renderHome();
    paintChip();
    closePl();
  }

  function addPlayer() {
    var input = $('plName');
    var name = toHira((input && input.value) || '').replace(/[\s\u3000]+/g, '').slice(0, 10);
    var err = $('plErr');
    if (!name) { if (err) { err.textContent = 'なまえを ひらがなで いれてね'; } return; }
    if (PLAYERS.length >= PLAYER_MAX) { if (err) { err.textContent = 'プレイヤーは ' + PLAYER_MAX + 'にんまで だよ'; } return; }
    saveStore();
    var p = { id: 's' + String(new Date().getTime().toString(36)) + String(PLAYERS.length), name: name, icon: pickedIcon };
    var first = PLAYERS.length === 0;
    PLAYERS.push(p);
    savePlayers();
    session = null;
    CUR = p;
    writeLS(CKEY, p.id);
    if (first) { adoptLegacy(); }
    if (window.WakuwakuPark) { window.WakuwakuPark.setCurrent(p.name, p.icon); }
    if (input) { input.value = ''; }
    if (err) { err.textContent = ''; }
    loadStore();
    renderHome();
    paintChip();
    closePl();
    playTap();
  }

  function loadStore() {
    store = blankStore();
    try {
      var raw = window.localStorage.getItem(storeKey());
      if (!raw) { return; }
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') { return; }
      if (data.q && typeof data.q === 'object') {
        for (var k in data.q) {
          if (!Object.prototype.hasOwnProperty.call(data.q, k)) { continue; }
          if (!BY_KEY[k]) { continue; }
          var v = data.q[k] || {};
          var c = v.c ? 1 : 0, p = v.p ? 1 : 0, n = v.n ? 1 : 0;
          if (c || p || n) { store.q[k] = { c: c, p: p, n: n }; }
        }
      }
      if (data.done && typeof data.done === 'object') {
        for (var g in data.done) {
          if (!Object.prototype.hasOwnProperty.call(data.done, g)) { continue; }
          if (data.done[g] && /^(d[1-9]|g10|g11|all)$/.test(g)) { store.done[g] = 1; }
        }
      }
      if (typeof data.rounds === 'number' && data.rounds >= 0) { store.rounds = data.rounds; }
    } catch (e) { store = blankStore(); }
  }

  function saveStore() {
    try { window.localStorage.setItem(storeKey(), JSON.stringify(store)); } catch (e) {}
  }

  function loadPref() {
    try { return window.localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { return false; }
  }

  function savePref() {
    try { window.localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
  }

  function entryState(key) { return store.q[key] || { c: 0, p: 0, n: 0 }; }

  function st(key) {
    if (!store.q[key]) { store.q[key] = { c: 0, p: 0, n: 0 }; }
    return store.q[key];
  }

  function modeList(mode) { return mode === 'kuku' ? KUKU_QS : TASHI_QS; }

  function modeStats(mode) {
    var list = modeList(mode), c = 0, n = 0;
    for (var i = 0; i < list.length; i++) {

  function yomiOf(q) { return YOMI['k' + q.a + ',' + q.b] || (q.a + 'かける ' + q.b); }

  function splitYomi(s) {
    var t = String(s == null ? '' : s);

  /* ---------- カラオケの しくみ ---------- */

  var KARA_SPEEDS = [
    { v: 0.8, label: 'ゆっくり', rate: 0.75 },
    { v: 1.0, label: 'ふつう', rate: 0.92 },

  ];
  var KARA_TOTAL = 9;
  var kara = { dan: 1, speed: 1.0, hide: false, playing: false, i: -1, timer: null, token: 0 };

  function karaSpeedItem(v) {
    for (var i = 0; i < KARA_SPEEDS.length; i++) {
      if (Math.abs(KARA_SPEEDS[i].v - v) < 0.001) { return KARA_SPEEDS[i]; }
    }

  }

  function karaRate() { return karaSpeedItem(kara.speed).rate; }

  function karaQ(i) { return BY_KEY['k' + kara.dan + ',' + (i + 1)]; }

  function karaStepMs(text, speed) {
    var n = String(text).replace(/[\s\u3000]+/g, '').length;
    var base = 720 + n * 145;
    return Math.max(520, Math.round(base / speed));
  }

  function karaPrefLoad() {
    try {
      var sp = parseFloat(window.localStorage.getItem('sansu-v3:kara-speed'));
      if (sp && karaSpeedItem(sp)) { kara.speed = karaSpeedItem(sp).v; }
      kara.hide = window.localStorage.getItem('sansu-v3:kara-hide') === '1';
    } catch (e) {}
  }

  /* こえ（Web Speech）。ない ブラウザでも しきは すすむ */
  var jaVoice = null;
  var voiceTried = false;

  function pickJaVoice() {
    try {
      if (!window.speechSynthesis) { return null; }
      var vs = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) {
        if (/ja[-_]?JP/i.test(vs[i].lang)) { return vs[i]; }
      }
    } catch (e) {}
    return null;
  }

  function speakYomi(text, rate) {
    if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== 'function') { return null; }
    try {
      if (!jaVoice && !voiceTried) { jaVoice = pickJaVoice(); voiceTried = true; }
      var u = new window.SpeechSynthesisUtterance(String(text));
      u.lang = 'ja-JP';
      u.rate = rate;
      u.pitch = 1.15;
      u.volume = 1;
      if (jaVoice) { u.voice = jaVoice; }
      window.speechSynthesis.speak(u);
      return u;
    } catch (e) { return null; }
  }

  function karaSilence() {
    try { if (window.speechSynthesis) { window.speechSynthesis.cancel(); } } catch (e) {}
  }

  function playBeat(i) {
    var hi = (i % 2 === 0);
    tone(hi ? 1046 : 784, 0, 0.09, { vol: 0.11, type: 'triangle' });
    tone(hi ? 2093 : 1568, 0.004, 0.05, { vol: 0.035, type: 'sine' });
    tone(hi ? 523 : 392, 0, 0.11, { vol: 0.05, type: 'sine' });
  }

  function paintKaraPlay() {
    var b = $('karaPlay');
    if (!b) { return; }
    b.textContent = kara.playing ? '■ とめる' : '▶ うたう';
    b.className = 'btn ' + (kara.playing ? 'btn-mint' : 'btn-primary');
  }

  function karaShow(i) {
    var stage = $('karaStage'), eq = $('karaEq'), sub = $('karaSub'), pr = $('karaProg');
    var cards = $('karaCards');
    if (cards) {
      var ns = cards.children;
      for (var c = 0; c < ns.length; c++) {
        ns[c].classList.toggle('now', c === i);
        ns[c].classList.toggle('sung', i >= 0 && c < i);
      }
    }
    if (!stage) { return; }
    if (i < 0) {
      stage.classList.add('pre');
      stage.classList.remove('on');
      if (eq) { eq.textContent = kara.dan + 'の だん'; }
      if (sub) { sub.textContent = 'うたって おぼえよう'; }
      if (pr) { pr.textContent = 'ぜんぶで 9しき'; }
      return;
    }
    var q = karaQ(i);
    if (!q) { return; }
    var y = yomiOf(q);
    var p = splitYomi(y);
    stage.classList.remove('pre');
    if (eq) { eq.textContent = q.a + '×' + q.b + '＝' + (kara.hide ? '?' : q.ans); }
    if (sub) { sub.textContent = kara.hide ? (p.front + ' ？') : y; }
    if (pr) { pr.textContent = (i + 1) + ' / ' + KARA_TOTAL; }
  }

          var btn = el('button', 'danchip' + (kara.dan === dd ? ' on' : '') + (ds.clear === 9 ? ' done' : ''));

          btn.appendChild(el('span', 'dc-num', String(dd)));

          fill.style.width = (ds.clear / 9 * 100) + '%';

          bar.appendChild(fill);
          btn.appendChild(bar);

            karaStop();
            kara.dan = dd;
            playTap();
            renderKaraoke();

    var ch = $('karaCards');
    if (ch) {
      ch.innerHTML = '';

        ? kara.dan + 'の だん・こたえを かくして 9しき うたうよ'

  function setKaraSpeed(v) {
    var it = karaSpeedItem(v);
    if (!it) { return; }
    var was = kara.playing;
    if (was) { karaStop(); }
    kara.speed = it.v;
    try { window.localStorage.setItem('sansu-v3:kara-speed', String(it.v)); } catch (e) {}
    renderKaraoke();

  function toggleKaraHide() {

    kara.hide = !kara.hide;
    try { window.localStorage.setItem('sansu-v3:kara-hide', kara.hide ? '1' : '0'); } catch (e) {}
    if (was) { karaStop(); }

  function karaStop() {
    kara.playing = false;
    kara.token += 1;
    if (kara.timer) { clearTimeout(kara.timer); kara.timer = null; }
    karaSilence();
    kara.i = -1;
    var stage = $('karaStage');
    if (stage) { stage.classList.remove('on'); }
    if ($('karaStage')) { karaShow(-1); }
    paintKaraPlay();

  function karaStart() {
    if (kara.playing) { karaStop(); return; }
    if (!$('karaCards') || !$('karaCards').children.length) { renderKaraoke(); }
    ensureAudio();
    kara.token += 1;
    kara.playing = true;
    kara.i = 0;
    var stage = $('karaStage');
    if (stage) { stage.classList.add('on'); }
    paintKaraPlay();
    karaStep();
  }

  function karaStep() {
    if (!kara.playing) { return; }
    var tok = kara.token;
    var q = karaQ(kara.i);
    if (!q) { karaFinish(); return; }
    var y = yomiOf(q);
    var parts = splitYomi(y);
    var spoken = kara.hide ? parts.front : y;
    karaShow(kara.i);
    playBeat(kara.i);
    var ms = karaStepMs(spoken, kara.speed) + (kara.hide ? 900 : 0);
    var t0 = Date.now();
    var u = speakYomi(spoken, karaRate());
    var moved = false;

    function advance() {
      if (moved) { return; }
      moved = true;
      if (!kara.playing || kara.token !== tok) { return; }
      karaSilence();
      kara.i += 1;
      if (kara.i >= KARA_TOTAL) { karaFinish(); return; }
      karaStep();
    }

    kara.timer = setTimeout(advance, ms + 1200);
    if (u) {
      u.onend = function () {
        if (moved) { return; }
        var left = ms - (Date.now() - t0);
        if (kara.timer) { clearTimeout(kara.timer); }
        kara.timer = setTimeout(advance, Math.max(180, left + 160));
      };
    }
  }

  function karaFinish() {
    kara.playing = false;
    kara.token += 1;
    if (kara.timer) { clearTimeout(kara.timer); kara.timer = null; }
    karaSilence();
    kara.i = -1;
    var cards = $('karaCards');
    if (cards) {
      for (var c = 0; c < cards.children.length; c++) {
        cards.children[c].classList.remove('now');
        cards.children[c].classList.add('sung');
      }
    }
    var stage = $('karaStage');
    if (stage) {
      stage.classList.remove('on');
      stage.classList.add('pre');
    }
    if ($('karaEq')) { $('karaEq').textContent = kara.dan + 'の だん'; }
    if ($('karaSub')) { $('karaSub').textContent = 'ぜんぶ うたえたね！'; }
    if ($('karaProg')) { $('karaProg').textContent = '9 / 9'; }
    if ($('karaNote')) { $('karaNote').textContent = '🎉 ' + kara.dan + 'の だん ぜんぶ うたえたよ。もう いちど も できるよ'; }
    paintKaraPlay();
    playFanfare();
    celebrate();
    stamp('ok', 'ぜんぶ うたえた！', kara.dan + 'の だん 9しき うたったよ', 1800);
  }

  /* =========================================================
     v3: たしざん 10の まとまり（10フレーム）
     ========================================================= */

  function tenFrame(q) {
    var a = q.a, b = q.b, ans = a + b;
    var wrap = el('div', 'tf-wrap');
    var f1 = el('div', 'tf');
    for (var i = 0; i < 10; i++) {
      var c = el('span', 'tf-c');
      if (i < a) { c.classList.add('blue'); }
      else if (i < ans) { c.classList.add('red'); }
      f1.appendChild(c);
    }
    wrap.appendChild(f1);
    if (ans > 10) {
      wrap.appendChild(el('span', 'tf-plus', 'と'));
      var f2 = el('div', 'tf tf-2');
      for (var j = 0; j < 10; j++) {
        var d = el('span', 'tf-c');
        if (j < ans - 10) { d.classList.add('red'); }
        f2.appendChild(d);
      }
      wrap.appendChild(f2);
    }
    return wrap;
  }

  function tfCaption(q) {
    var ans = q.a + q.b;
    if (ans > 10) { return '10 と ' + (ans - 10) + ' で ' + ans + '！'; }
    if (ans === 10) { return 'ぴったり 10！'; }
    return 'あわせて ' + ans;
  }

  /* =========================================================
     audio (Web Audio API)
     ========================================================= */

  var actx = null;

  function ensureAudio() {
    if (actx) {
      if (actx.state === 'suspended' && actx.resume) {
        try { actx.resume(); } catch (e) {}
      }
      return actx;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { actx = new AC(); }
    } catch (e) { actx = null; }
    return actx;
  }

  function tone(freq, delay, dur, opts) {
    if (muted) { return; }
    var ctx = ensureAudio();
    if (!ctx) { return; }
    opts = opts || {};
    try {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var t0 = ctx.currentTime + delay;
      var vol = (opts.vol === undefined) ? 0.16 : opts.vol;
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (opts.to) { osc.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur); }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  /* =========================================================
     confetti (canvas)
     ========================================================= */

  var fx = $('fx');
  var fxctx = null;
  var parts = [];
  var rafId = null;
  var COLORS = ['#EFA9B8', '#9BD3C0', '#E9C46A', '#F7C9D3', '#BFE3D6', '#F6D79B', '#B9AEDC', '#FFFFFF'];

  try { if (fx && fx.getContext) { fxctx = fx.getContext('2d'); } } catch (e) { fxctx = null; }

  function sizeFx() {
    if (!fx) { return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth || 375;
    var h = window.innerHeight || 700;
    fx.width = Math.floor(w * dpr);
    fx.height = Math.floor(h * dpr);
    if (fxctx && fxctx.setTransform) { fxctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  }

  function burst(x, y, count, spread) {
    if (!fxctx) { return; }
    sizeFx();
    var n = count || 40;
    var s = spread || 1;
    for (var i = 0; i < n; i++) {
      var ang = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.5;
      var sp = (2.0 + Math.random() * 4.4) * s;
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        g: 0.055 + Math.random() * 0.05,
        size: 5 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.35,
        color: oneOf(COLORS),
        shape: Math.random() < 0.34 ? 'circle' : 'rect',
        life: 1
      });
    }
    if (!rafId) { rafId = window.requestAnimationFrame(tick); }
  }

  function tick() {
    rafId = null;
    if (!fxctx) { parts = []; return; }
    fxctx.clearRect(0, 0, window.innerWidth || 375, window.innerHeight || 700);
    var alive = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.007;
      if (p.life <= 0 || p.y > (window.innerHeight || 700) + 40) { continue; }
      fxctx.save();
      fxctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxctx.translate(p.x, p.y);
      fxctx.rotate(p.rot);
      fxctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        fxctx.beginPath();
        fxctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        fxctx.fill();
      } else {
        fxctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.55);
      }
      fxctx.restore();
      alive.push(p);
    }
    parts = alive;
    if (parts.length) { rafId = window.requestAnimationFrame(tick); }
  }

  /* =========================================================
     picking questions: nigate > hole > review
     ========================================================= */

  function scopeList(scope) {
    var i, list = [];
    if (scope === 'tashiAll' || scope === 'tashi') { return TASHI_QS; }
    if (scope === 'g10' || scope === 'g11') {
      for (i = 0; i < TASHI_QS.length; i++) {
        if (TASHI_QS[i].grp === scope) { list.push(TASHI_QS[i]); }
      }
      return list;
    }
    if (typeof scope === 'number') {
      for (var b = 1; b <= 9; b++) { list.push(BY_KEY['k' + scope + ',' + b]); }
      return list;
    }
    return KUKU_QS;
  }

  function currentScope() {
    if (view.mode === 'tashi') { return view.tashiAll ? 'tashiAll' : view.grp; }
    return view.mix ? 'mix' : view.dan;
  }

  function pickEntries(scope, n) {
    var list = scopeList(scope);
    var t1 = [], t2 = [], t3 = [];
    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      var s = store.q[q.key];
      if (s && s.n) { t1.push(q); }
      else if (!s || !s.c) { t2.push(q); }
      else { t3.push(q); }
    }
    function order(arr) {
      var fresh = [], old = [];
      for (var i = 0; i < arr.length; i++) {
        if (recent.indexOf(arr[i].key) >= 0) { old.push(arr[i]); } else { fresh.push(arr[i]); }
      }
      return shuffle(fresh).concat(shuffle(old));
    }
    var want3 = n || 3;
    var priority = t1.length + t2.length;
    var queue, want;
    if (priority > 0) {
      queue = order(t1).concat(order(t2));
      want = Math.min(want3, queue.length);
    } else {
      queue = order(t3);
      want = Math.min(want3, queue.length);
    }
    var out = queue.slice(0, want);
    for (var j = 0; j < out.length; j++) {
      recent.push(out[j].key);
      if (recent.length > 9) { recent.shift(); }
    }
    return out;
  }

  /* =========================================================
     answering
     ========================================================= */

  function checkComplete(q) {
    var out = [];
    if (q.kind === 'kuku') {
      if (danStats(q.a).clear === 9 && !store.done['d' + q.a]) {
        store.done['d' + q.a] = 1;
        out.push({ key: 'd' + q.a, label: q.a + 'の だん' });
      }
    } else {
      if (groupStats(q.grp).clear === GROUPS[q.grp].total && !store.done[q.grp]) {
        store.done[q.grp] = 1;
        out.push({ key: q.grp, label: GROUPS[q.grp].label + ' の ボード' });
      }
    }
    if (totalClear() === 162 && !store.done.all) {
      store.done.all = 1;
      out.push({ key: 'all', label: 'ぜんぶの ボード' });
    }
    return out;
  }

  function applyAnswer(q, oneShot) {
    var s = st(q.key);
    var wasC = !!s.c, wasN = !!s.n;
    var kind;
    if (oneShot) {
      if (wasN) { kind = 'healed'; }
      else if (wasC) { kind = 'review'; }
      else { kind = 'perfect'; }
    } else {
      kind = 'retry';
    }
    s.c = 1;
    if (oneShot) {
      if (!wasN && !wasC) { s.p = 1; }
      s.n = 0;
    } else { s.n = 1; }
    saveStore();
    var isNew = !wasC;
    var completed = isNew ? checkComplete(q) : [];
    if (completed.length) { saveStore(); }
    return { kind: kind, isNew: isNew, completed: completed };
  }

  /* =========================================================
     quiz round
     ========================================================= */

  var session = null;
  var roundToken = 0;

  function startRound(entries, scope, keepView) {
    if (!entries || !entries.length) { return; }
    hideStamp();
    clearDoneTimers();
    var list = [];
    for (var i = 0; i < entries.length; i++) {
      list.push({ entry: entries[i], wrong: 0, result: null, clearedNow: false });
    }
    session = {
      list: list, i: 0, combo: 0, best: 0, locked: false,
      token: ++roundToken, completed: [], scope: scope || null, keepView: !!keepView
    };
    store.rounds = (store.rounds || 0) + 1;
    saveStore();
    buildQuizDots();
    showScreen('screen-quiz');
    renderQuestion();
  }

  function buildQuizDots() {
    var box = $('qDots');
    box.innerHTML = '';
    for (var i = 0; i < session.list.length; i++) {
      var d = el('span', 'dot' + (i === 0 ? ' now' : ''));
      box.appendChild(d);
    }
  }

  function updateDots() {
    var dots = $('qDots').children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = 'dot' + (i < session.i ? ' on' : (i === session.i ? ' now' : ''));
    }
  }

  function updateCombo() {
    var badge = $('comboBadge');
    if (!badge) { return; }
    if (session && session.combo >= 2) {
      badge.textContent = '🔥' + session.combo + 'れんぞく！';
      badge.classList.add('show');
    } else {
      badge.textContent = '';
      badge.classList.remove('show');
    }
  }

  function dotGrid(n, tone) {
    var g = el('span', 'dot-grid' + (tone === 'pink' ? ' pink' : ''));
    var cols = Math.min(n, 5);
    g.style.gridTemplateColumns = 'repeat(' + cols + ', var(--dot))';
    for (var i = 0; i < n; i++) { g.appendChild(el('span', 'd')); }
    return g;
  }

  function dotsTashi(q) {
    var wrap = el('div', 'dots-wrap');
    wrap.appendChild(dotGrid(q.a, 'mint'));
    wrap.appendChild(el('span', 'dots-op', '＋'));
    wrap.appendChild(dotGrid(q.b, 'pink'));
    return wrap;
  }

  function dotsKuku(q) {
    var wrap = el('div', 'array-wrap');
    for (var r = 0; r < q.b; r++) {
      var row = el('div', 'array-row' + (r % 2 ? ' alt' : ''));
      for (var c = 0; c < q.a; c++) { row.appendChild(el('span', 'd')); }
      wrap.appendChild(row);
    }
    return wrap;
  }

  function captionOf(q) {
    if (q.kind === 'kuku') { return q.a + 'こ の まとまりが ' + q.b + 'つ'; }
    return 'あわせて いくつ？';
  }

  function makeChoices(q) {
    var cands, i, v, pool = [];
    if (q.kind === 'kuku') {
      cands = [q.ans + q.a, q.ans - q.a, q.ans + q.b, q.ans - q.b,
               q.ans + 1, q.ans - 1, q.ans + 10, q.ans - 10, q.ans + 2, q.ans - 2];
    } else {
      cands = [q.ans - 3, q.ans - 2, q.ans - 1, q.ans + 1, q.ans + 2, q.ans + 3,
               q.a, q.b, q.ans + 10, q.ans - 10];
    }
    for (i = 0; i < cands.length; i++) {
      v = cands[i];
      if (v > 0 && v !== q.ans && pool.indexOf(v) < 0) { pool.push(v); }
    }
    shuffle(pool);
    var out = [q.ans];
    for (i = 0; i < pool.length && out.length < 4; i++) { out.push(pool[i]); }
    var n = 1;
    while (out.length < 4) {
      if (out.indexOf(q.ans + n) < 0) { out.push(q.ans + n); }
      n++;
    }
    return shuffle(out);
  }

  function buildEq(q) {
    var eq = el('div', 'q-eq');
    eq.appendChild(el('span', 'n', String(q.a)));
    eq.appendChild(el('span', 'op', q.kind === 'kuku' ? '×' : '＋'));
    eq.appendChild(el('span', 'n', String(q.b)));
    eq.appendChild(el('span', 'op', '＝'));
    eq.appendChild(el('span', 'pq', '?'));
    return eq;
  }

  function renderQuestion() {
    var it = session.list[session.i];
    if (!it) { return; }
    var q = it.entry;
    session.locked = false;

    var kindNode = $('qKind');
    if (q.kind === 'kuku') {
      kindNode.textContent = 'くく ' + q.a + 'の だん';
      kindNode.className = 'q-kind k-kuku';
    } else {
      kindNode.textContent = q.grp === 'g11' ? 'たしざん くりあがり' : 'たしざん 10まで';
      kindNode.className = 'q-kind' + (q.grp === 'g11' ? ' k-hard' : '');
    }

    var body = $('qBody');
    body.innerHTML = '';
    body.appendChild(buildEq(q));

    var hint = el('div', 'q-hint' + (hintOn ? '' : ' off'));
    if (q.kind === 'kuku') {
      hint.appendChild(dotsKuku(q));
      hint.appendChild(el('span', 'q-caption', captionOf(q)));
    } else {
      hint.appendChild(tenFrame(q));
      hint.appendChild(el('span', 'q-caption' + (q.a + q.b > 10 ? ' tf-cap' : ''), tfCaption(q)));
    }
    body.appendChild(hint);

    var choicesEl = $('choices');
    choicesEl.innerHTML = '';
    var opts = makeChoices(q);
    for (var m = 0; m < opts.length; m++) {
      (function (value) {
        var btn = el('button', 'choice', String(value));
        btn.type = 'button';
        btn.addEventListener('click', function () { choose(btn, value, it); });
        choicesEl.appendChild(btn);
      })(opts[m]);
    }

    $('btnHint').textContent = hintOn ? '● ヒント けす' : '● ヒント みる';
    $('btnHint').classList.toggle('on', hintOn);
    updateDots();
    updateCombo();
  }

  function choose(btn, value, it) {
    if (!session || session.locked) { return; }
    if (btn.classList.contains('done')) { return; }
    var q = it.entry;

    if (value === q.ans) {
      session.locked = true;
      btn.classList.add('correct', 'done');
      session.combo += 1;
      if (session.combo > session.best) { session.best = session.combo; }
      updateCombo();

      var res = applyAnswer(q, it.wrong === 0);
      it.result = res.kind;
      it.clearedNow = res.isNew;
      for (var c = 0; c < res.completed.length; c++) { session.completed.push(res.completed[c]); }

      playCorrect();
      if (res.kind === 'healed') { playHeal(); }
      celebrate();
      var op = q.kind === 'kuku' ? '×' : '＋';
      var big, small;
      if (res.kind === 'healed') {
        big = 'にがて きえた！';
        small = '🌱 → ✨ ' + q.a + ' ' + op + ' ' + q.b + ' ＝ ' + q.ans;
      } else if (res.kind === 'review') {
        big = 'ふくしゅう OK！';
        small = 'もう できてるよ ' + q.a + ' ' + op + ' ' + q.b + ' ＝ ' + q.ans;
      } else {
        big = 'クリア！';
        small = q.a + ' ' + op + ' ' + q.b + ' ＝ ' + q.ans + ' クリア！';
      }
      stamp('ok', big, small, 1550);

      var tok = session.token;
      setTimeout(function () {
        if (session && session.token === tok) { nextQuestion(); }
      }, 1650);
    } else {
      it.wrong += 1;
      btn.classList.add('wrong', 'done');
      btn.disabled = true;
      st(q.key).n = 1;
      saveStore();
      session.combo = 0;
      updateCombo();
      playWrong();
      shake($('qCard'));
      stamp('no', 'おしい！', '🌱 もう いっかい やってみよう', 1000);
    }
  }

  function nextQuestion() {
    if (!session) { return; }
    hideStamp();
    session.i += 1;
    if (session.i >= session.list.length) { showDone(); return; }
    renderQuestion();
  }

  /* =========================================================
     done screen
     ========================================================= */

  var doneTimers = [];

  function clearDoneTimers() {
    for (var i = 0; i < doneTimers.length; i++) { clearTimeout(doneTimers[i]); }
    doneTimers = [];
  }

  function tagText(kind) {
    if (kind === 'perfect') { return '👑 いちどで せいかい！'; }
    if (kind === 'healed') { return '✨ にがて きえた！'; }
    if (kind === 'review') { return '★ ふくしゅう OK'; }
    return '★ できた！';
  }

  function cellTone(q, kind) {
    if (kind === 'perfect') { return 'gold'; }
    if (q.kind === 'kuku') { return 'lav'; }
    return q.grp === 'g11' ? 'rose' : '';
  }

  function showDone() {
    if (!session) { return; }
    hideStamp();
    clearDoneTimers();

    var items = session.list;
    var newCount = 0, i;
    var box = $('doneCells');
    box.innerHTML = '';
    var cells = [];

    for (i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.clearedNow) { newCount++; }
      var c = el('div', 'dcell');
      c.appendChild(el('span', 'dq', '?'));
      c.appendChild(el('span', 'dn', String(it.entry.ans)));
      c.appendChild(el('span', 'dbi', it.result === 'healed' ? '✨' : (it.result === 'perfect' ? '👑' : '★')));
      c.setAttribute('data-tone', cellTone(it.entry, it.result));
      box.appendChild(c);
      cells.push(c);
    }

    $('doneTitle').textContent = items.length + 'もん クリア！';
    $('doneSub').textContent = newCount
      ? ('ボードに ' + newCount + 'つ うまったよ')
      : 'ふくしゅう できたね！';

    var list = $('doneList');
    list.innerHTML = '';
    for (i = 0; i < items.length; i++) {
      var it2 = items[i], q2 = it2.entry;
      var row = el('div', 'drow');
      row.appendChild(el('span', 'eq', q2.a + ' ' + (q2.kind === 'kuku' ? '×' : '＋') + ' ' + q2.b + ' ＝ ' + q2.ans));
      row.appendChild(el('span', 'tag', tagText(it2.result)));
      list.appendChild(row);
    }

    var crown = $('crownBanner');
    crown.className = 'crown';
    crown.innerHTML = '';
    var dcBox = $('doneCheer');
    if (dcBox) { dcBox.innerHTML = ''; }
    if (session.completed.length) {
      var labels = [], medalRow = el('div', 'done-medals');
      for (i = 0; i < session.completed.length; i++) {
        labels.push(session.completed[i].label);
        medalRow.appendChild(el('span', 'dmedal', STAMPS[session.completed[i].key] || '🏅'));
      }
      crown.appendChild(medalRow);
      crown.appendChild(el('span', 'crown-t', '👑 ' + labels.join(' と ') + ' コンプリート！'));
    }
    if (dcBox) {
      dcBox.appendChild(buildCheer(
        session.completed.length ? 'そのちょうし！ ごほうび スタンプ げっと！' : 'いい ちょうしだね！ つぎも いけるよ',
        'cheer-done'
      ));
    }

    var mt = modeStats('tashi'), mk = modeStats('kuku');
    $('doneProg').textContent = 'ぜんぶ ' + (mt.clear + mk.clear) + ' / 162 クリア ・ 🌱 にがて ' + (mt.nigate + mk.nigate);

    var last = items[items.length - 1].entry;
    if (!session.keepView) {
      if (session.scope === 'mix') { view.mode = 'kuku'; view.mix = true; }
      else if (typeof session.scope === 'number') { view.mode = 'kuku'; view.mix = false; view.dan = session.scope; }
      else if (session.scope === 'g10' || session.scope === 'g11') {
        view.mode = 'tashi'; view.tashiAll = false; view.grp = session.scope;
      } else { view.mode = 'tashi'; view.tashiAll = true; view.grp = last.grp; }
    }

    showScreen('screen-done');
    window.scrollTo && window.scrollTo(0, 0);

    var tok = session.token;
    doneTimers.push(setTimeout(function () {
      if (!session || session.token !== tok) { return; }
      for (var j = 0; j < cells.length; j++) {
        (function (node, idx) {
          doneTimers.push(setTimeout(function () {
            if (!session || session.token !== tok) { return; }
            node.classList.add('on');
            var tone = node.getAttribute('data-tone');
            if (tone) { node.classList.add(tone); }
            playFill(idx);
            var r = node.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, 16, 0.75);
          }, idx * 400));
        })(cells[j], j);
      }
      var endDelay = cells.length * 400 + 240;
      doneTimers.push(setTimeout(function () {
        if (!session || session.token !== tok) { return; }
        if (session.completed.length) {
          crown.classList.add('on');
          playFanfare();
          celebrate();
        }
      }, endDelay));
    }, 240));
  }

  /* =========================================================
     navigation
     ========================================================= */

  function onCellTap(q) {
    playTap();
    clearDoneTimers();
    startRound([q], null, true);
  }

  function goHome(popKeys) {
    clearDoneTimers();
    hideStamp();
    session = null;
    showScreen('screen-home');
    renderHome();
    if (popKeys && popKeys.length) { popCells(popKeys); }
  }

  function quitRound() {
    clearDoneTimers();
    hideStamp();
    session = null;
    showScreen('screen-home');
    renderHome();
  }

  function toggleMute() {
    muted = !muted;
    savePref();
    var btn = $('btnMute');
    btn.textContent = muted ? '🔇' : '🔊';
    if (muted) { btn.classList.add('off'); }
    else { btn.classList.remove('off'); playTap(); }
  }

  function askReset() { $('confirmOverlay').classList.add('open'); }

  function doReset() {
    store = blankStore();
    saveStore();
    recent = [];
    session = null;
    view.mode = 'tashi';
    view.grp = 'g10';
    view.dan = 1;
    view.mix = true;
    view.tashiAll = true;
    $('confirmOverlay').classList.remove('open');
    showScreen('screen-home');
    renderHome();
    playTap();
  }

  /* =========================================================
     init
     ========================================================= */

  function bind(id, fn) {
    var node = $(id);
    if (node && node.addEventListener) { node.addEventListener('click', fn); }
  }

  function init() {
    loadPlayers();
    adoptLegacy();
    loadStore();
    muted = loadPref();
    karaPrefLoad();

    bind('plChip', openPl);
    bind('plClose', closePl);
    bind('plAdd', addPlayer);
    var plIn = $('plName');
    if (plIn && plIn.addEventListener) {
      plIn.addEventListener('keydown', function (ev) { if (ev && ev.key === 'Enter') { addPlayer(); } });
    }
    var plOv = $('plOverlay');
    if (plOv && plOv.addEventListener) {
      plOv.addEventListener('click', function (ev) { if (ev.target === plOv) { closePl(); } });
    }
    paintChip();

    var muteBtn = $('btnMute');
    if (muteBtn) {
      muteBtn.textContent = muted ? '🔇' : '🔊';
      if (muted) { muteBtn.classList.add('off'); }
    }

    bind('tabTashi', function () {
      if (view.mode === 'tashi') { return; }
      view.mode = 'tashi';
      playTap();
      renderHome();
    });
    bind('tabKuku', function () {
      if (view.mode === 'kuku') { return; }
      view.mode = 'kuku';
      playTap();
      renderHome();
    });

    bind('btnStart', function () {
      playTap();
      var sc = currentScope();
      startRound(pickEntries(sc, 3), sc, false);
    });

    bind('btnHint', function () {
      hintOn = !hintOn;
      var h = document.querySelector('#qBody .q-hint');
      $('btnHint').textContent = hintOn ? '● ヒント けす' : '● ヒント みる';
      $('btnHint').classList.toggle('on', hintOn);
      if (h) { h.classList.toggle('off', !hintOn); }
      playTap();
    });

    bind('btnQuit', quitRound);

    bind('btnToBoard', function () {
      playTap();
      var keys = [];
      if (session) {
        for (var i = 0; i < session.list.length; i++) {
          if (session.list[i].clearedNow) { keys.push(session.list[i].entry.key); }
        }
      }
      goHome(keys);
    });

    bind('btnAgain', function () {
      playTap();
      var sc = currentScope();
      startRound(pickEntries(sc, 3), sc, false);
    });

    bind('karaBack', function () {
      karaStop();
      playTap();
      showScreen('screen-home');
      renderHome();
    });
    bind('karaPlay', karaStart);
    bind('karaHide', toggleKaraHide);

    if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        jaVoice = pickJaVoice();
      });
    }

    bind('btnReset', askReset);
    bind('btnCancelReset', function () {
      $('confirmOverlay').classList.remove('open');
      playTap();
    });
    bind('btnDoReset', doReset);
    bind('btnMute', toggleMute);

    var unlock = function () { ensureAudio(); };
    if (document.addEventListener) {
      document.addEventListener('pointerdown', unlock);
      document.addEventListener('touchstart', unlock);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { if (fxctx) { sizeFx(); } });
    }

    renderHome();
    showScreen('screen-home');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* test hooks */
  window.__boardApp = {
    tashi: TASHI_QS,
    kuku: KUKU_QS,
    groups: GROUPS,
    storeOf: function () { return store; },
    viewOf: function () { return view; },
    setView: function (mode, sub) {
      view.mode = mode;
      if (mode === 'tashi') {
        if (sub === 'all') { view.tashiAll = true; }
        else if (sub) { view.tashiAll = false; view.grp = sub; }
      }
      if (mode === 'kuku') {
        if (sub === 'mix') { view.mix = true; }
        else if (sub) { view.mix = false; view.dan = sub; }
      }
      renderHome();
    },
    scope: currentScope,
    stats: modeStats,
    groupStats: groupStats,
    danStats: danStats,
    totalClear: totalClear,
    totalNigate: totalNigate,
    stateOf: entryState,
    pick: function (scope, n) { return pickEntries(scope === undefined ? currentScope() : scope, n); },
    answer: function (key, oneShot) { return applyAnswer(BY_KEY[key], oneShot !== false); },
    choices: makeChoices,
    qOf: function (key) { return BY_KEY[key]; },
    sessionOf: function () { return session; },
    current: function () { return (session && session.list[session.i]) ? session.list[session.i].entry : null; },
    render: renderHome,
    hintOn: function () { return hintOn; },
    muted: function () { return muted; },
    playersOf: function () { return PLAYERS.slice(); },
    currentPlayer: function () { return CUR; },
    storeKeyOf: storeKeyOf,
    usePlayer: usePlayer,
    addPlayer: addPlayer,
    openPl: openPl,
    /* ---- v3 ---- */
    yomi: function () { return YOMI; },
    yomiOf: function (key) { return yomiOf(BY_KEY[key]); },
    stamps: function () { return STAMPS; },
    openKaraoke: openKaraoke,
    karaoke: {
      open: openKaraoke,
      start: karaStart,
      stop: function () { karaStop(); },
      back: function () { karaStop(); showScreen('screen-home'); renderHome(); },
      state: function () {
        return { dan: kara.dan, i: kara.i, playing: kara.playing, speed: kara.speed, hide: kara.hide };
      },
      setSpeed: setKaraSpeed,
      toggleHide: toggleKaraHide,
      stepMs: karaStepMs,
      nowCard: function () {
        var n = document.querySelector('#karaCards .kcard.now');
        return n ? n.getAttribute('data-i') : null;
      },
      sub: function () { var n = $('karaSub'); return n ? n.textContent : ''; },
      eq: function () { var n = $('karaEq'); return n ? n.textContent : ''; },
      cards: function () {
        var out = [], n = $('karaCards');
        if (!n) { return out; }
        for (var c = 0; c < n.children.length; c++) {
          out.push({ eq: n.children[c].children[0].textContent, now: n.children[c].classList.contains('now'), sung: n.children[c].classList.contains('sung') });
        }
        return out;
      }
    }
  };
})();
</script>
</body>
</html>
