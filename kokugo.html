<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFAF4">
<meta name="description" content="6さいからの ことばクイズ 999もん。3もん クリアで カードが もらえるよ。">
<title>ことばミッション999｜きょうの ことばガチャ</title>
<style>
  :root{
    --ivory:#FDFAF4;
    --ink:#544B46;
    --ink2:#7A6E67;
    --ink3:#8A7C72;
    --rose-1:#D97C8E;
    --rose-2:#C4637A;
    --rose-3:#A9505F;
    --rose-ink:#B4637A;
    --mint-ink:#3E8571;
    --pink:#EFA9B8;
    --pink-d:#D98A9B;
    --pink-l:#FBE7EB;
    --mint:#9BD3C0;
    --mint-d:#7CBCA6;
    --mint-l:#E6F5EF;
    --mustard:#E9C46A;
    --mustard-d:#C99C3C;
    --mustard-l:#FCF1D6;
    --lav:#C9C6E8;
    --lav-l:#EEEDF9;
    --line:#F0E7D9;
    --shadow:0 10px 26px rgba(120,101,90,.09);
    --shadow-lg:0 18px 44px rgba(120,101,90,.16);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ivory)}
  body{
    margin:0;
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    background:var(--ivory);
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 8% 2%,rgba(239,169,184,.22),transparent 42%),
      radial-gradient(circle at 94% 76%,rgba(155,211,192,.26),transparent 46%),
      radial-gradient(circle at 76% 5%,rgba(233,196,106,.16),transparent 36%);
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:1;
    max-width:430px;margin:0 auto;
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);
  }
  .screen{display:none;flex-direction:column;flex:1;min-height:0;gap:12px}
  #screen-start,#screen-quiz,#screen-clear{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .screen.active{display:flex;animation:screenIn .34s ease both}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;border:0;border-radius:28px;
    font-family:inherit;font-size:21px;font-weight:700;letter-spacing:.04em;
    padding:18px 18px;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
    user-select:none;
  }
  .btn-primary{
    background:linear-gradient(180deg,var(--rose-1) 0%,var(--rose-2) 100%);color:#fff;
    box-shadow:0 6px 0 var(--rose-3),0 14px 26px rgba(169,80,95,.26);
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rose-3),0 6px 12px rgba(169,80,95,.2)}
  .btn-mint{
    background:linear-gradient(180deg,#BFE6D8 0%,#9BD3C0 100%);color:#335C50;
    box-shadow:0 6px 0 var(--mint-d),0 14px 26px rgba(124,188,166,.26);
  }
  .btn-mint:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-d),0 6px 12px rgba(124,188,166,.2)}
  .btn-ghost{
    background:#fff;color:var(--ink);border:2px solid var(--line);
    box-shadow:0 5px 0 var(--line);
  }
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .btn-small{font-size:16.5px;padding:14px 16px;border-radius:22px}
  .chip{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:64px;padding:4px 12px;border-radius:999px;
    background:var(--mustard-l);color:#8C6220;
    font-size:14px;font-weight:700;letter-spacing:.02em;
  }
  .icon-btn{
    width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(120,101,90,.13);
    color:var(--ink2);font-size:18px;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:scale(.94)}

  .mute{
    position:fixed;z-index:60;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    right:max(12px,calc(50vw - 215px + 12px));
    width:44px;height:44px;font-size:18px;
  }
  .mute.off{opacity:.5}

  /* ---------- start ---------- */
  .start-top{display:flex;align-items:center;justify-content:space-between;padding-right:54px}
  .kick{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:2px solid var(--line);
    padding:7px 15px;border-radius:999px;
    font-size:13.5px;font-weight:700;letter-spacing:.14em;color:var(--ink2);
  }
  .kick::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pink)}
  .start-title{
    margin:4px 0 0;font-size:37px;line-height:1.2;letter-spacing:.03em;font-weight:700;
    color:var(--ink);
  }
  .start-title em{font-style:normal;color:var(--pink-d)}
  .start-sub{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink2);font-weight:700}
  .hero-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px 0}
  .hero-art{
    position:relative;width:100%;display:flex;align-items:center;justify-content:center;
    animation:floaty 5s ease-in-out infinite;
  }
  .hero-art svg{width:100%;height:auto;max-height:240px;display:block}
  .hero-star{
    position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
    font-size:42px;filter:drop-shadow(0 4px 8px rgba(120,101,90,.18));
  }
  .start-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
  .hero-caption{margin:0;text-align:center;font-size:13.5px;font-weight:700;color:#7A6E67;letter-spacing:.1em}
  .meta-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .meta{
    display:inline-flex;align-items:center;gap:5px;
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink2);
  }
  .hard-legend{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:12.5px;font-weight:700;color:#A33A55;margin:0;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 52px 0 0}
  .dots{display:flex;gap:8px;align-items:center}
  .dot{width:11px;height:11px;border-radius:50%;background:#EBE1D2;transition:all .25s ease}
  .dot.on{background:var(--mint);box-shadow:0 0 0 4px rgba(155,211,192,.25)}
  .dot.now{background:#fff;box-shadow:0 0 0 2px var(--pink)}
  .combo{
    min-width:92px;text-align:right;font-size:14px;font-weight:700;color:#A5516A;
    opacity:0;transform:translateY(4px);transition:all .2s ease;
  }
  .combo.show{opacity:1;transform:none}
  .q-card{
    background:#fff;border-radius:32px;padding:16px 16px 18px;
    box-shadow:var(--shadow);border:2px solid #fff;
    flex:1 1 auto;width:100%;margin:0;min-height:clamp(200px,26vh,300px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
  }
  .q-card.hard{border-color:#FFD3DD;box-shadow:0 10px 26px rgba(217,124,142,.18)}
  .hard-row{display:none;width:100%;justify-content:center}
  .hard-row.on{display:flex}
  .hard-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#FFE3E9,#FFC6D3);
    color:#A33350;font-size:14px;font-weight:800;letter-spacing:.04em;
    padding:7px 16px;border-radius:999px;
    box-shadow:0 3px 0 #F0A9B9,0 6px 14px rgba(217,124,142,.22);
    animation:hardPulse 1.8s ease-in-out infinite;
  }
  @keyframes hardPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #qBody{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;width:100%;text-align:center;
  }
  .q-kind{
    font-size:12px;font-weight:700;letter-spacing:.16em;color:#3E7A67;
    background:var(--mint-l);padding:5px 14px;border-radius:999px;
  }
  .q-kind.t-hantai,.q-kind.t-kotowaza,.q-kind.t-kanyouku{color:#84601C;background:var(--mustard-l)}
  .q-kind.t-nazo{color:#9E5268;background:var(--pink-l)}
  .q-kind.t-nakama{color:#615A93;background:var(--lav-l)}
  .q-kind.t-kanji{color:#41577F;background:#E7EEF9}
  .q-kind.t-kazo{color:#7A5A2E;background:#F7EEDF}
  .q-kind.t-nita{color:#8A5A70;background:#F7E8F0}
  .q-emoji{font-size:52px;line-height:1}
  .q-word{display:flex;gap:5px;align-items:center;justify-content:center;font-size:36px;font-weight:700;letter-spacing:.05em}
  .q-char{display:inline-block}
  .q-hole{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:50px;height:58px;padding:0 4px;border-radius:18px;
    background:var(--mustard-l);color:#9A6D22;
    border:3px dashed var(--mustard);font-size:29px;
  }
  .q-bigword{
    font-size:32px;font-weight:700;letter-spacing:.08em;
    background:var(--pink-l);color:#B4637A;
    padding:10px 24px;border-radius:22px;
  }
  .q-bigword.kanji{font-size:64px;letter-spacing:0;padding:4px 30px;background:#E7EEF9;color:#41577F}
  .q-prompt{margin:0;font-size:18px;font-weight:700;line-height:1.65;text-align:center;color:var(--ink);white-space:pre-line;text-wrap:balance}
  .q-prompt.big{font-size:19px}
  .q-quote{
    margin:0;font-size:18px;font-weight:700;line-height:1.6;text-align:center;color:#8C6220;
    background:var(--mustard-l);border-radius:18px;padding:10px 14px;
    white-space:pre-line;text-wrap:balance;
  }
  .q-hint{margin:0;font-size:14.5px;font-weight:700;color:var(--ink2)}

  .choices{display:flex;flex-direction:column;gap:10px}
  .choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .choice{
    display:flex;align-items:center;gap:11px;
    width:100%;padding:16px 16px;
    background:#fff;border:2.5px solid var(--line);border-radius:24px;
    box-shadow:0 4px 0 var(--line);
    font-family:inherit;font-size:23px;font-weight:700;letter-spacing:.04em;color:var(--ink);
    cursor:pointer;text-align:left;
    transition:transform .1s ease,box-shadow .1s ease,background .15s ease,border-color .15s ease,opacity .2s;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .choice .c-label{flex:1}
  .choice .c-emoji{font-size:30px;line-height:1}
  .choice.long{font-size:17px;line-height:1.45;letter-spacing:.01em;padding:14px 16px;border-radius:20px}
  .choice.correct{
    background:var(--mint-l);border-color:var(--mint);box-shadow:0 4px 0 var(--mint);
    animation:bump .45s ease;
  }
  .choice.wrong{background:#FAF6F0;border-color:#EDE4D6;box-shadow:0 4px 0 #EDE4D6;opacity:.5}
  .choice.tile{
    flex-direction:column;gap:5px;justify-content:center;text-align:center;
    padding:12px 6px;font-size:14.5px;line-height:1.25;word-break:break-word;
  }
  .choice.tile .c-emoji{font-size:34px}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-6px)}78%{transform:translateX(4px)}}
  .shake{animation:shakeX .42s ease}

  /* ---------- stamp ---------- */
  .stamp{
    position:fixed;left:50%;top:38%;z-index:75;pointer-events:none;
    transform:translate(-50%,-50%) scale(.7) rotate(-6deg);opacity:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:18px 24px 20px;border-radius:32px;
    width:max-content;max-width:min(320px,84vw);
    background:#fff;border:3px solid var(--mint);
    box-shadow:0 0 0 100vmax rgba(253,250,244,.94),var(--shadow-lg);
    text-align:center;
  }
  .stamp.no{border-color:var(--pink)}
  .stamp.hard{border-color:var(--mustard-d);box-shadow:0 0 0 100vmax rgba(253,250,244,.94),0 0 0 7px rgba(233,196,106,.25),var(--shadow-lg)}
  .stamp.show{animation:stampPop .52s cubic-bezier(.2,1.5,.5,1) forwards}
  .stamp.out{animation:stampOut .3s ease forwards}
  .stamp-big{font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--mint-ink);white-space:nowrap}
  .stamp.no .stamp-big{color:#B4637A}
  .stamp.hard .stamp-big{color:#A97615;font-size:29px}
  .stamp-small{font-size:13.5px;font-weight:700;line-height:1.6;color:var(--ink2);text-wrap:balance}
  .stamp.hard .stamp-small{color:#8C6220;font-size:15px}
  @keyframes stampPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-9deg)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  }
  @keyframes stampOut{to{opacity:0;transform:translate(-50%,-50%) scale(.94) rotate(-3deg)}}

  /* ---------- clear ---------- */
  .clear-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
  .clear-emoji{font-size:60px;line-height:1;animation:bump 1.2s ease infinite}
  .clear-title{margin:0;font-size:30px;font-weight:700;letter-spacing:.06em}
  .clear-sub{margin:0;font-size:16px;font-weight:700;color:var(--ink2)}
  .clear-panel{
    background:#fff;border-radius:28px;padding:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:6px;
  }
  .clear-stat{font-size:14.5px;font-weight:700;color:var(--ink2);margin:0}
  .clear-stat b{color:#B4637A;font-size:18px}
  .clear-actions{display:flex;flex-direction:column;gap:9px;margin-top:2px}

  /* ---------- zukan ---------- */
  .zukan-top{display:flex;align-items:center;gap:10px;padding-right:52px}
  .zukan-title{flex:1;margin:0;font-size:21px;font-weight:700;letter-spacing:.06em}
  .zukan-hint{margin:0;font-size:12.5px;color:var(--ink2);font-weight:700}
  .zukan-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .zukan-filters{
    display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .zukan-filters::-webkit-scrollbar{display:none}
  .zfilter{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    border:2px solid var(--line);background:#fff;color:var(--ink2);
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .zfilter.active{background:var(--pink-l);border-color:var(--pink);color:#A5516A}
  .zfilter .zf-count{font-size:11px;color:#9C8F86;font-weight:700}
  .zfilter.active .zf-count{color:#B4637A}
  .zukan-sec{margin-bottom:16px;content-visibility:auto;contain-intrinsic-size:auto 620px}
  .zukan-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
  .zs-title{font-size:15px;font-weight:700;letter-spacing:.06em;color:#5E544E}
  .zs-count{font-size:12px;font-weight:700;color:#9C8F86}
  .zukan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .ztile{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    aspect-ratio:3 / 4;padding:6px 4px;
    background:#fff;border:2px solid var(--line);border-radius:16px;
    box-shadow:0 3px 10px rgba(120,101,90,.06);
    font-family:inherit;cursor:pointer;transition:transform .12s ease;
  }
  .ztile:active{transform:scale(.96)}
  .ztile.locked{background:#FBF7EF;border-style:dashed;box-shadow:none;cursor:default}
  .zt-emoji{font-size:23px;line-height:1}
  .zt-name{
    font-size:9px;font-weight:700;color:var(--ink);line-height:1.2;text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .zt-stars{font-size:8px;color:#9C7326;letter-spacing:.02em}
  .ztile.locked .zt-name{color:#857A70}
  .ztile.r1{border-color:#F6DCE3;background:linear-gradient(180deg,#fff 58%,var(--pink-l))}
  .ztile.r2{border-color:#D8EDE5;background:linear-gradient(180deg,#fff 60%,var(--mint-l))}
  .ztile.r3{border-color:#F5E2B4;background:linear-gradient(180deg,#fff 50%,var(--mustard-l))}
  .ztile.r4{border-color:#DCC7EF;background:linear-gradient(180deg,#fff 40%,#F3E8FB 70%,#E4F3EE)}
  .zt-count{
    position:absolute;top:5px;right:5px;font-size:9.5px;font-weight:700;
    background:var(--ink);color:#fff;border-radius:999px;padding:2px 6px;
  }
  .reset-btn{
    align-self:center;margin-top:auto;background:none;border:0;color:#9C8F86;
    font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.08em;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(84,75,70,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .overlay.open{display:flex;animation:screenIn .25s ease both}
  .gacha-panel{
    position:relative;width:100%;max-width:352px;
    background:linear-gradient(180deg,#FFFDF8,#FBF4E9);
    border-radius:34px;padding:20px 18px 18px;
    box-shadow:var(--shadow-lg);border:2px solid #fff;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .overlay-close{
    position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
    border:0;background:#F4EDE1;color:var(--ink2);font-size:16px;font-family:inherit;cursor:pointer;
  }
  .gacha-hint{margin:0;font-size:15px;font-weight:700;color:var(--ink2);text-align:center}

  .machine{position:relative;width:190px;height:200px;display:flex;align-items:flex-start;justify-content:center}
  .dome{
    position:relative;z-index:2;width:146px;height:146px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#EEF8F3 38%,#D6EEE4 100%);
    box-shadow:inset 0 -10px 22px rgba(124,188,166,.28),inset 0 8px 16px #fff,0 10px 22px rgba(120,101,90,.12);
    overflow:hidden;
  }
  .dome::after{
    content:"";position:absolute;left:22px;top:18px;width:44px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.85);transform:rotate(-28deg);
  }
  .dome-capsule{position:absolute;font-size:24px;line-height:1;transition:transform .3s}
  .dome-capsule.c1{left:52px;top:54px;font-size:34px}
  .dome-capsule.c2{left:22px;top:100px}
  .dome-capsule.c3{left:96px;top:104px}
  .dome-capsule.c4{left:100px;top:32px}
  .machine-base{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:140px;height:62px;border-radius:14px 14px 26px 26px;
    background:linear-gradient(180deg,#F2C4CE,#E3A6B4);
    box-shadow:0 6px 0 #CE8B9B,0 12px 20px rgba(206,139,155,.25),inset 0 2px 0 rgba(255,255,255,.6);
  }
  .knob{
    position:absolute;right:14px;top:12px;
    width:24px;height:24px;border-radius:50%;background:#FFF8F0;border:3px solid #E9C46A;
    box-shadow:0 2px 4px rgba(0,0,0,.08);
  }
  .knob::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:4px;border-radius:3px;background:#E9C46A;transform:translate(-50%,-50%) rotate(-20deg)}
  .outlet{
    position:absolute;left:16px;bottom:12px;
    width:48px;height:16px;border-radius:9px;background:#CE90A0;

  var THEMES = [["doubutsu","どうぶつ"],["tabemono","たべもの・スイーツ"],["norimono","のりもの"],["shizen","しぜん・うちゅう"],["otogi","おとぎばなし"],["gakkou","がっこう・ぶんぼうぐ"],["oshigoto","おしごと・なりたいもの"],["sports","スポーツ・あそび"],["kisetsu","きせつ・ぎょうじ"]];

  /* =========================================================

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function oneOf(list) { return list[Math.floor(Math.random() * list.length)]; }

  function stars(n) {
    var s = '';
    for (var i = 0; i < 4; i++) { s += (i < n ? '★' : '☆'); }
    return s;
  }

  /* =========================================================
     ほぞん (localStorage)
     ========================================================= */

  var STORE_KEY = 'kotoba-gacha-v2';
  var PREF_KEY = 'kotoba-gacha-v2-muted';
  var store = { owned: {}, pulls: 0, seen: [] };
  var muted = false;

  function freshStore() { return { owned: {}, pulls: 0, seen: [] }; }

  function loadStore() {
    store = freshStore();
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data && data.owned && typeof data.owned === 'object') { store.owned = data.owned; }
        if (data && typeof data.pulls === 'number') { store.pulls = data.pulls; }
        if (data && Object.prototype.toString.call(data.seen) === '[object Array]') {
          store.seen = data.seen.slice();
        }
      }
    } catch (e) { store = freshStore(); }
  }

  function saveStore() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }

  function loadPref() {
    try { return window.localStorage.getItem(PREF_KEY) === '1'; } catch (e) { return false; }
  }

  function savePref() {
    try { window.localStorage.setItem(PREF_KEY, muted ? '1' : '0'); } catch (e) {}
  }

  function ownedCount() { return Object.keys(store.owned).length; }

  /* =========================================================
     おと (Web Audio API)
     ========================================================= */

  var actx = null;

  function ensureAudio() {
    if (actx) {
      if (actx.state === 'suspended' && actx.resume) {
        try { actx.resume(); } catch (e) {}
      }
      return actx;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { actx = new AC(); }
    } catch (e) { actx = null; }
    return actx;
  }

  function tone(freq, delay, dur, opts) {
    if (muted) { return; }
    var ctx = ensureAudio();
    if (!ctx) { return; }
    opts = opts || {};
    try {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var t0 = ctx.currentTime + delay;
      var vol = (opts.vol === undefined) ? 0.16 : opts.vol;
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (opts.to) { osc.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur); }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function playTap() { tone(720, 0, 0.07, { vol: 0.05, type: 'sine' }); }

  function playCorrect() {
    tone(988, 0, 0.16, { vol: 0.15, type: 'sine' });

    var notes = [880, 1108.7, 1318.5, 1760];

    tone(3520, 0.55, 0.5, { vol: 0.03, type: 'sine' });

    for (var i = 0; i < 9; i++) {

    var w = window.innerWidth || 375;
    var h = window.innerHeight || 700;
    fx.width = Math.floor(w * dpr);

        life: 1
      });
    }
    if (!rafId) { rafId = window.requestAnimationFrame(tick); }
  }

  function tick() {
    rafId = null;
    if (!fxctx) { parts = []; return; }
    fxctx.clearRect(0, 0, window.innerWidth || 375, window.innerHeight || 700);
    var alive = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= 0.007;
      if (p.life <= 0 || p.y > (window.innerHeight || 700) + 40) { continue; }
      fxctx.save();
      fxctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxctx.translate(p.x, p.y);
      fxctx.rotate(p.rot);
      fxctx.fillStyle = p.color;
      if (p.star) {
        fxctx.font = (p.size * 2.1) + 'px sans-serif';
        fxctx.fillText('✦', -p.size, p.size);
      } else if (p.shape === 'circle') {
        fxctx.beginPath();
        fxctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        fxctx.fill();
      } else {
        fxctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.55);
      }
      fxctx.restore();
      alive.push(p);
    }
    parts = alive;
    if (parts.length) { rafId = window.requestAnimationFrame(tick); }
  }

  function celebrate() {
    sizeFx();
    var w = window.innerWidth || 375;
    var h = window.innerHeight || 700;
    burst(w * 0.5, h * 0.32, 42, 1);

  /* =========================================================
     クイズ
     ========================================================= */

  var session = null;

  function seenMap() {
    var m = {};
    for (var i = 0; i < store.seen.length; i++) { m[store.seen[i]] = 1; }
    return m;
  }

  function pickQuestions() {
    var seen = seenMap();
    var pool = [];
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (!seen[QUESTIONS[i].i]) { pool.push(QUESTIONS[i]); }
    }
    if (pool.length < 3) {
      store.seen = [];
      saveStore();
      pool = QUESTIONS.slice();
    }
    var bag = shuffle(pool.slice());
    var picked = [];
    var usedTypes = {};
    var k;
    for (k = 0; k < bag.length && picked.length < 3; k++) {
      if (usedTypes[bag[k].t]) { continue; }
      usedTypes[bag[k].t] = 1;
      picked.push(bag[k]);
    }
    for (k = 0; k < bag.length && picked.length < 3; k++) {
      if (picked.indexOf(bag[k]) < 0) { picked.push(bag[k]); }
    }
    return picked;
  }

  function updateDots() {
    for (var i = 0; i < 3; i++) {
      var dot = $('dot' + i);
      if (!dot || !dot.classList) { continue; }
      dot.className = 'dot';
      if (i < session.i) { dot.classList.add('on'); }
      else if (i === session.i) { dot.classList.add('now'); }
    }
  }

  function updateCombo() {
    var badge = $('comboBadge');
    if (!badge) { return; }
    if (session && session.combo >= 2) {
      badge.textContent = '🔥' + session.combo + 'れんぞく！';
      badge.classList.add('show');
    } else {
      badge.textContent = '';
      badge.classList.remove('show');
    }
  }

  function startMission() {
    session = { list: pickQuestions(), i: 0, combo: 0, best: 0, hardClear: 0, locked: false };
    updateCombo();
    hideStamp();
    renderQuestion();
    showScreen('screen-quiz');
  }

  function renderQuestion() {
    var q = session.list[session.i];
    if (!q) { return; }
    session.locked = false;

    var kindNode = $('qKind');
    kindNode.textContent = q.g || '';
    kindNode.className = 'q-kind t-' + q.t;

    var isHard = q.lv === 'hard';
    $('hardRow').className = 'hard-row' + (isHard ? ' on' : '');
    $('qCard').className = 'q-card' + (isHard ? ' hard' : '');

    var body = $('qBody');
    body.innerHTML = '';

    var choicesEl = $('choices');
    choicesEl.innerHTML = '';
    choicesEl.className = 'choices' + (q.t === 'nakama' ? ' grid2' : '');

    var i, ch;

    if (q.t === 'moji') {
      body.appendChild(el('div', 'q-emoji', q.e));
      var word = el('div', 'q-word');
      for (i = 0; i < q.w.length; i++) {
        if (i === q.h) { word.appendChild(el('span', 'q-hole', '?')); }
        else { word.appendChild(el('span', 'q-char', q.w.charAt(i))); }
      }
      body.appendChild(word);
      body.appendChild(el('p', 'q-hint', 'はてな マークに はいる もじは どれ？'));
    } else if (q.t === 'hantai' || q.t === 'nita') {
      body.appendChild(el('div', 'q-bigword', q.w));
      body.appendChild(el('p', 'q-hint', q.t === 'hantai'
        ? '「' + q.w + '」の はんたいは どれ？'
        : '「' + q.w + '」と にた いみの ことばは どれ？'));
    } else if (q.t === 'kazo') {
      body.appendChild(el('div', 'q-emoji', q.e));
      body.appendChild(el('div', 'q-bigword', q.w));
      body.appendChild(el('p', 'q-hint', '「' + q.w + '」を 1つ かぞえると？'));
    } else if (q.t === 'kanji') {
      body.appendChild(el('div', 'q-bigword kanji', q.w));
      body.appendChild(el('p', 'q-hint', 'この かんじ、なんと よむ？'));
    } else if (q.t === 'nakama') {
      body.appendChild(el('p', 'q-hint', 'おなじ なかまじゃ ないのは どれ？'));
    } else if (q.t === 'kanyouku') {
      body.appendChild(el('p', 'q-quote', '「' + q.p + '」'));
      body.appendChild(el('p', 'q-hint', 'この ことばの いみは どれ？'));
    } else if (q.t === 'kotowaza') {
      body.appendChild(el('p', 'q-quote', '「' + q.p + '」'));
      body.appendChild(el('p', 'q-hint', '（　）に はいる ことばは どれ？'));
    } else if (q.t === 'nazo') {
      body.appendChild(el('p', 'q-prompt big', q.p));
    } else {
      body.appendChild(el('p', 'q-prompt big', q.p));
      body.appendChild(el('p', 'q-hint', '（　）に はいる ことばは どれ？'));
    }

    var opts = [];
    for (i = 0; i < q.c.length; i++) {
      opts.push({ v: q.c[i], ok: i === q.a });
    }
    shuffle(opts);

    var isTile = q.t === 'nakama';
    var longest = 0;
    for (i = 0; i < opts.length; i++) {
      var probe = (opts[i].v && typeof opts[i].v === 'object') ? opts[i].v[1] : String(opts[i].v);
      if (probe.length > longest) { longest = probe.length; }
    }
    var useLong = !isTile && longest > 8;

    for (i = 0; i < opts.length; i++) {
      (function (o) {
        var label = (o.v && typeof o.v === 'object') ? o.v[1] : String(o.v);
        var btn = el('button', 'choice');
        btn.type = 'button';
        if (o.v && typeof o.v === 'object') {
          btn.className = 'choice tile';
          btn.appendChild(el('span', 'c-emoji', o.v[0]));
          btn.appendChild(el('span', 'c-label', label));
        } else {
          if (useLong) { btn.className = 'choice long'; }
          btn.appendChild(el('span', 'c-label', label));
        }
        btn.addEventListener('click', function () { choose(btn, o.ok); });
        choicesEl.appendChild(btn);
      })(opts[i]);
    }

    updateDots();
  }

  function markSeen(id) {
    if (store.seen.indexOf(id) >= 0) { return; }
    store.seen.push(id);
    if (store.seen.length > QUESTIONS.length) { store.seen.shift(); }
    saveStore();
  }

  function choose(btn, ok) {
    if (!session || session.locked) { return; }
    if (btn.classList.contains('done') || btn.classList.contains('correct')) { return; }
    var q = session.list[session.i];

    if (ok) {
      session.locked = true;
      btn.classList.add('correct', 'done');
      session.combo += 1;
      if (session.combo > session.best) { session.best = session.combo; }
      updateCombo();
      markSeen(q.i);

      if (q.lv === 'hard') {
        session.hardClear += 1;
        playHardClear();
        superCelebrate();
        stamp('ok', 'すごい！', 'むずかしいの クリア！', 1850, 'hard');
      } else {
        playCorrect();
        celebrate();
        stamp('ok', 'せいかい！', q.pr, 1500);
      }

      var sess = session;
      setTimeout(function () {
        if (session === sess) { nextQuestion(); }
      }, (q.lv === 'hard') ? 1950 : 1650);
    } else {
      btn.classList.add('wrong', 'done');
      btn.disabled = true;
      session.combo = 0;
      updateCombo();
      playWrong();
      shake($('qCard'));
      stamp('no', 'おしい！', 'もう いっかい！', 950);
    }
  }

  function nextQuestion() {
    if (!session) { return; }
    hideStamp();
    session.i += 1;
    if (session.i >= session.list.length) { showClear(); return; }
    renderQuestion();

  function showClear() {
    var stats = $('clearStats');

    if (session.best >= 3) { txt = '<b>3もん</b> れんぞく せいかい！パーフェクト！'; }
    else if (session.best === 2) { txt = '<b>2れんぞく</b> せいかい！よく がんばったね'; }
    else { txt = '3もん クリア！よく がんばったね'; }
    if (session.hardClear > 0) {
      txt += '<br>🔥 むずかしいの <b>' + session.hardClear + 'もん</b> クリア！';
    }
    stats.innerHTML = txt;

    var left = QUESTIONS.length - store.seen.length;
    $('clearLeft').innerHTML = left > 0
      ? 'まだ <b>' + left + 'もん</b> のこってるよ'
      : 'ぜんぶ の もんだい に チャレンジ したね！';

    roundPulled = false;
    refreshClearButton();
    $('gachaPanel').classList.remove('revealed');
    showScreen('screen-clear');
    playFanfare();
    celebrate();

  var pulling = false;
  var roundPulled = false;

  function refreshClearButton() {
    var b = $('btnGacha');
    if (b) { b.textContent = roundPulled ? 'もう 1かい あそぶ' : 'ガチャを まわす！'; }
  }

  function rarityOfRoll() {
    var r = Math.random();
    if (r < 0.04) { return 4; }
    if (r < 0.17) { return 3; }
    if (r < 0.45) { return 2; }
    return 1;
  }

  function rollCard() {
    var rarity = rarityOfRoll();
    var pool = [], fresh = [], i;
    for (i = 0; i < CARDS.length; i++) {
      if (CARDS[i].r === rarity) { pool.push(CARDS[i]); }
    }
    if (!pool.length) { pool = CARDS.slice(); }
    for (i = 0; i < pool.length; i++) {
      if (!store.owned[pool[i].id]) { fresh.push(pool[i]); }
    }
    if (!fresh.length) {
      for (i = 0; i < CARDS.length; i++) {
        if (!store.owned[CARDS[i].id]) { fresh.push(CARDS[i]); }
      }
    }
    var card = fresh.length ? oneOf(fresh) : oneOf(pool);
    var isNew = !store.owned[card.id];
    store.owned[card.id] = (store.owned[card.id] || 0) + 1;
    store.pulls += 1;
    saveStore();
    return { card: card, isNew: isNew, count: store.owned[card.id] };
  }

  function cardNode(card, opts) {
    opts = opts || {};
    var node = el('div', 'kcard rarity-' + card.r);
    var top = el('div', 'kcard-top');
    top.appendChild(el('span', 'kstars', stars(card.r)));
    if (opts.isNew) { top.appendChild(el('span', 'knew', 'NEW')); }
    node.appendChild(top);
    node.appendChild(el('span', 'ktheme', (THEME_NAME[card.th] || '') + '・' + RARITY_NAME[card.r]));
    if (opts.count > 1) { node.appendChild(el('span', 'kcount', '×' + opts.count)); }
    node.appendChild(el('div', 'kemoji', card.e));
    node.appendChild(el('div', 'kname', card.n));
    if (opts.full) {
      node.appendChild(el('p', 'kpraise', card.pr));
      node.appendChild(el('p', 'kfact', 'まめちしき：' + card.fa));
    }
    return node;
  }

  function openGacha() {
    pulling = false;
    var panel = $('gachaPanel');
    panel.classList.remove('revealed');
    $('gachaMachine').classList.remove('spin');
    $('gachaHint').textContent = 'ガチャを まわしてね！';

    $('gachaOverlay').classList.add('open');
    playTap();

  function closeGacha() {

    $('gachaMachine').classList.remove('spin');
    pulling = false;
    updateCounts();

  function pullGacha() {
    if (pulling) { return; }
    pulling = true;
    $('btnPull').disabled = true;
    $('gachaHint').textContent = 'うーん… なにが でるかな？';
    $('gachaMachine').classList.add('spin');
    playGacha();
    setTimeout(function () { revealCard(); }, 1150);

  function revealCard() {
    var res = rollCard();
    var card = res.card;
    $('gachaMachine').classList.remove('spin');
    $('gachaPanel').classList.add('revealed');

    var box = $('reveal');
    box.innerHTML = '';

    if (card.r === 4) { note = '✨ ひみつの カードを ゲット！'; }
    else if (res.isNew) { note = 'あたらしい カードを ゲット！'; }
    else { note = 'もってる カード！もう 1まい ふえたよ'; }
    box.appendChild(el('p', 'reveal-note', note));

    cardBox.classList.add('popIn');

    var total = ownedCount();

      showScreen('screen-zukan');

    actions.appendChild(toZukan);

     ずかん

  function updateCounts() {
    var text = ownedCount() + ' / ' + CARDS.length;
    if ($('startCount')) { $('startCount').textContent = text; }
    if ($('zukanCount')) { $('zukanCount').textContent = text; }
  }

  function renderZukan() {
    zukanFilter = zukanFilter || 'all';
    renderFilters();
    renderZukanGrid();
    updateCounts();
  }

  function themeStats(themeId) {
    var total = 0, have = 0;
    for (var i = 0; i < CARDS.length; i++) {
      if (CARDS[i].th === themeId) {
        total++;
        if (store.owned[CARDS[i].id]) { have++; }
      }
    }
    return [have, total];
  }

  function renderFilters() {
    var host = $('zukanFilters');
    if (!host) { return; }
    host.innerHTML = '';
    var defs = [['all', 'ぜんぶ', ownedCount(), CARDS.length]];
    for (var t = 0; t < THEMES.length; t++) {
      var st = themeStats(THEMES[t][0]);
      defs.push([THEMES[t][0], THEMES[t][1], st[0], st[1]]);
    }
    for (var d = 0; d < defs.length; d++) {
      (function (def) {
        var b = el('button', 'zfilter' + (zukanFilter === def[0] ? ' active' : ''));
        b.type = 'button';
        b.appendChild(el('span', 'zf-label', def[1]));
        b.appendChild(el('span', 'zf-count', def[2] + '/' + def[3]));
        b.addEventListener('click', function () {
          zukanFilter = def[0];
          renderZukan();
          $('zukanScroll').scrollTop = 0;
          playTap();
        });
        host.appendChild(b);
      })(defs[d]);
    }
  }

  function renderZukanGrid() {
    var host = $('zukanGrid');
    host.innerHTML = '';
    for (var t = 0; t < THEMES.length; t++) {
      var themeId = THEMES[t][0];
      if (zukanFilter !== 'all' && zukanFilter !== themeId) { continue; }
      var cards = [];
      for (var i = 0; i < CARDS.length; i++) {
        if (CARDS[i].th === themeId) { cards.push(CARDS[i]); }
      }
      var st = themeStats(themeId);

      var sec = el('div', 'zukan-sec');
      var head = el('div', 'zukan-sec-head');
      head.appendChild(el('span', 'zs-title', THEMES[t][1]));
      head.appendChild(el('span', 'zs-count', st[0] + ' / ' + st[1]));
      sec.appendChild(head);

      var grid = el('div', 'zukan-grid');
      for (var k = 0; k < cards.length; k++) {
        (function (card) {
          var own = store.owned[card.id] || 0;
          var tile = el('button', 'ztile' + (own ? ' r' + card.r : ' locked'));
          tile.type = 'button';
          tile.setAttribute('data-card', card.id);
          if (own) {
            tile.appendChild(el('span', 'zt-emoji', card.e));
            tile.appendChild(el('span', 'zt-name', card.n));

            tile.appendChild(el('span', 'zt-emoji', '❔'));
            tile.appendChild(el('span', 'zt-name', '？？？'));
            tile.appendChild(el('span', 'zt-stars', stars(card.r)));
            tile.disabled = true;
          }
          grid.appendChild(tile);
        })(cards[k]);
      }
      sec.appendChild(grid);
      host.appendChild(sec);
    }
  }

  function bind(id, fn) {
    var node = $(id);

  function init() {
    loadStore();
    muted = loadPref();

    var muteBtn = $('btnMute');
    if (muteBtn) {
      muteBtn.textContent = muted ? '🔇' : '🔊';
      if (muted) { muteBtn.classList.add('off'); }
    }

    bind('btnStart', function () { playTap(); startMission(); });
    bind('btnZukan', function () { playTap(); renderZukan(); showScreen('screen-zukan'); });
    bind('btnZukanBack', function () { playTap(); updateCounts(); showScreen('screen-start'); });
    bind('btnQuit', function () { hideStamp(); session = null; showScreen('screen-start'); updateCounts(); });
    bind('btnGacha', function () {
      playTap();
      if (roundPulled) { startMission(); } else { openGacha(); }
    });
    bind('btnHome', function () { playTap(); showScreen('screen-start'); updateCounts(); });
    bind('btnPull', pullGacha);
    bind('btnCloseGacha', function () { closeGacha(); showScreen('screen-clear'); });
    bind('btnReset', askReset);
    bind('btnCancelReset', function () { $('confirmOverlay').classList.remove('open'); });
    bind('btnDoReset', doReset);
    bind('btnMute', toggleMute);

    var cardOverlay = $('cardOverlay');
    if (cardOverlay && cardOverlay.addEventListener) {
      cardOverlay.addEventListener('click', function (ev) {
        if (ev && ev.target === cardOverlay) { cardOverlay.classList.remove('open'); }
      });
    }

    var unlock = function () { ensureAudio(); };
    if (document.addEventListener) {
      document.addEventListener('pointerdown', unlock);
      document.addEventListener('touchstart', unlock);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { if (fxctx) { sizeFx(); } });
    }

    updateCounts();
    showScreen('screen-start');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* けんさく用 */
  window.__kotobaApp = {
    questions: QUESTIONS,
    cards: CARDS,
    themes: THEMES,
    storeOf: function () { return store; },
    rollCard: rollCard,
    pickQuestions: pickQuestions,
    current: function () { return (session && session.list[session.i]) || null; },
    queueOf: function () { return session ? session.list : null; },
    index: function () { return session ? session.i : -1; },
    sessionOf: function () { return session; },
    isMuted: function () { return muted; },
    cardById: function (id) {
      for (var i = 0; i < CARDS.length; i++) { if (CARDS[i].id === id) { return CARDS[i]; } }
      return null;
    }
  };
})();
</script>
</body>
</html>
